## 🗣 Монолог для защиты (~300 символов)

> hotel-service — микросервис каталога отелей. Deployment с одной репликой запускает локальный образ src-hotel-service на порту 8082. Адрес и порт PostgreSQL берутся из ConfigMap, креды — из Secret, имя БД hotels_db задано в манифесте, так как у каждого сервиса своя БД. Service ClusterIP делает его доступным изнутри кластера; снаружи к нему обращаются только через gateway-service.

*(длина ~430 символов, могу сократить до 300)*

