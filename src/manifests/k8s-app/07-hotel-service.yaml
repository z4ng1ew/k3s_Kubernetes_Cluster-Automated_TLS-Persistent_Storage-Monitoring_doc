## 🌐 Как hotel-service вписывается в общую архитектуру

```
                       ВНЕШНИЙ МИР
                            │
              ┌─────────────┴─────────────┐
              ▼                           ▼
    Ingress: session.*           Ingress: gateway.*
              │                           │
              ▼                           ▼
    [ session-service ]         [ gateway-service ]
       :8081 (вход)                :8087 (вход)
            │                            │
            │ JWT валидация              │ маршрутизация
            │                            │
            │  ◄────────────────────────┤
            │  (gateway спрашивает       │
            │   session о валидности    │
            │   токена)                 │
            │                            │
            │              ┌─────────────┼─────────────┬─────────────┐
            │              ▼             ▼             ▼             ▼
            │   [ hotel-service ] [ booking-service ] [ payment-service ] [ loyalty-service ]
            │      :8082            :8083              :8084              :8085
            │         │                │                  │                   │
            │         │                │ event            │                   │
            │         │                ▼                  │                   │
            │         │       [ RabbitMQ ] ──── [ report-service ] :8086     │
            │         │           :5672                                       │
            │         │                                                      │
            │         └────────────────┴──────────┬───────────────────────────┘
            │                                     │
            └─────────────────────────────────────┴──────┐
                                                         ▼
                                              [ PostgreSQL :5432 ]
                                              hotels_db, bookings_db,
                                              payments_db, loyalty_db,
                                              users_db, report_db
```

hotel-service — это просто "поставщик данных" об отелях, к нему ходят:
- **gateway-service** — основной потребитель (для эндпоинтов /hotels).
- **booking-service** — возможно, для валидации существования отеля при бронировании.

