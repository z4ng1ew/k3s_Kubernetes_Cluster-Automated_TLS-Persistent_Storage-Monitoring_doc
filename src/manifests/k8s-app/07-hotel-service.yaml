apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hotel-service }
  template:
    metadata:
      labels: { app: hotel-service }
    spec:
      containers:
        - name: hotel-service
          image: src-hotel-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: hotels_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  selector: { app: hotel-service }
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP



# 📝 Построчный разбор Deployment + Service для hotel-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment hotel-service
# Микросервис управления отелями: каталог, поиск, информация
# по конкретному отелю. Stateless: данные в PostgreSQL, в памяти
# ничего не хранит.
#
# В Postman: запросы Get Hotels и Get Hotel идут на gateway,
# который проксирует их сюда. Прямого доступа из Postman нет —
# только через gateway-service (порт 8087).
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: hotel-service                # Имя Deployment'а.
                                     # Совпадает с именем Service ниже — типовая практика.
  labels: { app: hotel-service }     # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ hotel-service — read-heavy (90% запросов = SELECT).
                                     # В продакшне горизонтально масштабируется ОТЛИЧНО:
                                     # 5-10 реплик за Service'ом, балансировка round-robin,
                                     # никакого состояния в памяти.
  selector:
    matchLabels: { app: hotel-service }
                                     # Селектор: какие поды считать "своими" для Deployment.
  template:                          # Шаблон пода — то, ЧТО создавать.
    metadata:
      labels: { app: hotel-service } # Метка пода. Совпадает с селектором — иначе не свяжутся.
    spec:
      containers:
        - name: hotel-service        # Имя контейнера внутри пода.
          image: src-hotel-service:latest
                                     # Локальный Docker-образ из проекта DO10.
                                     # Spring Boot приложение, упакованное в Docker.
                                     # Собирается через docker build в директории
                                     # services/hotel-service/.
          imagePullPolicy: Never     # Использовать ТОЛЬКО локальный образ.
                                     # Образ должен быть импортирован в containerd k3s:
                                     #   k3s ctr images import hotel-service.tar
                                     # Иначе ErrImageNeverPull при старте.
          ports:
            - containerPort: 8082    # Порт, на котором слушает Spring Boot.
                                     # Прописан в application.yml сервиса:
                                     #   server.port=8082
                                     # Согласован с ConfigMap (HOTEL_SERVICE_PORT: "8082").
          env:                       # Переменные окружения для конфигурации.

            # ----- Подключение к PostgreSQL -----
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST # → "postgres"
                                     # DNS-имя Service'а PostgreSQL внутри кластера.
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432" (строка).
            - name: POSTGRES_DB
              value: hotels_db       # ⚠️ Plain value — отличается от других сервисов!
                                     # Каждый сервис ходит в свою БД:
                                     #   session-service  → users_db
                                     #   hotel-service    → hotels_db    ← вот эта
                                     #   booking-service  → bookings_db
                                     #   payment-service  → payments_db
                                     #   loyalty-service  → loyalty_db
                                     #   report-service   → report_db
                                     # БД hotels_db создаётся init-скриптом в образе src-postgres.

            # ----- Учётные данные PostgreSQL -----
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Логин postgres из Secret (base64 → "postgres").
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для hotel-service
# Даёт стабильное DNS-имя "hotel-service:8082" внутри кластера.
# По этому имени gateway-service ходит к нему за каталогом отелей.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: hotel-service                # КЛЮЧЕВОЕ! По имени обращаются другие сервисы.
                                     # В ConfigMap: HOTEL_SERVICE_HOST: hotel-service
                                     # CoreDNS резолвит "hotel-service" → ClusterIP Service'а.
                                     # gateway-service делает HTTP GET:
                                     #   http://hotel-service:8082/api/v1/hotels
  labels: { app: hotel-service }     # Метка на Service'е.
spec:
  selector: { app: hotel-service }   # Трафик идёт в поды с этим лейблом.
  ports:
    - port: 8082                     # Порт Service'а — то, что видят другие поды.
                                     #   http://hotel-service:8082
      targetPort: 8082               # Порт пода (= containerPort из Deployment).
                                     # Совпадение port == targetPort = единообразие.
                                     # Могло быть и иначе, например:
                                     #   port: 80, targetPort: 8082 — Service на 80,
                                     #   но в подах приложение на 8082. Лишний уровень
                                     #   абстракции для лабы не нужен.
  type: ClusterIP                    # Только из кластера.
                                     # ⚠️ hotel-service — ВНУТРЕННИЙ микросервис!
                                     # Снаружи к нему НЕ ходят (нет Ingress).
                                     # Только gateway-service вызывает его через ClusterIP.
                                     # Это правильная архитектура: внешний доступ
                                     # ТОЛЬКО через gateway, остальные скрыты.
```

