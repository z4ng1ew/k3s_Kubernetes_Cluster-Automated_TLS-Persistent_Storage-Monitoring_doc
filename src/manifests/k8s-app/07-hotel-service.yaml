## 💡 Возможные вопросы на защите

**В1: Чем этот манифест отличается от session-service?**
> Всего три отличия:
> 1. **Имена ресурсов**: hotel-service вместо session-service.
> 2. **Образ**: `src-hotel-service:latest` (своя кодовая база).
> 3. **Порт**: 8082 вместо 8081 (согласовано с ConfigMap).
> 4. **БД**: `hotels_db` вместо `users_db` (изоляция данных).
> 
> Структура идентична — это **типовой шаблон Spring Boot микросервиса в k8s**. Все 6 микросервисов проекта повторяют один и тот же паттерн с небольшими вариациями.

**В2: Почему `replicas: 1`, если hotel-service stateless и легко масштабируется?**
> Только из-за ограничений лабораторного кластера: у меня 3 узла k3s с минимальными ресурсами, и поднимать по 3 пода на каждый из 6 сервисов = 18 подов только под бизнес-логику + БД + RabbitMQ + Ingress + cert-manager + monitoring. Это перегруз кластера.
> 
> В продакшне для read-heavy сервисов типа hotel-service:
> - **Минимум 2 реплики** для отказоустойчивости.
> - **HPA** (Horizontal Pod Autoscaler) — автомасштабирование по CPU/RPS.
> - Можно держать 3-10 реплик в зависимости от нагрузки.

**В3: Зачем hotel-service отдельная БД? Не проще ли одна общая?**
> Это **Database per Service** — один из ключевых принципов микросервисной архитектуры:
> 
> 1. **Изоляция данных**: hotel-service не может случайно или специально полезть в чужие таблицы.
> 2. **Независимая эволюция схем**: можно делать миграции в hotels_db без согласования с другими командами.
> 3. **Возможность подмены БД**: завтра hotel-service переедет с PostgreSQL на MongoDB — никто не пострадает.
> 4. **Производительность**: можно тюнить hotels_db под read-нагрузку (индексы, репликация), а bookings_db — под транзакции.
> 
> Общая БД = **distributed monolith**, антипаттерн.

**В4: Почему hotel-service не нужен в Ingress?**
> Потому что у него **нет прямого внешнего интерфейса**. Все запросы клиентов идут через gateway-service, который:
> 1. Принимает HTTP-запросы извне.
> 2. Аутентифицирует (через session-service).
> 3. Маршрутизирует на нужный backend (hotel-service, booking-service и т.д.).
> 4. Может агрегировать ответы от нескольких сервисов.
> 5. Применяет rate limiting, кеширование, логирование.
> 
> Это паттерн **API Gateway**. Внутренние сервисы спрятаны за ним — это безопаснее (меньше attack surface) и удобнее (один URL для клиента).

**В5: Что произойдёт, если hotel-service упадёт?**
> 1. Pod упадёт → Deployment контроллер заметит → создаст новый под (replicas: 1 надо поддерживать).
> 2. Между падением и стартом нового пода (~10-30 секунд) Service не имеет endpoint'ов → kube-proxy возвращает connection refused.
> 3. gateway-service получит ошибку → должен отдать клиенту 502/503/504 (зависит от реализации).
> 4. Postman-тесты на /hotels провалятся в этот промежуток.
> 
> Для смягчения проблемы:
> - **Несколько реплик** — отказоустойчивость.
> - **Circuit breaker** в gateway (Resilience4j) — быстро отдавать кешированные данные или ошибку.
> - **Retry с backoff** — попробовать ещё раз через секунду.

**В6: Как hotel-service узнаёт, где найти PostgreSQL?**
> Через ConfigMap → env переменную → application.yml:
> ```yaml
> spring:
>   datasource:
>     url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
>     username: ${POSTGRES_USER}
>     password: ${POSTGRES_PASSWORD}
> ```
> 
> При старте Spring Boot подставит:
> - `POSTGRES_HOST` = "postgres" (имя Service).
> - `POSTGRES_PORT` = "5432".
> - `POSTGRES_DB` = "hotels_db".
> 
> Финальный URL: `jdbc:postgresql://postgres:5432/hotels_db`.
> CoreDNS резолвит "postgres" в ClusterIP Service'а → kube-proxy на под PostgreSQL.

**В7: Что будет, если БД `hotels_db` не существует?**
> Spring Boot при первом подключении получит `FATAL: database "hotels_db" does not exist`. Приложение упадёт с `Failed to initialize JPA EntityManagerFactory`.
> 
> k8s увидит crash → перезапустит под → второй crash → третий → CrashLoopBackOff (экспоненциальная задержка между рестартами).
> 
> Решение:
> 1. Init-скрипт в образе src-postgres создаёт все БД при первом запуске PostgreSQL.
> 2. Liquibase / Flyway внутри hotel-service применяет миграции (создание таблиц).
> 3. Init container в hotel-service может проверить наличие БД до старта.

**В8: Как защитить hotel-service от прямого доступа в обход gateway?**
> k8s даёт несколько уровней:
> 
> 1. **Service type: ClusterIP** (уже есть) — недоступен извне напрямую.
> 2. **NetworkPolicy** — белый список: hotel-service принимает трафик ТОЛЬКО от подов с лейблом `app: gateway-service`:
> ```yaml
> apiVersion: networking.k8s.io/v1
> kind: NetworkPolicy
> spec:
>   podSelector:
>     matchLabels: { app: hotel-service }
>   ingress:
>     - from:
>         - podSelector:
>             matchLabels: { app: gateway-service }
> ```
> 3. **Service mesh** (Istio/Linkerd) — mTLS между сервисами, RBAC на уровне сервиса.
> 4. **Внутренний JWT** между сервисами (как у нас GATEWAY_SERVICE_UUID).

**В9: Что произойдёт, если запустить две реплики hotel-service с одной БД?**
> Всё работает отлично! Это **stateless архитектура** во всей красе:
> - Оба пода получают одинаковую конфигурацию.
> - Оба коннектятся к одному PostgreSQL.
> - Service балансирует round-robin: запрос 1 → pod 1, запрос 2 → pod 2, и т.д.
> - PostgreSQL обрабатывает параллельные запросы (несколько коннектов).
> 
> Подводные камни:
> - **Connection pool**: каждый под открывает свой пул (например, 10 коннектов) → суммарно 20 → может упереться в `max_connections` PostgreSQL (по умолчанию 100).
> - **Кеш**: если в hotel-service есть локальный кеш в памяти (Caffeine, EhCache) — два пода будут иметь разные кеши. Решение: распределённый кеш (Redis) или принять eventual consistency.

**В10: Какой namespace используется для всех ресурсов? Должны ли они быть в одном?**
> Все ресурсы в `default` (namespace не указан → default).
> 
> Это работает, но не идеально. Правильнее:
> ```yaml
> metadata:
>   namespace: booking-app
> ```
> Преимущества выделенного namespace:
> 1. **Изоляция**: легко удалить весь проект `kubectl delete ns booking-app`.
> 2. **RBAC**: можно дать команде права только на свой namespace.
> 3. **Quota**: ResourceQuota на CPU/RAM для всего приложения.
> 4. **NetworkPolicy**: проще писать правила по namespace.
> 5. **Monitoring**: легче группировать метрики.
> 
> Для лабы default — приемлемо.

