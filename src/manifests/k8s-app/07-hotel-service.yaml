## 🔗 Путь запроса Postman → hotel-service

В отличие от session-service, к hotel-service **нет прямого внешнего доступа**. Запросы идут через gateway:

```
   [ Postman ]
            │
            │ GET https://gateway.10.174.8.95.nip.io/api/v1/gateway/hotels
            │ Authorization: Bearer eyJhbGc...
            ▼
   [ DNS nip.io → 10.174.8.95 ]
            │
            ▼
   [ Ingress-Nginx ]
            │ TLS termination, host-routing
            │ → backend: gateway-service:8087
            ▼
   [ Service gateway-service (ClusterIP) ]
            │
            ▼
   [ Pod gateway-service-xxx ]
            │
            │ 1. Валидирует JWT-токен (или спрашивает session-service)
            │ 2. Решает: запрос /hotels → проксируем в hotel-service
            │
            │ HTTP GET http://hotel-service:8082/api/v1/hotels
            ▼
   [ CoreDNS: hotel-service → ClusterIP ]
            │
            ▼
   [ Service hotel-service (ClusterIP) ]
            │
            ▼
   [ Pod hotel-service-xxx ]
            │
            │ Spring Boot Controller обрабатывает запрос
            │
            │ JDBC: jdbc:postgresql://postgres:5432/hotels_db
            ▼
   [ Service postgres → Pod postgres ]
            │
            │ SELECT * FROM hotels;
            ▼
   [ Список отелей возвращается обратно по цепочке ]
            │
            ▼
   [ Postman: 200 OK + JSON со списком отелей ]
```

**Ключевое отличие от session-service:** snare к hotel-service не пробрасывается напрямую — он скрыт за gateway.

