apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBIT_MQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBIT_MQ_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP








# 📝 Построчный разбор Deployment + Service для RabbitMQ

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment RabbitMQ
# Запускает один под брокера сообщений RabbitMQ.
# RabbitMQ — это посредник между сервисами:
#   booking-service → RabbitMQ → report-service
# Используется для асинхронного обмена событиями.
# Образ alpine + management = с веб-интерфейсом для админки.
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1 (стабильная).
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: rabbitmq                     # Имя Deployment'а.
                                     # Совпадает с именем Service ниже — стандартная практика.
  labels: { app: rabbitmq }          # Метка на самом Deployment (inline-синтаксис YAML).
                                     # Эквивалент:
                                     #   labels:
                                     #     app: rabbitmq
                                     # Используется для kubectl-фильтрации:
                                     #   kubectl get deploy -l app=rabbitmq
spec:
  replicas: 1                        # Одна реплика.
                                     # RabbitMQ умеет в кластеризацию (несколько узлов),
                                     # но это сложная настройка с peer discovery, erlang cookie,
                                     # quorum queues. Для лабы достаточно одной.
                                     # ⚠️ Без cluster нет high availability: упал под →
                                     # очереди недоступны до перезапуска.
  selector:
    matchLabels: { app: rabbitmq }   # Селектор подов: какие поды "усыновлять".
  template:                          # ШАБЛОН пода.
    metadata:
      labels: { app: rabbitmq }      # Метка на поде. Совпадает с селектором (обязательно!).
    spec:
      containers:
        - name: rabbitmq             # Имя контейнера в поде.
          image: rabbitmq:3.12-management-alpine
                                     # Официальный образ RabbitMQ с Docker Hub.
                                     # Разбор тега:
                                     #   3.12        — версия RabbitMQ
                                     #   management  — включён плагин управления (Web UI + API)
                                     #   alpine      — лёгкий базовый образ (~50 МБ вместо ~200)
                                     # Без management суффикса доступ только через CLI/AMQP.
          imagePullPolicy: Never     # Использовать ТОЛЬКО локальный образ.
                                     # ⚠️ Тут это спорно: rabbitmq:3.12-management-alpine —
                                     # ПУБЛИЧНЫЙ образ из Docker Hub, его можно качать!
                                     # Корректнее IfNotPresent или Always.
                                     # Видимо, образ заранее импортирован в containerd ноды:
                                     #   k3s ctr images import rabbitmq.tar
                                     # При первом запуске с Never и без локального образа
                                     # под упадёт в ErrImageNeverPull.
          ports:
            - containerPort: 5672    # AMQP-порт — стандартный протокол RabbitMQ.
                                     # На этот порт коннектятся приложения (booking-service,
                                     # report-service) для отправки/получения сообщений.
            - containerPort: 15672   # Management UI — веб-интерфейс админки.
                                     # http://rabbitmq:15672 (внутри кластера)
                                     # Логин/пароль = те же, что DEFAULT_USER/PASS.
                                     # Удобно: можно смотреть очереди, exchange, метрики.
          env:                       # Переменные окружения для конфигурации RabbitMQ.
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_USER }
                                     # Имя пользователя по умолчанию.
                                     # Образ RabbitMQ читает эту env при ПЕРВОМ старте и
                                     # создаёт пользователя с этим именем.
                                     # У нас = "guest" (из Secret).
                                     # ⚠️ Без этой переменной создастся юзер guest по умолчанию,
                                     # но он работает ТОЛЬКО с localhost (loopback_users).
                                     # Когда мы явно создаём его через RABBITMQ_DEFAULT_USER,
                                     # этого ограничения нет.
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_PASSWORD }
                                     # Пароль пользователя по умолчанию.
                                     # У нас = "guest" (из Secret).
                                     # При первом старте сохранится в Mnesia (внутренняя БД
                                     # RabbitMQ), при последующих стартах env игнорируется.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для RabbitMQ
# Открывает два порта: AMQP (для приложений) и Management (для UI).
# ClusterIP — доступ только изнутри кластера.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Сервис = балансировщик + DNS-имя.
metadata:
  name: rabbitmq                     # КЛЮЧЕВОЕ! По этому имени сервисы коннектятся:
                                     #   ConfigMap: RABBIT_MQ_HOST: rabbitmq
                                     #   Spring: spring.rabbitmq.host=rabbitmq
                                     # CoreDNS резолвит "rabbitmq" → ClusterIP этого Service.
  labels: { app: rabbitmq }          # Метка на Service.
spec:
  selector: { app: rabbitmq }        # Трафик пойдёт в поды с этим лейблом.
  ports:                             # Несколько портов — поэтому каждый должен иметь name!
                                     # Если порт один — name необязателен.
    - name: amqp                     # Имя порта. Используется в EndpointSlice и в ссылках.
                                     # Например, в Ingress можно ссылаться:
                                     #   port: { name: amqp }
      port: 5672                     # Порт самого Service'а.
      targetPort: 5672               # Порт в поде, куда форвардить трафик.
    - name: management               # Второй порт — Management UI.
      port: 15672
      targetPort: 15672
                                     # Итого: на одном Service висят 2 порта.
                                     # Из кластера:
                                     #   tcp://rabbitmq:5672      → AMQP
                                     #   http://rabbitmq:15672    → Web UI
  type: ClusterIP                    # Тип ClusterIP — только изнутри кластера.
                                     # Брокер сообщений НЕ должен светиться наружу:
                                     # это инфраструктура, к ней ходят только сервисы.
                                     # Для просмотра Web UI с локального компа можно использовать:
                                     #   kubectl port-forward svc/rabbitmq 15672:15672
                                     # И открыть http://localhost:15672
```

---

## 🔗 Как RabbitMQ участвует в обмене сообщениями

```
   [ booking-service ]
            │
            │ 1. Создана бронь, надо уведомить report-service
            │    "publish" event в exchange "booking_statistics_exchange"
            ▼
   [ AMQP-клиент Spring Boot ] ────tcp:5672────▶ [ rabbitmq:5672 (Service) ]
                                                            │
                                                            ▼
                                              [ Pod rabbitmq-xxx-yyy ]
                                                            │
                                                            │ внутри RabbitMQ:
                                                            ▼
                                              ┌───────────────────────────┐
                                              │  Exchange:                │
                                              │  booking_statistics_exch  │
                                              │  type: direct/topic       │
                                              └────────────┬──────────────┘
                                                           │ routing по правилу binding
                                                           ▼
                                              ┌───────────────────────────┐
                                              │  Queue:                   │
                                              │  booking_statistics_queue │
                                              │  - сообщение #1           │
                                              │  - сообщение #2           │
                                              │  - сообщение #3           │
                                              └────────────┬──────────────┘
                                                           │ подписчик читает
                                                           ▼
                                              [ report-service подписан ]
                                              [ Spring AMQP Listener     ]
                                                           │
                                                           ▼
                                              [ Обработка статистики,    ]
                                              [ запись в БД и т.д.       ]


Параллельно, для админа:
   [ kubectl port-forward svc/rabbitmq 15672:15672 ]
            │
            ▼
   [ http://localhost:15672 в браузере ]
            │
            ▼
   [ Web UI RabbitMQ ]
   - Просмотр очередей, exchange
   - Создание/удаление вручную
   - Метрики, скорость потока сообщений
   - Управление пользователями
```

