## 💡 Возможные вопросы на защите

**В1: Что такое RabbitMQ и зачем он нужен в этой архитектуре?**
> RabbitMQ — это **message broker** (брокер сообщений). Он реализует асинхронный обмен между микросервисами по принципу publish-subscribe:
> - Producer (booking-service) кладёт сообщение в очередь и **сразу свободен** — не ждёт ответа.
> - Consumer (report-service) читает сообщение **когда сможет** — может тормозить, перезапускаться.
> 
> Преимущества:
> - **Развязка** сервисов: booking ничего не знает о report.
> - **Буферизация**: пиковая нагрузка не валит подписчиков.
> - **Гарантированная доставка**: сообщения хранятся до подтверждения.
> - **Масштабирование**: несколько consumer'ов читают одну очередь.

**В2: Почему `imagePullPolicy: Never` для официального образа? Это правильно?**
> Хороший вопрос. Технически — это **избыточно**. `rabbitmq:3.12-management-alpine` — публичный образ на Docker Hub, его можно скачать. Корректнее было бы `IfNotPresent` или вообще ничего не указывать (default).
> 
> `Never` работает, только если образ заранее импортирован в containerd ноды:
> ```bash
> docker pull rabbitmq:3.12-management-alpine
> docker save rabbitmq:3.12-management-alpine -o rabbitmq.tar
> sudo k3s ctr images import rabbitmq.tar
> ```
> 
> Видимо, это сделали при подготовке среды, чтобы не зависеть от интернета. На защите можно объяснить так: "унифицировал политику со всеми сервисами, чтобы кластер работал офлайн".

**В3: Что произойдёт, если поменять пароль через переменные после первого запуска?**
> Ничего! RabbitMQ читает `RABBITMQ_DEFAULT_USER/PASS` **только при первом запуске**, когда инициализируется Mnesia (внутренняя БД). При последующих стартах эти env игнорируются.
> 
> Для смены пароля нужно:
> 1. Зайти в Web UI или через `rabbitmqctl change_password`.
> 2. Или удалить data-volume и пересоздать под (потеря очередей!).
> 
> ⚠️ У нас данные RabbitMQ НЕ персистентны (нет PVC) — при перезапуске пода всё стирается, и юзер пересоздаётся с new значениями env.

**В4: Где хранятся очереди RabbitMQ — на диске или в памяти?**
> По умолчанию RabbitMQ хранит данные (очереди, exchange, user'ы, метаданные) в **Mnesia** — встроенной БД Erlang. Путь: `/var/lib/rabbitmq/mnesia/`.
> 
> ⚠️ У нас НЕТ PVC для RabbitMQ! Это значит:
> - При перезапуске пода **все очереди исчезают**.
> - Все непрочитанные сообщения теряются.
> 
> Для production обязательно нужен PVC, как для PostgreSQL. Для лабы можно жить без — после restart'а сервисы создадут exchange/queue заново автоматически.

**В5: Зачем плагин `management`? Можно ли без него?**
> Можно. `management` — это **необязательный** плагин с двумя функциями:
> 1. **Web UI** на порту 15672 — графический интерфейс.
> 2. **HTTP API** — REST для управления (queue, user, и т.д.).
> 
> Без него RabbitMQ работает только через AMQP-протокол и `rabbitmqctl` (CLI). Образ без management суффикса легче, но в debug'е сильно сложнее. Для разработки management почти всегда удобен.

**В6: Почему у Service два порта и зачем им имена?**
> Если на Service несколько портов — каждый **обязан** иметь поле `name`. Без имени k8s выдаст ошибку валидации: "must specify name in multi-port service".
> 
> Зачем имена:
> - **Уникальность**: внутри одного Service два порта должны различаться по name.
> - **Ссылки**: в Ingress / Pod readiness можно ссылаться по имени, а не цифре:
>   ```yaml
>   port: { name: amqp }
>   ```
> - **Документация**: сразу понятно, какой порт для чего.

**В7: Что такое exchange, queue, binding, routing key?**
> Это базовая модель AMQP:
> - **Exchange** — точка входа. Producer публикует сообщение **сюда**.
> - **Queue** — очередь. Consumer читает **отсюда**.
> - **Binding** — правило: "сообщения из этого exchange попадают в эту queue, если выполнено условие".
> - **Routing key** — метка сообщения, по которой binding принимает решение.
> 
> Типы exchange:
> - **direct** — сообщение в queue, если routing key == binding key.
> - **fanout** — рассылка во все привязанные queue.
> - **topic** — pattern matching по routing key (`order.*.created`).
> - **headers** — по заголовкам сообщения.

**В8: Как несколько consumer'ов работают с одной очередью?**
> RabbitMQ балансирует сообщения между всеми подписчиками очереди по round-robin (если используется `prefetch=1` или работа в режиме fair-dispatch). Это **competing consumers** — паттерн масштабирования.
> 
> Если у нас 3 пода report-service, подписанные на одну очередь:
> - Сообщение #1 → report-service-1
> - Сообщение #2 → report-service-2
> - Сообщение #3 → report-service-3
> 
> Это позволяет горизонтально масштабировать обработку.

**В9: Что произойдёт, если booking опубликует сообщение, а consumer'а нет?**
> Сообщение **сохранится в очереди** (если очередь durable + сообщение persistent). Когда consumer появится — он его прочитает.
> 
> Без правильных флагов:
> - Если queue не durable — пропадёт при перезапуске RabbitMQ.
> - Если message не persistent — пропадёт при перезапуске RabbitMQ.
> - Если queue auto-delete — удалится после отключения последнего consumer'а.
> 
> Spring AMQP по умолчанию создаёт durable queue + persistent message.

**В10: Как посмотреть Web UI RabbitMQ из браузера?**
> Из-за ClusterIP — извне напрямую не получится. Варианты:
> 
> 1. **kubectl port-forward** (самый простой):
> ```bash
> kubectl port-forward svc/rabbitmq 15672:15672
> # → открыть http://localhost:15672
> ```
> 
> 2. **Через Ingress** (постоянный доступ):
> ```yaml
> spec:
>   rules:
>   - host: rabbitmq.10.174.8.95.nip.io
>     http:
>       paths:
>       - path: /
>         backend:
>           service:
>             name: rabbitmq
>             port: { name: management }
> ```
> 
> 3. **NodePort** (быстро, но не безопасно).

**В11: Почему replicas: 1, можно ли больше?**
> Можно, но нужна **кластеризация RabbitMQ** — это не просто увеличение replicas. Шаги:
> 1. StatefulSet вместо Deployment (стабильные имена rabbitmq-0, rabbitmq-1).
> 2. Erlang cookie должен совпадать на всех узлах (через Secret).
> 3. Peer discovery (через k8s API или DNS).
> 4. Queue type = quorum или mirrored для репликации между узлами.
> 5. Headless Service для DNS подов.
> 
> Это полноценный кластер с HA. Готовый чарт: `bitnami/rabbitmq`. Для нашей лабы достаточно одной реплики.

**В12: Различие между Mnesia и Quorum queues?**
> - **Classic queues (Mnesia)** — старая модель, хранение в Mnesia. Простые, но при HA-репликации проблемы (mirror queues deprecated в 3.13).
> - **Quorum queues** — новая модель на базе Raft consensus. Лучше для HA, гарантия доставки, отказоустойчивость. Доступны с RabbitMQ 3.8+.
> 
> Для нашей задачи (один узел, простые события) — classic queues по умолчанию вполне ОК.

