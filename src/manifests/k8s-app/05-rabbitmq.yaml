## 🗣 Монолог для защиты (~300 символов)

> RabbitMQ — брокер сообщений между booking-service и report-service. Deployment с одной репликой образа rabbitmq:3.12-management-alpine. Креды берутся из Secret через RABBITMQ_DEFAULT_USER/PASS. Service ClusterIP открывает два порта: 5672 для AMQP-трафика приложений и 15672 для Web UI администрирования. Имя сервиса rabbitmq резолвится через CoreDNS.

*(длина ~350 символов, могу сократить до 300)*

