# 📝 Построчный разбор Secret для микросервисов

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# Secret = "защищённый словарь" в Kubernetes.
# В отличие от ConfigMap, предназначен для ЧУВСТВИТЕЛЬНЫХ данных:
# пароли, токены, ключи, UUID сервисов для внутренней авторизации.
#
# ВАЖНО: Secret в k8s НЕ зашифрован "из коробки"!
# Это лишь base64-кодирование (не шифрование!) + RBAC-ограничения.
# Для настоящего шифрования нужны:
#   - encryption-at-rest в etcd (флаг --encryption-provider-config)
#   - или внешний vault (HashiCorp Vault, Sealed Secrets, SOPS)
# ============================================================
apiVersion: v1                       # Базовая API-группа (core), версия v1.
                                     # Secret — один из старейших типов в k8s, всегда в core API.
kind: Secret                         # Тип ресурса: защищённое хранилище ключ-значение.
metadata:
  name: app-secrets                  # Имя Secret'а. По нему ссылаются Deployment'ы.
                                     # Например: secretKeyRef.name: app-secrets
                                     # ⚠️ namespace не указан → попадёт в "default".
                                     # Secret привязан к namespace! Между ns не "шарится".
type: Opaque                         # Тип Secret'а. Opaque = "произвольные данные".
                                     # Это самый универсальный тип, для пользовательских данных.
                                     # Другие типы (с предопределённой структурой):
                                     #   kubernetes.io/tls         — TLS сертификат + ключ
                                     #   kubernetes.io/dockerconfigjson — для Docker registry
                                     #   kubernetes.io/service-account-token — токен SA
                                     #   kubernetes.io/basic-auth  — login + password
                                     #   kubernetes.io/ssh-auth    — SSH ключи
data:                                # Сами ключ-значение пары.
                                     # ВСЕ значения ДОЛЖНЫ быть закодированы в base64!
                                     # Это требование валидации k8s, иначе apply упадёт.
                                     # base64 — это НЕ шифрование, а просто кодировка для
                                     # безопасной передачи бинарных данных в текстовом виде.
                                     # Расшифровать может кто угодно: echo "..." | base64 -d

  # ----- Учётные данные PostgreSQL -----
  POSTGRES_USER: cG9zdGdyZXM=        # base64("postgres") = "cG9zdGdyZXM="
                                     # Логин для подключения к PostgreSQL.
                                     # Используется во всех сервисах в JDBC URL:
                                     #   jdbc:postgresql://postgres:5432/db?user=${POSTGRES_USER}
                                     # И при инициализации самой БД:
                                     #   env: POSTGRES_USER в образе postgres
  POSTGRES_PASSWORD: cG9zdGdyZXM=    # base64("postgres") = "cG9zdGdyZXM="
                                     # Пароль для подключения к PostgreSQL.
                                     # ⚠️ В реальном проекте никогда не использовать
                                     # такой простой пароль! Это учебный пример.

  # ----- Учётные данные RabbitMQ -----
  RABBIT_MQ_USER: Z3Vlc3Q=           # base64("guest") = "Z3Vlc3Q="
                                     # Дефолтный пользователь RabbitMQ.
                                     # ВАЖНО: пользователь "guest" в RabbitMQ по умолчанию
                                     # может подключаться ТОЛЬКО с localhost.
                                     # Для использования из других подов нужны:
                                     # либо настройка loopback_users в RabbitMQ,
                                     # либо создание отдельного пользователя.
  RABBIT_MQ_PASSWORD: Z3Vlc3Q=       # base64("guest") = "Z3Vlc3Q="
                                     # Пароль "guest". См. комментарий выше.

  # ----- UUID для внутренней авторизации между сервисами -----
  GATEWAY_SERVICE_UUID: YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz
                                     # base64 = "b51ceda2-bfa5-11eb-8529-0242ac130003"
                                     # Это UUID, которым gateway-service "представляется"
                                     # другим сервисам — что-то вроде API-ключа сервиса.
                                     # Когда session-service получает запрос на /authorize
                                     # с этим UUID — он знает, что это легитимный gateway.
                                     # Это простейшая форма service-to-service auth.
                                     # В продакшне обычно используют:
                                     #   - mTLS (взаимные сертификаты),
                                     #   - service mesh (Istio, Linkerd),
                                     #   - JWT-токены с подписью.
  BOOKING_SERVICE_UUID: OTExY2NiNGMtYzA1NS0xMWViLTg1MjktMDI0MmFjMTMwMDAz
                                     # base64 = "911ccb4c-c055-11eb-8529-0242ac130003"
                                     # Аналогично — UUID для booking-service.
                                     # Другие сервисы могут проверять, что запрос пришёл
                                     # именно от booking-service (а не от подменённого пода).
```

---

## 🔓 Что внутри base64-значений (расшифровка)

```bash
# Проверить можно так:
echo "cG9zdGdyZXM=" | base64 -d        # → postgres
echo "Z3Vlc3Q=" | base64 -d            # → guest
echo "YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz" | base64 -d
# → b51ceda2-bfa5-11eb-8529-0242ac130003
```

Это **главное предупреждение**: любой, у кого есть доступ к чтению Secret'ов в namespace, может за 1 секунду расшифровать содержимое. Защита Secret'а строится **не** на base64, а на **RBAC** (Role-Based Access Control) и шифровании etcd.

