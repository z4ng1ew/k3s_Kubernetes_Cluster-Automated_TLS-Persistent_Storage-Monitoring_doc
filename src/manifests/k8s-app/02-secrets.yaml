## 🔗 Как Secret попадает в приложение

Аналогично ConfigMap, есть несколько способов подключения:

### Способ 1: каждое значение → отдельная env-переменная

```yaml
# В Deployment'е postgres / любого сервиса:
env:
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets            # ← имя Secret'а
        key: POSTGRES_USER           # ← ключ внутри data
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: POSTGRES_PASSWORD
```

### Способ 2: импорт ВСЕХ значений сразу

```yaml
envFrom:
  - secretRef:
      name: app-secrets              # ← все ключи станут env-переменными
```

### Способ 3: монтирование как файлы в файловую систему

```yaml
volumes:
  - name: secrets-vol
    secret:
      secretName: app-secrets
containers:
  - name: app
    volumeMounts:
      - name: secrets-vol
        mountPath: /etc/secrets
        readOnly: true
# Внутри пода: /etc/secrets/POSTGRES_USER (файл с содержимым "postgres")
```

В нашем проекте используется **способ 2** (envFrom) — самый компактный.

