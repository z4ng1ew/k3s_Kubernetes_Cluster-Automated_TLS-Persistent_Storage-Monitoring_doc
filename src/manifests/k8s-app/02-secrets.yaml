## 💡 Возможные вопросы на защите

**В1: base64 — это шифрование?**
> **Нет!** Это просто кодировка для безопасной передачи бинарных данных текстом. Расшифровывается одной командой без ключа: `echo "cG9zdGdyZXM=" | base64 -d` → `postgres`. Защита Secret'а в k8s строится на **RBAC** (кто может читать) и **шифровании etcd на диске** (encryption-at-rest), которое настраивается отдельно. base64 нужен только для того, чтобы можно было класть бинарные данные (например, бинарный сертификат) в YAML.

**В2: Зачем тогда вообще base64? Почему не plain text?**
> Чтобы безопасно хранить **бинарные** данные в YAML, который требует UTF-8 строк. Например, бинарный TLS-ключ в plain text сломал бы парсер YAML — а в base64 он выглядит как обычная строка. Плюс единообразие: все Secret'ы кодируются одинаково, независимо от типа содержимого.

**В3: Чем Secret отличается от ConfigMap технически?**
> 1. Поле `data` требует base64 (у ConfigMap — нет).
> 2. Есть поле `type` (Opaque, tls, dockerconfigjson и т.д.).
> 3. Монтируется в **tmpfs** (память), а не на диск ноды.
> 4. `kubectl describe` не показывает значения (защита от случайного `screen sharing`).
> 5. Аудит и RBAC обычно строже.
> 6. Семантически Secret предназначен для секретов — это договорённость, чтобы коллеги понимали "тут чувствительные данные".

**В4: Что такое тип `Opaque`? Чем отличается от других?**
> `Opaque` = "непрозрачный, произвольный" — самый универсальный тип. K8s не накладывает на структуру никаких требований: что положили, то и хранится. Другие типы имеют **обязательные** ключи:
> - `kubernetes.io/tls` требует `tls.crt` и `tls.key`
> - `kubernetes.io/dockerconfigjson` требует `.dockerconfigjson`
> - `kubernetes.io/basic-auth` требует `username` и `password`
> 
> Если ключи не совпадают со схемой типа — `kubectl apply` упадёт с ошибкой. Opaque такой проверки не делает.

**В5: Что произойдёт, если положить в Secret не base64?**
> `kubectl apply` упадёт с ошибкой валидации: `illegal base64 data`. K8s строго проверяет содержимое поля `data`. Альтернатива — поле `stringData`: туда можно класть plain text, k8s сам закодирует в base64 при сохранении. Это удобно для разработки:
> ```yaml
> stringData:
>   POSTGRES_USER: postgres   # БЕЗ кавычек и без base64
> ```

**В6: Что такое UUID сервисов и зачем они в Secret'е?**
> Это **service-to-service authentication tokens** — простейшая форма авторизации между микросервисами. Когда gateway шлёт запрос в session-service, он передаёт свой UUID в заголовке. Session проверяет: "знаю ли я этот UUID?" — если да, считает источник доверенным. Это:
> - Защищает от ситуации, когда злоумышленник развернул "поддельный gateway".
> - Простой аналог mTLS / JWT для учебных проектов.
> 
> В продакшне обычно заменяют на mTLS или service mesh (Istio).

**В7: Что произойдёт, если изменить Secret, пока приложение запущено?**
> Зависит от способа подключения (как и ConfigMap):
> 1. **env-переменные** (наш случай) — переменные читаются ОДИН раз при старте пода. Изменение Secret требует `kubectl rollout restart`.
> 2. **volume mount** — содержимое файлов в поде обновится автоматически через ~60 секунд. Но приложение должно само следить за изменениями.
> 
> У нас сервисы Spring Boot читают env при старте → нужен restart.

**В8: Как реально защитить Secret в продакшне?**
> Несколько уровней:
> 1. **Шифрование etcd** — настроить encryption-provider-config на kube-apiserver.
> 2. **RBAC**: дать доступ к Secret'у только нужным ServiceAccount'ам и людям.
> 3. **Не коммитить Secret в git** в plain виде. Использовать:
>    - **Sealed Secrets** (Bitnami) — шифруют Secret, можно безопасно класть в git.
>    - **External Secrets Operator** — берут секреты из AWS Secrets Manager / Vault / GCP.
>    - **HashiCorp Vault** + Vault Agent Injector.
> 4. **Network Policies** — ограничить, какие поды могут лезть в namespace.
> 5. **Audit log** — мониторить, кто читает Secret'ы.

**В9: Что произойдёт, если двух разных подов нужны разные пароли?**
> Создаём **два разных Secret'а** с разными именами:
> ```
> kubectl create secret generic db-secret --from-literal=password=...
> kubectl create secret generic mq-secret --from-literal=password=...
> ```
> Каждый Deployment ссылается только на нужный ему Secret. Это принцип least privilege — никто не видит лишнего.

**В10: Можно ли создать Secret из файла, не редактируя YAML?**
> Да, командой:
> ```bash
> kubectl create secret generic app-secrets \
>   --from-literal=POSTGRES_USER=postgres \
>   --from-literal=POSTGRES_PASSWORD=postgres \
>   --from-literal=RABBIT_MQ_USER=guest \
>   --from-literal=RABBIT_MQ_PASSWORD=guest
> ```
> Или из файла:
> ```bash
> kubectl create secret generic app-secrets --from-env-file=.env
> ```
> K8s сам закодирует значения в base64.

Если по какой-то строке хочется глубже — спрашивай 🚀