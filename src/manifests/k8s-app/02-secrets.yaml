## 🔐 Как именно k8s "защищает" Secret

Список реальных мер защиты (помимо base64):

```
1. Хранение:
   - в etcd по умолчанию НЕ шифруется (это надо отдельно настроить)
   - для шифрования: --encryption-provider-config флаг на kube-apiserver

2. Доступ через RBAC:
   - kubectl get secret требует роли с verb "get" и resource "secrets"
   - можно ограничить даже по имени конкретного Secret'а

3. Передача в поды:
   - Secret монтируется в tmpfs (RAM), не пишется на диск ноды
   - доступ только для процесса контейнера с правильным UID

4. Не светится в логах:
   - kubectl describe secret НЕ показывает значения (только имена ключей)
   - в отличие от kubectl describe configmap (показывает всё)

5. Не отправляется в audit log (по умолчанию)
```

---

## 🗣 Монолог для защиты (~300 символов)

> Secret app-secrets хранит чувствительные данные приложения: учётные записи PostgreSQL и RabbitMQ, а также UUID-токены для авторизации между сервисами. Тип Opaque выбран для произвольных пар ключ-значение. Все значения закодированы в base64 — это требование валидации k8s, а не шифрование. Настоящая защита обеспечивается RBAC и шифрованием etcd.

*(длина ~340 символов, могу сократить до 300)*

