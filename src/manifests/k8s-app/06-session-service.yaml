## 🗣 Монолог для защиты (~300 символов)

> session-service — это микросервис аутентификации, точка входа №1 в Postman-тестах. Deployment одной репликой запускает локальный образ src-session-service на порту 8081. Адрес и порт PostgreSQL берутся из ConfigMap, креды — из Secret, имя БД (users_db) задано прямо в манифесте, так как уникально для каждого сервиса. Service ClusterIP делает его доступным внутри кластера, наружу — через Ingress.

*(длина ~440 символов, могу сократить до 300 при необходимости)*

