# 📝 Построчный разбор Deployment + Service для session-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment session-service
# Микросервис аутентификации и авторизации пользователей.
# В Postman: первый запрос "Login User" идёт сюда (порт 8081).
# Выдаёт Bearer-токен, который используется в последующих запросах
# к gateway-service.
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: session-service              # Имя Deployment'а.
                                     # Совпадает с именем Service ниже — стандартная практика.
  labels: { app: session-service }   # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабораторной.
                                     # ⚠️ В продакшне stateless-сервисы запускают 2-3+ реплики
                                     # для отказоустойчивости и rolling-update без downtime.
                                     # session-service stateless (сессии в БД, не в памяти),
                                     # значит масштабируется горизонтально без проблем.
  selector:
    matchLabels: { app: session-service }
                                     # Селектор подов: какие поды считать своими.
  template:                          # Шаблон пода.
    metadata:
      labels: { app: session-service }
                                     # Метка пода — должна совпадать с селектором.
    spec:
      containers:
        - name: session-service      # Имя контейнера в поде.
          image: src-session-service:latest
                                     # Локальный образ, собранный из проекта DO10.
                                     # Spring Boot приложение, упакованное в Docker.
                                     # latest — анти-паттерн, но для лабы ОК.
          imagePullPolicy: Never     # Использовать ТОЛЬКО локальный образ.
                                     # Образ должен быть импортирован в containerd:
                                     #   k3s ctr images import session-service.tar
                                     # Без этого: ErrImageNeverPull при первом запуске.
          ports:
            - containerPort: 8081    # Порт, на котором слушает Spring Boot приложение.
                                     # Прописан в application.yml/properties:
                                     #   server.port=8081
                                     # ⚠️ Согласован с Postman: USERS_PORT=8081.
          env:                       # Переменные окружения для конфигурации Spring Boot.
                                     # Spring читает их через @Value или application.yml:
                                     #   spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

            # ----- Подключение к PostgreSQL -----
            - name: POSTGRES_HOST    # Имя env-переменной для приложения.
              valueFrom:             # Берём значение не из plain, а из ConfigMap.
                configMapKeyRef:
                  name: app-config   # Имя ConfigMap (тот, что мы разбирали ранее).
                  key: POSTGRES_HOST # Конкретный ключ внутри ConfigMap → "postgres".
                                     # CoreDNS резолвит "postgres" в ClusterIP Service postgres.
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432" (строка).
            - name: POSTGRES_DB      # Имя БД, к которой коннектится session-service.
              value: users_db        # ⚠️ Plain value, НЕ из ConfigMap!
                                     # Почему так: каждый сервис использует СВОЮ базу:
                                     #   session-service → users_db
                                     #   hotel-service   → hotels_db
                                     #   booking-service → bookings_db
                                     #   payment-service → payments_db
                                     #   loyalty-service → loyalty_db
                                     #   report-service  → report_db
                                     # Имя БД специфично для каждого сервиса, поэтому
                                     # хранится прямо в Deployment'е, а не в общем ConfigMap.
                                     # БД users_db должна быть создана init-скриптом в образе
                                     # src-postgres при первом запуске.

            # ----- Учётные данные PostgreSQL -----
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Берём из Secret, не ConfigMap! Логин — чувствительные.
                                     # Декодируется из base64 → "postgres".
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret → "postgres".
                                     # ⚠️ session-service подключается к БД под суперпользователем
                                     # — это удобно для лабы, но в продакшне неправильно.
                                     # Лучше: отдельный юзер с правами только на свою БД.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для session-service
# Открывает порт 8081 для других сервисов в кластере.
# ClusterIP — изнутри. Снаружи к нему ходит Ingress (см. ingress.yaml).
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: session-service              # КЛЮЧЕВОЕ! По этому имени обращаются другие сервисы:
                                     #   ConfigMap: SESSION_SERVICE_HOST: session-service
                                     # CoreDNS: session-service → ClusterIP этого Service.
                                     # gateway-service ходит сюда для валидации токенов.
  labels: { app: session-service }   # Метка на Service.
spec:
  selector: { app: session-service } # Трафик идёт в поды с этим лейблом.
                                     # У нас replicas: 1, поэтому балансировка не нужна.
  ports:
    - port: 8081                     # Порт Service'а.
                                     # Под этим портом видят его другие поды:
                                     #   http://session-service:8081
      targetPort: 8081               # Порт пода (containerPort).
                                     # Совпадает с containerPort из Deployment.
                                     # Может отличаться (например, port: 80 → targetPort: 8081),
                                     # но для единообразия лучше совпадение.
  type: ClusterIP                    # Тип Service: ClusterIP (default).
                                     # Доступен только из кластера.
                                     # ⚠️ session-service нужен снаружи (для Postman логина)!
                                     # Как же он доступен извне? — через Ingress.
                                     # Ingress смотрит на host (session.10.174.8.95.nip.io)
                                     # и проксирует HTTPS-трафик на этот Service.
                                     # Сам Service наружу не светится, что правильно.
```

---

## 🔗 Путь запроса от Postman до session-service

```
   [ Postman / curl ]
            │
            │ GET https://session.10.174.8.95.nip.io/api/v1/auth/authorize
            │ Authorization: Basic VXNlcjpxd2VydHk=
            ▼
   [ DNS nip.io резолвит → 10.174.8.95 ]
            │
            ▼
   [ master-нода k3s, порт 443 ]
            │
            ▼
   [ Ingress-Nginx Controller ]
            │ TLS termination (расшифровка HTTPS)
            │ Смотрит Host: session.10.174.8.95.nip.io
            │ Находит правило → backend: session-service:8081
            ▼
   [ Service session-service (ClusterIP) ]
            │ kube-proxy iptables/IPVS
            ▼
   [ Pod session-service-xxx-yyy ]
            │ Spring Boot слушает 0.0.0.0:8081
            │
            ▼
   [ Spring Boot Controller /api/v1/auth/authorize ]
            │ Декодирует Basic Auth → User:qwerty
            │ Ищет в БД
            ▼
   [ JDBC: jdbc:postgresql://postgres:5432/users_db ]
            │
            ▼
   [ Service postgres → Pod postgres → /var/lib/postgres-pv/pgdata ]
            │
            ▼
   [ SELECT * FROM users WHERE username='User' AND password='qwerty' ]
            │
            ▼
   [ Найден → генерирует JWT-токен ]
            │
            ▼
   [ Response 200 OK ]
   [ Authorization: Bearer eyJhbGc... ]
            │
            ▼
   [ Возврат тем же путём до Postman ]
   [ Postman сохраняет токен в переменной {{BEARER}} ]
   [ Использует его в дальнейших запросах к gateway-service ]
```

