## 💡 Возможные вопросы на защите

**В1: Почему имя БД `users_db` указано plain value, а не в ConfigMap?**
> Потому что у каждого микросервиса **своя** БД (users_db, hotels_db, bookings_db и т.д.). Если положить их в общий `app-config`, получится по ключу на каждый сервис — 6 ключей вместо одного. Удобнее задать прямо в Deployment, где это единичная константа. Альтернатива: завести отдельный ConfigMap на каждый сервис — это правильнее с точки зрения изоляции, но громоздко для лабы.

**В2: Почему session-service подключается под суперпользователем `postgres`?**
> Это упрощение для лабораторной. В продакшне нужно:
> 1. Создать отдельного пользователя `session_user` с паролем.
> 2. Дать ему права **только** на свою БД `users_db`.
> 3. Хранить отдельные `SESSION_DB_USER` и `SESSION_DB_PASSWORD` в Secret'е.
> 
> Принцип **least privilege**: компрометация одного сервиса не даёт доступ к данным других.

**В3: Что произойдёт при увеличении `replicas` до 3?**
> Создастся 3 пода session-service. Service балансирует round-robin между ними. Это работает, потому что:
> - **Stateless архитектура**: сервис не хранит сессии в памяти, всё в БД.
> - **Общая БД**: все три пода видят одни и те же таблицы users / sessions.
> - **JWT-токены**: не привязаны к конкретной ноде, могут валидироваться любым подом.
> 
> Если бы сессии хранились в локальной памяти (HttpSession без shared storage) — пришлось бы либо настраивать sticky sessions, либо переходить на распределённое хранилище (Redis).

**В4: Зачем env-переменные, если можно положить всё в application.yml?**
> Принцип **The Twelve-Factor App** (фактор III, "Config"): конфигурация должна быть **в окружении**, не в коде. Это даёт:
> - **Один образ — разные окружения**. Dev/stage/prod крутят тот же `src-session-service:latest`, но с разными env.
> - **Безопасность**: пароли не лежат в git вместе с кодом.
> - **k8s-native подход**: ConfigMap + Secret → env → приложение. Стандартная цепочка.
> 
> Spring Boot отлично работает с env: `${POSTGRES_HOST}` в application.yml → подставляется из env.

**В5: Что произойдёт, если ConfigMap `app-config` удалить, пока под живёт?**
> Под продолжит работать! Env-переменные читаются **один раз** при старте, и больше не зависят от ConfigMap. Удаление ConfigMap не убьёт под.
> 
> Но:
> - При перезапуске пода новый под не сможет стартовать (env не из чего брать) → CreateContainerConfigError.
> - Если ConfigMap смонтирован как volume — содержимое файлов обновляется через ~60 секунд (а при удалении ConfigMap файлы исчезают).

**В6: Почему `imagePullPolicy: Never` — это нормально для приватного локального образа?**
> Потому что образ `src-session-service:latest`:
> 1. Собран локально через `docker build`.
> 2. НЕ запушен в Docker Hub / GitLab Registry.
> 3. Импортирован в containerd k3s через `k3s ctr images import`.
> 
> Если бы оставили policy `Always` или `IfNotPresent` (default для latest = Always) — k3s бы пытался скачать с Docker Hub, получил бы 404, под застрял бы в `ErrImagePull`.

**В7: Как session-service узнаёт о существовании БД `users_db`? Кто её создаёт?**
> БД создаётся **при первом запуске PostgreSQL** через init-скрипт. В кастомном образе `src-postgres` есть файл вроде `/docker-entrypoint-initdb.d/init.sql`:
> ```sql
> CREATE DATABASE users_db;
> CREATE DATABASE hotels_db;
> CREATE DATABASE bookings_db;
> -- и т.д.
> ```
> Этот скрипт выполняется ровно ОДИН раз — когда PGDATA пуст. При последующих запусках skip.
> 
> Если PVC удалить → пересоздать → init-скрипт сработает заново.

**В8: Что если session-service стартует раньше, чем PostgreSQL готов?**
> Spring Boot упадёт с ошибкой `Connection refused` или `Cannot create PoolableConnectionFactory`. Стандартные решения:
> 
> 1. **Init container** в поде session-service:
> ```yaml
> initContainers:
>   - name: wait-for-postgres
>     image: busybox
>     command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
> ```
> Этот контейнер запускается ПЕРЕД основным и блокирует старт, пока postgres не отвечает.
> 
> 2. **Readiness probe** + Spring retry: приложение пробует подключиться к БД с экспоненциальной задержкой.
> 
> 3. **k8s сам перезапустит** под при крэше → второй раз PostgreSQL уже готов.

**В9: Service `ClusterIP`, но Postman ходит снаружи — как это работает?**
> Через **Ingress**! Цепочка такая:
> 1. Postman → `https://session.10.174.8.95.nip.io` → IP master-ноды.
> 2. На master-ноде слушает Ingress-Nginx (порт 443).
> 3. Ingress видит Host: session.10.174.8.95.nip.io → ищет правило → backend: session-service:8081.
> 4. Ingress форвардит запрос на ClusterIP сервиса session-service.
> 5. Service балансирует на под.
> 
> Сам Service ClusterIP **не** выставлен наружу — между Postman и подом стоит Ingress как прокси.

**В10: Что если приложение в контейнере слушает не на 8081, а на 9999?**
> Тогда:
> - `containerPort: 8081` — это лишь **документирующее** поле, k8s его не проверяет.
> - `targetPort: 8081` в Service — это **реальный** порт, куда форвардится трафик.
> - Если приложение слушает 9999, а targetPort 8081 → Service шлёт на 8081 → connection refused → 502 Bad Gateway.
> 
> targetPort должен точно совпадать с тем, на чём слушает приложение внутри контейнера.

**В11: Почему секреты передаются через env, а не через volume?**
> Env-вариант:
> - **Плюсы**: проще, читать как любую env-переменную в Spring Boot.
> - **Минусы**: видны в `kubectl describe pod`, могут протечь в логи/core dumps.
> 
> Volume mount:
> - **Плюсы**: файлы в `/etc/secrets/`, не светятся в env, обновляются автоматически без рестарта.
> - **Минусы**: нужно адаптировать приложение читать файлы, чуть сложнее.
> 
> Для лабораторной env проще. Для продакшна — лучше volume или внешний vault.

**В12: Какой следующий шаг после Login User в Postman?**
> Сценарий тестов:
> 1. **Login** → session-service выдаёт `Authorization: Bearer eyJ...`.
> 2. Postman сохраняет токен в переменной `{{BEARER}}`.
> 3. **Get Hotels** → gateway-service с заголовком `Authorization: {{BEARER}}`.
> 4. Gateway проверяет токен (валидирует подпись или спрашивает session-service).
> 5. Если ОК → проксирует запрос в hotel-service → возврат списка отелей.
> 
> session-service участвует только в шаге 1, дальше всё через gateway. Но gateway может ходить в session за валидацией JWT — это уже архитектурный выбор.

Если по какой-то строке хочется глубже — спрашивай 🚀

