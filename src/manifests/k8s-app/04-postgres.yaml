apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-master   
      containers:
        - name: postgres
          image: src-postgres:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata  
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP




# 📝 Построчный разбор Deployment + Service для PostgreSQL

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment PostgreSQL
# Запускает СТРОГО ОДИН под с базой данных.
# Использует PVC для постоянного хранения данных.
# Привязан к конкретной ноде, где лежит hostPath PV.
# ⚠️ Для production обычно используют StatefulSet, но для
# одиночной БД с PVC Deployment тоже работает.
# ============================================================
apiVersion: apps/v1                  # API-группа "apps", версия v1.
                                     # Стандартная для Deployment, StatefulSet, DaemonSet.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: postgres                     # Имя Deployment'а.
                                     # ВАЖНО: совпадает с именем Service ниже —
                                     # это удобно, но не обязательно.
  labels:
    app: postgres                    # Метка на сам Deployment (не на поды!).
                                     # Удобна для группировки в kubectl:
                                     #   kubectl get deploy -l app=postgres
spec:
  replicas: 1                        # СТРОГО ОДНА реплика! Это критически важно для БД.
                                     # PostgreSQL — однописатель: несколько подов с одним PVC
                                     # = повреждение данных. Никогда не ставь больше 1!
                                     # Для master-replica нужна другая архитектура
                                     # (StatefulSet + streaming replication).
  strategy:
    type: Recreate                   # Стратегия обновления. Recreate = "убить старый,
                                     # потом запустить новый". Будет downtime в несколько секунд.
                                     # Альтернатива: RollingUpdate (default) — постепенная замена.
                                     # Для БД RollingUpdate НЕЛЬЗЯ! Два пода одновременно
                                     # попытались бы использовать один PVC (RWO) → конфликт.
                                     # Recreate гарантирует: всегда только 1 под живой.
  selector:
    matchLabels:
      app: postgres                  # Селектор подов: какие поды считать "своими".
                                     # Должен совпадать с template.metadata.labels.
  template:                          # ШАБЛОН пода.
    metadata:
      labels:
        app: postgres                # Метка на каждом создаваемом поде.
                                     # По ней Service найдёт под (см. блок 2).
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-master
                                     # ВАЖНО! Прибиваем под к конкретной ноде.
                                     # Почему: наш PV — это hostPath на k3s-master.
                                     # Если под уедет на worker — данных там не будет!
                                     # nodeSelector — простой вариант (vs nodeAffinity в PV).
                                     # Альтернатива: можно положиться только на nodeAffinity
                                     # PV — scheduler сам поставит под куда надо.
                                     # Но дублирование надёжнее и явнее.
      containers:
        - name: postgres             # Имя контейнера внутри пода.
          image: src-postgres:latest # Имя Docker-образа.
                                     # ⚠️ "src-postgres:latest" — это ЛОКАЛЬНЫЙ образ,
                                     # собранный командой docker build из проекта DO10.
                                     # Это кастомная PostgreSQL с init-скриптами,
                                     # создающими 6 баз для разных сервисов.
                                     # latest — анти-паттерн в продакшне (нет версионности),
                                     # но для лабы ОК.
          imagePullPolicy: Never     # КЛЮЧЕВОЕ для работы с локальными образами!
                                     # Never = "никогда не качай из registry,
                                     # используй ТОЛЬКО локальный образ на ноде".
                                     # Без этого k3s попытается скачать src-postgres из Docker Hub
                                     # и получит 404 (там такого образа нет).
                                     # ⚠️ Образ должен быть импортирован в k3s containerd!
                                     # См. команды: k3s ctr images import <tar>
                                     # Другие значения:
                                     #   Always — всегда тянуть из registry (default для :latest)
                                     #   IfNotPresent — тянуть только если локально нет
          ports:
            - containerPort: 5432    # Порт, на котором слушает PostgreSQL внутри контейнера.
                                     # Стандартный для PostgreSQL.
                                     # Это документирующее поле; реальную маршрутизацию
                                     # делает Service в блоке 2.
          env:                       # Переменные окружения для PostgreSQL.
                                     # Образ postgres (и наш src-postgres) читает эти env
                                     # при первом запуске и инициализирует БД.
            - name: POSTGRES_USER    # Логин суперпользователя БД.
              valueFrom:             # Берём не из plain value, а из Secret.
                secretKeyRef:        # Тип источника: Secret.
                  name: app-secrets  # Имя Secret'а (тот, что мы разбирали ранее).
                  key: POSTGRES_USER # Конкретный ключ внутри Secret'а.
                                     # k8s сам декодирует base64 при инъекции в под.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Inline-синтаксис YAML — короче, но менее читаемо.
                                     # Эквивалентно блочной записи выше.
            - name: POSTGRES_DB
              value: postgres        # Имя БД, создаваемой при первом запуске.
                                     # ⚠️ Это plain value, не из Secret.
                                     # "postgres" — стандартное имя дефолтной БД.
                                     # Скорее всего, реальные БД создаются init-скриптами
                                     # в кастомном образе (booking_db, hotel_db и т.д.).
            - name: PGDATA           # КЛЮЧЕВАЯ переменная для PostgreSQL!
              value: /var/lib/postgresql/data/pgdata
                                     # Путь, где PostgreSQL хранит свои файлы данных.
                                     # ⚠️ ОБЯЗАТЕЛЬНО подкаталог pgdata (не корень тома)!
                                     # Причина: hostPath-том монтируется с lost+found
                                     # (если EXT4) и init PostgreSQL падает с ошибкой
                                     # "data directory is not empty".
                                     # Подкаталог обходит эту проблему: lost+found остаётся
                                     # в /var/lib/postgresql/data, а данные БД — в /pgdata.
          volumeMounts:              # Монтирование томов внутрь контейнера.
            - name: postgres-storage # Имя тома (определено ниже в volumes).
              mountPath: /var/lib/postgresql/data
                                     # Путь ВНУТРИ контейнера, куда монтируется том.
                                     # Это стандартный путь, где PostgreSQL хранит данные.
                                     # Внутри будет /pgdata (из-за PGDATA выше).
      volumes:                       # Описание томов, доступных поду.
        - name: postgres-storage     # Имя тома (используется в volumeMounts).
          persistentVolumeClaim:
            claimName: postgres-pvc  # Ссылка на PVC из предыдущего манифеста.
                                     # PVC, в свою очередь, связан с PV postgres-pv,
                                     # который указывает на /var/lib/postgres-pv на ноде.
                                     # Цепочка:
                                     #   контейнер /var/lib/postgresql/data/pgdata
                                     #     → volume postgres-storage
                                     #     → PVC postgres-pvc
                                     #     → PV postgres-pv
                                     #     → hostPath /var/lib/postgres-pv/pgdata на k3s-master

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для PostgreSQL
# Даёт стабильное DNS-имя "postgres" внутри кластера.
# Без него остальные микросервисы не смогли бы найти БД.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Сервис = балансировщик + DNS-имя.
metadata:
  name: postgres                     # Имя Service'а. КЛЮЧЕВОЕ!
                                     # По этому имени микросервисы обращаются к БД:
                                     #   jdbc:postgresql://postgres:5432/booking_db
                                     # ConfigMap содержит: POSTGRES_HOST: postgres
                                     # CoreDNS резолвит "postgres" → ClusterIP этого Service.
  labels:
    app: postgres                    # Метка на самом Service (для kubectl).
spec:
  selector:
    app: postgres                    # Селектор подов: трафик пойдёт в поды с этим лейблом.
                                     # У нас один такой под — из Deployment выше.
                                     # Service балансирует между ВСЕМИ подходящими подами,
                                     # но у нас replicas: 1, поэтому балансировки нет.
  ports:
    - port: 5432                     # Порт самого Service'а.
                                     # Под этим портом видят его другие поды:
                                     #   postgres:5432
      targetPort: 5432               # Порт пода (того, что слушает PostgreSQL).
                                     # Совпадает с containerPort из Deployment.
  type: ClusterIP                    # Тип Service: ClusterIP (default).
                                     # Доступен ТОЛЬКО внутри кластера.
                                     # Это правильно: БД не должна быть видна снаружи!
                                     # Только сервисы внутри кластера могут к ней подключаться.
                                     # Альтернативы:
                                     #   NodePort — открывает на ноде (зачем БД наружу?)
                                     #   LoadBalancer — облачный LB (то же самое)
                                     #   ExternalName — CNAME на внешний адрес
```

