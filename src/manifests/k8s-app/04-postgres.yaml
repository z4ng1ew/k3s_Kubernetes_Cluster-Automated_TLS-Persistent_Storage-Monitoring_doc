## 🔗 Полная картина: как данные доходят до диска

```
   [ booking-service Pod ]
            │
            │ JDBC: jdbc:postgresql://postgres:5432/booking_db
            ▼
   [ CoreDNS резолвит "postgres" ]
            │
            ▼
   [ Service postgres (ClusterIP 10.43.x.x) ]
            │
            │ kube-proxy iptables/IPVS правило
            ▼
   [ Pod postgres-xxx-yyy на k3s-master ]
            │
            │ процесс PostgreSQL слушает 0.0.0.0:5432
            ▼
   [ PostgreSQL пишет файлы в /var/lib/postgresql/data/pgdata/ ]
            │
            │ volumeMount: postgres-storage → /var/lib/postgresql/data
            ▼
   [ PVC postgres-pvc (статус Bound) ]
            │
            │ связан с PV
            ▼
   [ PV postgres-pv (hostPath, nodeAffinity: k3s-master) ]
            │
            │ kubelet монтирует bind mount
            ▼
   [ Файловая система ноды k3s-master ]
   [ /var/lib/postgres-pv/pgdata/ ]
            │
            ├── base/         ← таблицы
            ├── pg_wal/       ← WAL-логи
            ├── pg_xact/      ← статусы транзакций
            ├── pg_hba.conf
            ├── postgresql.conf
            └── PG_VERSION
```

