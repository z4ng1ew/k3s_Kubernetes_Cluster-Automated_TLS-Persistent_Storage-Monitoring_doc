## 💡 Возможные вопросы на защите

**В1: Почему Deployment, а не StatefulSet для БД?**
> Хороший вопрос! StatefulSet — "правильный" выбор для stateful-приложений (БД, очереди). Его преимущества:
> - Стабильные имена подов (`postgres-0`, `postgres-1`), а не случайные.
> - Стабильное DNS-имя для каждой реплики.
> - VolumeClaimTemplate — автоматическое создание PVC на каждую реплику.
> - Упорядоченный rollout (сначала -0, потом -1).
> 
> Я использовал Deployment, потому что:
> 1. У меня одна реплика — преимущества StatefulSet не нужны.
> 2. Deployment проще, меньше boilerplate.
> 3. Задание не требует StatefulSet.
> 
> Для production-кластера с репликацией PostgreSQL — StatefulSet обязателен.

**В2: Почему `replicas: 1`, а не больше для отказоустойчивости?**
> PostgreSQL — это "один writer, много readers". Несколько подов с одним PVC (RWO) — невозможно технически. Даже если бы PVC был RWX (а сетевая ФС поддерживает) — PostgreSQL не позволит двум процессам открыть БД одновременно, это приведёт к повреждению.
> Для масштабирования PostgreSQL нужны:
> - **Streaming Replication** — master + read replicas (отдельные поды с отдельными PVC).
> - **Patroni / Stolon** — автоматический failover.
> - **Citus** — горизонтальное шардирование.
> 
> Это уровень другого проекта.

**В3: Что произойдёт, если поменять `strategy: Recreate` на `RollingUpdate`?**
> Поломается deploy. При rolling update k8s сначала создаёт новый под, потом убивает старый. Но у нас:
> - PVC = RWO (один writer).
> - Старый под держит PVC.
> - Новый под пытается прицепить тот же PVC → застревает в `ContainerCreating` со статусом "Multi-Attach error for volume".
> 
> `Recreate` гарантирует: сначала убить → потом создать. Будет downtime ~10 секунд, но это нормально для БД.

**В4: Зачем `imagePullPolicy: Never`? В чём отличие от Always и IfNotPresent?**
> `Never` = "никогда не тянуть из registry, только локальный образ". Нужно, когда:
> - Образ собран локально (`docker build`) и НЕ запушен в registry.
> - Образ импортирован в containerd ноды через `k3s ctr images import`.
> 
> Другие политики:
> - **Always** — тянуть всегда (default для `:latest`). Без registry получим ImagePullBackOff.
> - **IfNotPresent** — тянуть, если локально нет (default для версий типа `:v1`). Тоже может попытаться скачать.
> 
> В моём случае образ `src-postgres:latest` собран локально → только `Never`.

**В5: Что такое `PGDATA` и зачем подкаталог `/pgdata`?**
> `PGDATA` — переменная окружения, говорящая PostgreSQL, где хранить данные. По умолчанию — `/var/lib/postgresql/data`.
> Проблема: при монтировании пустого тома (особенно ext4) в нём появляется директория `lost+found`. PostgreSQL при инициализации проверяет, что директория **полностью пустая**. Видит `lost+found` → отказывается стартовать с ошибкой `directory is not empty`.
> Решение: указываем `PGDATA` = подкаталог `/pgdata`. Тогда PostgreSQL создаст свою папку внутри, и `lost+found` ему не помешает. Это стандартная практика для PostgreSQL в k8s.

**В6: Что произойдёт, если убрать `nodeSelector`?**
> Под может попасть на любую ноду (master, worker1, worker2). Но PV — это hostPath на k3s-master, привязан через nodeAffinity. Scheduler видит nodeAffinity PV и поставит под на правильную ноду автоматически.
> Так что технически `nodeSelector` дублирует функцию nodeAffinity PV. Я указал явно для:
> 1. Документирующей цели — сразу видно, где будет жить под.
> 2. Защиты от ситуации, если PV пересоздадут с другой nodeAffinity.

**В7: Безопасно ли передавать пароль через env-переменные?**
> Не идеально, но допустимо для лабораторной. Минусы env:
> - Видны в `kubectl describe pod` (значения подставлены).
> - Передаются дочерним процессам.
> - Могут попасть в логи при крашах (core dump).
> 
> Альтернативы:
> 1. **Volume mount Secret** — пароль читается из файла, не виден в env.
> 2. **External secret manager** — Vault, AWS Secrets Manager.
> 3. **CSI Secrets Store** — динамическая загрузка из vault'а.

**В8: Что произойдёт при удалении пода `kubectl delete pod postgres-xxx`?**
> Deployment автоматически создаст новый под (replicas: 1 надо поддерживать). Новый под:
> 1. Запланируется на k3s-master (по nodeSelector).
> 2. Смонтирует тот же PVC postgres-pvc.
> 3. PostgreSQL найдёт существующие данные в `/var/lib/postgresql/data/pgdata`.
> 4. Не будет переинициализировать БД — увидит `PG_VERSION` файл и поднимется с существующими данными.
> 
> Downtime ~5-15 секунд. Данные сохранятся полностью.

**В9: Что будет с данными при удалении Deployment?**
> Deployment удалится, под удалится, **PVC останется!** Это специально: PVC и Deployment — независимые ресурсы.
> Так что:
> 1. `kubectl delete deploy postgres` → под удалён, PVC жив.
> 2. Можно создать Deployment снова — он подцепит существующий PVC и данные на месте.
> 3. Чтобы реально стереть данные → `kubectl delete pvc postgres-pvc` (но PV в Retain останется!).
> 4. Окончательно: удалить PV или зайти на ноду и `rm -rf /var/lib/postgres-pv`.

**В10: Почему Service `ClusterIP`, а не NodePort?**
> Базе данных нечего делать в публичной сети. Если открыть PostgreSQL наружу (NodePort) — это огромная дыра безопасности: bot'ы будут брутфорсить пароль каждую секунду. ClusterIP = доступ только из кластера, что и нужно: к БД ходят только микросервисы, и они все в кластере.
> Если нужен внешний доступ для админа — лучше через `kubectl port-forward` (временный туннель) или bastion-под.

**В11: Что если на ноде уже занят 5432 (например, PostgreSQL уже стоит)?**
> Конфликта НЕТ! 5432 — это порт ВНУТРИ пода (его сетевого namespace). У пода свой сетевой стек, изолированный от хоста. На хосте 5432 может быть занят чем угодно — пода это не касается.
> Конфликт возник бы только при NodePort или hostNetwork=true. У нас ClusterIP — внешний порт не открывается.

Если по какой-то строке хочется глубже — спрашивай 🚀