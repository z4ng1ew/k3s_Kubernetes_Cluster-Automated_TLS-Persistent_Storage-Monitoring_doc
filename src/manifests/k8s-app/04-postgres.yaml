## 🗣 Монолог для защиты (~300 символов)

> Deployment PostgreSQL запускает строго одну реплику с стратегией Recreate — это критично для БД с RWO-томом. Под прибит к ноде k3s-master через nodeSelector, чтобы попасть туда же, где hostPath PV. Образ src-postgres локальный, imagePullPolicy: Never. Пароли инжектятся из Secret, данные хранятся в PVC. Service ClusterIP даёт внутреннее DNS-имя "postgres".

*(длина ~370 символов, могу сократить до 300)*

