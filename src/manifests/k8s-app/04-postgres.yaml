## ⚠️ Ключевые "подводные камни", которые тут учтены

```
1. replicas: 1
   └─ Без этого: повреждение данных при двух writer'ах в одном PVC.

2. strategy: Recreate
   └─ Без этого: RollingUpdate подняла бы 2 пода одновременно,
      второй не смог бы прицепить PVC (RWO) → застрял бы в Pending.

3. nodeSelector: k3s-master
   └─ Без этого: под мог бы попасть на worker и оказаться
      в пустом /var/lib/postgres-pv → инициализация новой БД.

4. imagePullPolicy: Never
   └─ Без этого: k3s попытался бы скачать src-postgres из Docker Hub,
      получил бы 404, под застрял бы в ImagePullBackOff.

5. PGDATA: .../pgdata (с подкаталогом!)
   └─ Без этого: PostgreSQL ругается, что /var/lib/postgresql/data
      не пустой (там lost+found от файловой системы).

6. valueFrom Secret (а не plain value)
   └─ Без этого: пароли торчали бы в Deployment'е plain text
      → kubectl describe deploy показывал бы их.

7. Service type: ClusterIP (не NodePort)
   └─ БД не должна быть доступна снаружи. Только внутрикластерные
      сервисы.

8. PVC, а не emptyDir
   └─ Без PVC данные исчезали бы при каждом перезапуске пода.
      Для БД недопустимо.
```

