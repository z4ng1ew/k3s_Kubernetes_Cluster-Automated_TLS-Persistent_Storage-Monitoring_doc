## 🔄 Зеркальная конфигурация booking ↔ report

```
┌──────────────────────────────────────────────────────────────┐
│           booking-service             ⟷    report-service    │
│           (PUBLISHER)                      (SUBSCRIBER)       │
├──────────────────────────────────────────────────────────────┤
│  RABBIT_MQ_HOST: rabbitmq             ✅ rabbitmq             │
│  RABBIT_MQ_PORT: 5672                 ✅ 5672                 │
│  RABBIT_MQ_QUEUE: booking_stat_queue  ✅ booking_stat_queue   │
│  RABBIT_MQ_EXCHANGE: booking_stat_x   ✅ booking_stat_x       │
│  RABBIT_MQ_USER: guest                ✅ guest                │
│  RABBIT_MQ_PASSWORD: guest            ✅ guest                │
└──────────────────────────────────────────────────────────────┘
                          │
                          │ Эти 6 значений ОБЯЗАНЫ совпадать!
                          │ Берутся из общего ConfigMap + Secret —
                          │ гарантия консистентности.
```

Это **критически важная инвариант**: при изменении любого из этих значений нужно обновить ConfigMap/Secret и **перезапустить оба** сервиса. Иначе:
- booking публикует в exchange-A, а report слушает exchange-B → события теряются.
- Или сообщения копятся в очереди, потому что consumer не подписан.

