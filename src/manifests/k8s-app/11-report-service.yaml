## 💡 Возможные вопросы на защите

**В1: Чем report-service принципиально отличается от других "листовых" сервисов?**
> Тремя ключевыми вещами:
> 
> 1. **Pull vs Push**: hotel/payment/loyalty получают **синхронные HTTP-запросы**. report — асинхронно **слушает события** из RabbitMQ.
> 
> 2. **Никто его не вызывает напрямую** для записи данных. Все данные приходят через очередь. HTTP-API нужен только для отдачи отчётов.
> 
> 3. **Eventual consistency**: между моментом создания брони в booking и появлением её в statistics_db есть задержка (миллисекунды-секунды). Это нормально для аналитики.
> 
> Это **CQRS-подобный паттерн**: write-модель в booking, read-модель в report.

**В2: Что произойдёт, если report-service упадёт на час?**
> События **не потеряются**! Это главное преимущество message-driven архитектуры:
> 
> 1. booking-service продолжит публиковать в RabbitMQ.
> 2. RabbitMQ накапливает сообщения в очереди (если queue durable).
> 3. Через час report-service запустится → подключится → начнёт читать с самого первого непрочитанного сообщения.
> 4. Постепенно догонит и обработает накопившееся.
> 
> Сравним с синхронным HTTP: если loyalty-service лежит час, все вызовы booking → loyalty за этот час провалятся, данные потеряются.
> 
> Это **resilience by design** — встроенная отказоустойчивость через очереди.

**В3: Что если RabbitMQ перезапустится — потеряются ли сообщения?**
> Зависит от настроек **durability**:
> 
> 1. **Durable queue** (`durable: true`) — определение очереди переживает рестарт.
> 2. **Persistent message** (`delivery_mode = 2`) — само сообщение пишется на диск.
> 3. **Durable exchange** — определение exchange сохраняется.
> 
> Spring AMQP по умолчанию создаёт queue/exchange durable. Сообщения — persistent при `MessagePostProcessor`.
> 
> ⚠️ **У нас в манифесте НЕТ PVC для RabbitMQ!** Это значит:
> - При перезапуске пода RabbitMQ — данные `/var/lib/rabbitmq` теряются.
> - Все накопленные сообщения исчезают.
> - Это **критический технический долг для продакшна**.
> 
> Для production нужен PVC к RabbitMQ, как у PostgreSQL.

**В4: Что произойдёт, если в `RABBIT_MQ_QUEUE_NAME` указать неверное имя?**
> Сценарий: booking publish в `booking_statistics_queue`, а report listens `wrong_queue`.
> 
> Результат:
> 1. Spring AMQP при старте report-service создаст очередь `wrong_queue` (с `Queue.declare()`).
> 2. Очередь будет пустая — booking туда ничего не пишет.
> 3. Тем временем `booking_statistics_queue` накапливает события, но никто их не читает.
> 4. Postman-тесты пройдут (они не проверяют события), но статистика в БД пуста.
> 
> Это самый коварный bug: всё запустилось, но не работает.

**В5: Можно ли запускать report-service в нескольких репликах?**
> Да, и это **естественное масштабирование** для consumer'ов. Сценарий:
> - 3 пода report-service подписаны на одну очередь.
> - RabbitMQ балансирует сообщения round-robin между ними (competing consumers pattern).
> - Сообщение #1 → pod-A, #2 → pod-B, #3 → pod-C, #4 → pod-A, ...
> 
> Каждый под обрабатывает независимо и пишет в одну БД.
> 
> ⚠️ Важно: **порядок обработки** между подами не гарантирован! Если событие "бронь создана" и "бронь отменена" попадут на разные поды — может обработаться сначала отмена, потом создание. Решения:
> 1. **Ordering by key**: настроить RabbitMQ так, чтобы все события одного booking_uid шли в один под (consistent hashing).
> 2. **Идемпотентная обработка**: проверка last_event_timestamp в БД.

**В6: Зачем report-service порт 8086, если он только слушает RabbitMQ?**
> Для **HTTP-эндпоинтов запроса отчётов**. В реальном проекте report-service обычно предоставляет:
> ```
> GET /api/v1/reports/bookings/daily?from=2024-01-01&to=2024-01-31
> GET /api/v1/reports/users/{userId}/activity
> GET /api/v1/reports/hotels/popularity
> POST /api/v1/reports/export?format=pdf
> ```
> 
> Эти эндпоинты вызывает либо gateway (для админских отчётов), либо отдельный admin-frontend. Без HTTP-порта данные были бы "тёмной зоной" — пишутся, но никто не видит.

**В7: Если report-service упал прямо во время обработки сообщения — потеряется ли это сообщение?**
> Зависит от настройки **acknowledge** в AMQP:
> 
> 1. **Auto-ack** (`ack=auto`): RabbitMQ удаляет сообщение из очереди СРАЗУ при отправке consumer'у. Если consumer упал до обработки — сообщение потеряно.
> 
> 2. **Manual-ack** (`ack=manual`): consumer должен сам отправить `basic.ack` после успешной обработки. Если упал — RabbitMQ через timeout вернёт сообщение в очередь (redelivery).
> 
> Spring AMQP по умолчанию использует `AUTO` (что на самом деле = manual-ack после успешного выполнения метода). При падении сообщение возвращается.
> 
> ⚠️ Это значит **возможна повторная обработка** одного сообщения → нужно проектировать handler **идемпотентным**:
> ```java
> @Transactional
> void onBookingCreated(BookingEvent event) {
>   // Проверка дубликата
>   if (statsRepository.existsByBookingUid(event.bookingUid)) return;
>   // Обработка
>   statsRepository.save(...);
> }
> ```

**В8: Зачем у report-service отдельная БД statistics_db, а не общий "DWH"?**
> Принцип **Database per Service** (как и у других сервисов):
> 
> 1. **Изоляция**: статистика — это отдельная аналитическая база, может иметь свою схему, оптимизированную под чтение (агрегаты, материализованные view).
> 2. **Независимость**: можно мигрировать с PostgreSQL на ClickHouse / TimescaleDB без влияния на booking.
> 3. **Производительность**: тяжёлые аналитические запросы не блокируют боевую базу.
> 
> В реальном крупном проекте statistics_db эволюционирует в **OLAP-хранилище** (ClickHouse, Snowflake), а текущая PostgreSQL остаётся для OLTP. Архитектурно отделение — первый шаг к этому.

**В9: Что произойдёт при `kubectl rollout restart deploy/report-service`?**
> 1. Создаётся новый под report-service-v2.
> 2. Spring Boot стартует → подключается к RabbitMQ → подписывается на queue.
> 3. RabbitMQ видит нового consumer'а и начинает слать ему сообщения.
> 4. Старый под получает SIGTERM → graceful shutdown.
>    - Должен завершить обработку текущего сообщения и отправить ack.
>    - Закрыть AMQP-соединение чисто.
> 5. RabbitMQ автоматически переадресует не отправленные сообщения новому поду.
> 
> Zero-downtime restart работает, **если** consumer корректно обрабатывает SIGTERM. Spring AMQP это делает из коробки.

**В10: Какой Postman-тест проверяет работу report-service?**
> Прямого теста **нет** в коллекции! Тесты:
> 1. Login User
> 2. Get Hotels
> 3. Get Hotel
> 4. Book Hotel
> 5. Get User's Loyalty Balance
> 
> Никто не дёргает report-service напрямую. Это **косвенный** компонент.
> 
> Чтобы проверить его работу:
> - После теста "Book Hotel" зайти в RabbitMQ Web UI (`kubectl port-forward svc/rabbitmq 15672`).
> - Посмотреть, что в `booking_statistics_queue` сообщения приходят и потребляются.
> - Зайти в БД `statistics_db` и проверить, что появились записи.
> 
> Можно добавить тест:
> ```
> GET /api/v1/reports/bookings/last
> ```
> и проверить, что только что созданная бронь видна в статистике (с retry, т.к. eventual consistency).

**В11: Что хранится в `statistics_db`? Типичные таблицы?**
> Предположительная схема:
> ```sql
> -- Сырые события (необязательно)
> CREATE TABLE booking_events (
>   id BIGSERIAL PRIMARY KEY,
>   booking_uid UUID UNIQUE,
>   user_id BIGINT,
>   hotel_uid UUID,
>   amount NUMERIC(10,2),
>   created_at TIMESTAMP
> );
> 
> -- Дневные агрегаты
> CREATE TABLE daily_stats (
>   date DATE PRIMARY KEY,
>   bookings_count INT,
>   total_revenue NUMERIC(15,2),
>   unique_users INT
> );
> 
> -- Топ отелей
> CREATE MATERIALIZED VIEW hotel_popularity AS
>   SELECT hotel_uid, COUNT(*) as bookings
>   FROM booking_events
>   GROUP BY hotel_uid;
> ```
> 
> Реальная схема зависит от кода Spring Boot в src-report-service.

**В12: Можно ли убрать HTTP-порт у report-service, если он только consumer?**
> Технически — да, если бы был чистый consumer без эндпоинтов. Тогда:
> - Убрать `containerPort: 8086` из Deployment.
> - Удалить Service полностью (не нужен).
> - Spring Boot всё равно стартует — он сам коннектится к RabbitMQ исходящим соединением.
> 
> Но обычно оставляют HTTP по двум причинам:
> 1. **Health checks**: k8s readiness/liveness probes стучатся на `/actuator/health`.
> 2. **Metrics**: Prometheus скрапит `/actuator/prometheus`.
> 3. **API для запроса отчётов**.
> 
> Без HTTP сложно мониторить и интегрировать с экосистемой.

