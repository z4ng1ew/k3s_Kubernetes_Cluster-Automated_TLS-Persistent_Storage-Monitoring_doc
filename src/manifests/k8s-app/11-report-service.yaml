| Свойство | hotel | payment | loyalty | **report** | booking |
|----------|-------|---------|---------|-----------|---------|
| Env-переменных | 5 | 5 | 5 | **10** | 18 |
| Своя БД | hotels_db | payments_db | balances_db | **statistics_db** | reservations_db |
| HTTP API | ✅ (для других) | ✅ | ✅ | **✅ (для отчётов)** | ✅ |
| RabbitMQ Producer | ❌ | ❌ | ❌ | **❌** | ✅ |
| RabbitMQ Consumer | ❌ | ❌ | ❌ | **✅** | ❌ |
| Кого вызывает | никого | никого | никого | **никого** | hotel, payment, loyalty |
| Уникальная роль | каталог | финансы | бонусы | **аналитика** | оркестратор |

report-service — это **promiscuous consumer**: пассивно ждёт события, но активно использует множество ресурсов (БД + RabbitMQ).

