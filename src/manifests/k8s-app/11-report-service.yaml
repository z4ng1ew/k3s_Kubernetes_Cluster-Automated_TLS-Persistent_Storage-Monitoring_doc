# 📝 Построчный разбор Deployment + Service для report-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment report-service
# Микросервис аналитики и статистики.
# Уникален тем, что — единственный CONSUMER RabbitMQ в системе.
# Не принимает HTTP-запросов от других сервисов (или почти),
# а слушает события и накапливает статистику в своей БД.
#
# Поток работы:
#   1. booking-service публикует событие "новая бронь" → RabbitMQ.
#   2. RabbitMQ → очередь booking_statistics_queue.
#   3. report-service подписан → читает сообщение.
#   4. Парсит, агрегирует, пишет в statistics_db.
#   5. Через HTTP-эндпоинт можно запросить отчёт (статистику).
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: report-service               # Имя Deployment'а.
  labels: { app: report-service }    # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ Для message consumer'а:
                                     # - Несколько реплик = competing consumers,
                                     #   сообщения распределяются между ними round-robin.
                                     # - Это горизонтальное масштабирование "из коробки".
                                     # - НО: порядок обработки сообщений может нарушиться!
                                     #   Если важен ordering — нужен один consumer на queue.
  selector:
    matchLabels: { app: report-service }
                                     # Селектор подов Deployment'а.
  template:                          # Шаблон создаваемых подов.
    metadata:
      labels: { app: report-service }
                                     # Метка пода — совпадает с селектором.
    spec:
      containers:
        - name: report-service       # Имя контейнера в поде.
          image: src-report-service:latest
                                     # Локальный образ Spring Boot из DO10.
                                     # Содержит:
                                     # - Spring AMQP (RabbitMQ Listener).
                                     # - Spring Data JPA для записи в БД.
                                     # - REST controllers для отдачи отчётов.
          imagePullPolicy: Never     # Только локальный образ из containerd k3s.
                                     # Образ заранее импортирован:
                                     #   k3s ctr images import report-service.tar
          ports:
            - containerPort: 8086    # Порт Spring Boot.
                                     # Согласован с ConfigMap (REPORT_SERVICE_PORT: "8086").
                                     # ⚠️ Этот порт реально нужен ТОЛЬКО для HTTP-эндпоинтов
                                     # запроса статистики. AMQP-подписка работает наоборот:
                                     # сам report-service инициирует TCP-коннект к RabbitMQ.
                                     # В Postman-тестах этот сервис НЕ дёргается напрямую.
          env:                       # 10 переменных — БОЛЬШЕ, чем у листовых сервисов
                                     # (5 у hotel/payment/loyalty), потому что нужен RabbitMQ.

            # ─────────────────────────────────────────────
            # БЛОК env-1: Подключение к PostgreSQL
            # statistics_db — отдельная БД для агрегированных данных.
            # ─────────────────────────────────────────────
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST # → "postgres"
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432"
            - name: POSTGRES_DB
              value: statistics_db   # ⚠️ Своя БД! Историческое название из DO10.
                                     # Внутри типичные таблицы:
                                     #   bookings_stats (date, count, total_revenue)
                                     #   user_activity (user_id, action_count)
                                     #   hotel_popularity (hotel_id, bookings_count)
                                     # БД создаётся init-скриптом образа src-postgres.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Логин postgres из Secret.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret.

            # ─────────────────────────────────────────────
            # БЛОК env-2: Подключение к RabbitMQ
            # report-service — CONSUMER, подписывается на очередь.
            # Зеркальная конфигурация с producer'ом (booking-service).
            # Имена exchange/queue ОБЯЗАНЫ совпадать — иначе сообщения
            # просто не дойдут.
            # ─────────────────────────────────────────────
            - name: RABBIT_MQ_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_HOST }
                                     # → "rabbitmq"
            - name: RABBIT_MQ_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_PORT }
                                     # → "5672"
            - name: RABBIT_MQ_QUEUE_NAME
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_QUEUE_NAME }
                                     # → "booking_statistics_queue"
                                     # ⚠️ ТО ЖЕ имя, что у booking-service!
                                     # booking publish → queue
                                     # report subscribe ← queue
                                     # Без совпадения — события теряются.
            - name: RABBIT_MQ_EXCHANGE
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_EXCHANGE }
                                     # → "booking_statistics_exchange"
                                     # Тоже должно совпадать с booking-service.
                                     # Хотя в некоторых реализациях consumer не использует
                                     # exchange напрямую (читает из queue), Spring AMQP
                                     # обычно использует для declaration (создания привязки).
            - name: RABBIT_MQ_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_USER }
                                     # → "guest"
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_PASSWORD }
                                     # → "guest"

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для report-service
# Открывает HTTP-порт для запросов статистики (опционально).
# AMQP-подписка работает БЕЗ Service'а — это исходящее соединение.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: report-service               # КЛЮЧЕВОЕ! По имени резолвится через CoreDNS.
                                     # В ConfigMap: REPORT_SERVICE_HOST: report-service
                                     # ⚠️ Кто к нему ходит?
                                     # В Postman-тестах нет вызовов /report.
                                     # Возможно, через gateway/admin доступны эндпоинты
                                     # вроде /api/v1/reports/bookings.
                                     # Но в основном report — пассивный consumer.
  labels: { app: report-service }    # Метка на Service'е.
spec:
  selector: { app: report-service }  # Трафик в поды с этим лейблом.
  ports:
    - port: 8086                     # Порт Service'а — входящий.
      targetPort: 8086               # Порт пода (= containerPort).
  type: ClusterIP                    # Только из кластера.
                                     # Снаружи не выставлен.
```

