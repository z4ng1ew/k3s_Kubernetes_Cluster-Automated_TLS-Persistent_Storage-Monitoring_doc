## 🔗 Уникальная роль report-service: pub-sub архитектура

Все остальные сервисы общаются **синхронно через HTTP**. report-service — единственный, кто работает **асинхронно через сообщения**:

```
   [ booking-service ]
            │
            │ POST /api/v1/bookings обрабатывается клиентом
            │
            │ После сохранения брони:
            ▼
   ┌────────────────────────────────────────────────┐
   │ AMQP Publish:                                   │
   │   exchange: booking_statistics_exchange         │
   │   routing-key: booking.created                  │
   │   body: {                                       │
   │     bookingUid, userId, hotelUid,               │
   │     amount, dateInterval, timestamp             │
   │   }                                             │
   └─────────────────┬───────────────────────────────┘
                     │ TCP/AMQP к rabbitmq:5672
                     ▼
   ┌─────────────────────────────────────────────────┐
   │ RabbitMQ Pod                                     │
   │                                                  │
   │ exchange: booking_statistics_exchange            │
   │           │                                      │
   │           ▼ binding                              │
   │ queue:    booking_statistics_queue               │
   │   [msg-1] [msg-2] [msg-3] ...                    │
   └─────────────────┬───────────────────────────────┘
                     │ постоянное TCP-соединение
                     │ (исходящее от report-service!)
                     ▼
   ┌─────────────────────────────────────────────────┐
   │ Pod report-service                               │
   │                                                  │
   │ @RabbitListener(queues = "booking_statistics_queue")│
   │ void onBookingCreated(BookingEvent event) {     │
   │   // 1. Парсим событие                          │
   │   // 2. INSERT в statistics_db                   │
   │   // 3. Обновляем агрегаты                      │
   │ }                                                │
   └─────────────────┬───────────────────────────────┘
                     │
                     ▼
   ┌─────────────────────────────────────────────────┐
   │ PostgreSQL: statistics_db                        │
   │  - bookings_stats                                │
   │  - user_activity                                 │
   │  - hotel_popularity                              │
   └─────────────────────────────────────────────────┘
```

**Ключевая особенность:** соединение с RabbitMQ инициирует **сам** report-service. Никакой Service не нужен для consume-логики. Service на 8086 нужен только для HTTP-эндпоинтов запроса статистики (если они есть).

