# 📝 Построчный разбор Deployment + Service для booking-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment booking-service
# Микросервис бронирования — ЯДРО бизнес-логики приложения.
# Это самый "толстый" сервис: общается со всеми соседями
# (hotel, payment, loyalty) + публикует события в RabbitMQ.
#
# Поток "забронировать номер":
#   1. Postman → gateway → booking-service
#   2. booking → hotel-service: "есть такой отель/номер?"
#   3. booking → payment-service: "проведи оплату"
#   4. booking → loyalty-service: "начисли баллы"
#   5. booking → RabbitMQ: publish event "новая бронь"
#   6. report-service подпишется и обработает
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: booking-service              # Имя Deployment'а.
  labels: { app: booking-service }   # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ В продакшне для booking-service:
                                     # - 3+ реплики (это write-heavy + критически важный),
                                     # - autoscaling по CPU/RPS,
                                     # - идемпотентность операций (на случай retry).
  selector:
    matchLabels: { app: booking-service }
                                     # Какие поды Deployment контролирует.
  template:                          # Шаблон создаваемых подов.
    metadata:
      labels: { app: booking-service }
                                     # Метка пода — обязана совпадать с селектором.
    spec:
      containers:
        - name: booking-service      # Имя контейнера в поде.
          image: src-booking-service:latest
                                     # Локальный Docker-образ из проекта DO10.
                                     # Spring Boot приложение с REST API + AMQP клиент.
          imagePullPolicy: Never     # Использовать ТОЛЬКО локальный образ из containerd.
                                     # Должен быть импортирован заранее:
                                     #   k3s ctr images import booking-service.tar
          ports:
            - containerPort: 8083    # Порт Spring Boot приложения.
                                     # Согласован с ConfigMap (BOOKING_SERVICE_PORT: "8083").
          env:                       # ОЧЕНЬ много env-переменных — самая длинная секция!
                                     # booking-service интегрируется со множеством сервисов.

            # ─────────────────────────────────────────────
            # БЛОК env-1: Подключение к PostgreSQL
            # ─────────────────────────────────────────────
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST # → "postgres" (имя Service'а БД)
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432"
            - name: POSTGRES_DB
              value: reservations_db # ⚠️ Своя БД для бронирований!
                                     # Внимание: имя БД отличается от логики "bookings_db",
                                     # которое было в ConfigMap-документации.
                                     # Реально имя БД определяется init-скриптом образа
                                     # src-postgres. Если в БД нет reservations_db —
                                     # сервис упадёт с FATAL: database does not exist.
                                     # Должно совпадать с тем, что создаёт init-скрипт.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Логин из Secret (base64 → "postgres").
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret.

            # ─────────────────────────────────────────────
            # БЛОК env-2: Подключение к RabbitMQ
            # booking-service публикует события о новых бронях.
            # report-service подписан на эти события.
            # ─────────────────────────────────────────────
            - name: RABBIT_MQ_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_HOST }
                                     # → "rabbitmq" (имя Service'а)
            - name: RABBIT_MQ_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_PORT }
                                     # → "5672" (стандартный AMQP-порт)
            - name: RABBIT_MQ_QUEUE_NAME
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_QUEUE_NAME }
                                     # → "booking_statistics_queue"
                                     # Очередь, куда падают события о бронированиях.
                                     # Spring AMQP при старте создаст её автоматически,
                                     # если не существует.
            - name: RABBIT_MQ_EXCHANGE
              valueFrom:
                configMapKeyRef: { name: app-config, key: RABBIT_MQ_EXCHANGE }
                                     # → "booking_statistics_exchange"
                                     # Exchange, куда publish-ит сообщения.
                                     # Связь exchange → queue настраивается через binding
                                     # (тоже автоматически Spring AMQP).
            - name: RABBIT_MQ_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_USER }
                                     # → "guest" (из Secret)
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBIT_MQ_PASSWORD }
                                     # → "guest" (из Secret)

            # ─────────────────────────────────────────────
            # БЛОК env-3: Адрес hotel-service
            # При бронировании проверяем существование отеля,
            # доступность номера, цену.
            # ─────────────────────────────────────────────
            - name: HOTEL_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_HOST }
                                     # → "hotel-service"
            - name: HOTEL_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_PORT }
                                     # → "8082"
                                     # Полный URL для HTTP-вызова:
                                     #   http://hotel-service:8082/api/v1/hotels/{uid}

            # ─────────────────────────────────────────────
            # БЛОК env-4: Адрес payment-service
            # При создании брони → проводим оплату.
            # Это синхронный HTTP-вызов: бронь создаётся только
            # после успешной оплаты (или сразу отменяется).
            # ─────────────────────────────────────────────
            - name: PAYMENT_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: PAYMENT_SERVICE_HOST }
                                     # → "payment-service"
            - name: PAYMENT_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: PAYMENT_SERVICE_PORT }
                                     # → "8084"

            # ─────────────────────────────────────────────
            # БЛОК env-5: Адрес loyalty-service
            # После успешной брони → начисляем баллы лояльности.
            # Это тоже HTTP-вызов, может быть синхронным или
            # асинхронным через RabbitMQ.
            # ─────────────────────────────────────────────
            - name: LOYALTY_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_HOST }
                                     # → "loyalty-service"
            - name: LOYALTY_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_PORT }
                                     # → "8085"

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для booking-service
# Внутренний сервис, доступен только из кластера.
# К нему обращается ТОЛЬКО gateway-service.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: booking-service              # КЛЮЧЕВОЕ! По имени резолвится через CoreDNS.
                                     # gateway-service делает HTTP:
                                     #   POST http://booking-service:8083/api/v1/bookings
  labels: { app: booking-service }   # Метка на Service.
spec:
  selector: { app: booking-service } # Трафик идёт в поды с этим лейблом.
  ports:
    - port: 8083                     # Порт Service'а (входящий).
      targetPort: 8083               # Порт пода (= containerPort).
  type: ClusterIP                    # Только из кластера.
                                     # Снаружи к нему НЕТ доступа — это правильно,
                                     # внешний доступ только через gateway.
```

