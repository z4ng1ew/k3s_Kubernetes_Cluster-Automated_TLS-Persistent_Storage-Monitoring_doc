## 🗣 Монолог для защиты (~300 символов)

> booking-service — ядро бизнес-логики, оркестрирует процесс бронирования. Deployment с одной репликой запускает образ src-booking-service на порту 8083. Самая толстая секция env: подключение к PostgreSQL (БД reservations_db), к RabbitMQ для публикации событий и адреса трёх соседних сервисов — hotel, payment и loyalty. Service ClusterIP, доступ снаружи только через gateway-service.

