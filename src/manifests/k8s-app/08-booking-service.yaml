## 🔗 Полный жизненный цикл "Book Hotel" из Postman

Самый сложный сценарий в проекте — четвёртый тест в коллекции:

```
   [ Postman ]
        │ POST https://gateway.10.174.8.95.nip.io/api/v1/gateway/booking
        │ Body: { hotelUid, room, paymentInfo, dateInterval, roomCost }
        │ Authorization: Bearer eyJhbGc...
        ▼
   [ Ingress → gateway-service:8087 ]
        │ 1. Валидирует JWT
        │ 2. Маршрутизирует в booking
        ▼
   [ POST http://booking-service:8083/api/v1/bookings ]
        │
        ▼
   ┌─────────────────────────────────────────────────────┐
   │ Pod booking-service                                  │
   │                                                      │
   │ Шаг 1: Проверка отеля                                │
   │ ▼ GET http://hotel-service:8082/api/v1/hotels/{uid}  │
   │   ← 200 OK: {hotel info, цена, доступность}          │
   │                                                      │
   │ Шаг 2: Создание оплаты                               │
   │ ▼ POST http://payment-service:8084/api/v1/payments   │
   │   { amount: 2000, info: "somePaymentInfo" }          │
   │   ← 201 Created: {paymentUid, status: "PAID"}        │
   │                                                      │
   │ Шаг 3: Сохранение брони в БД                         │
   │ ▼ INSERT INTO bookings ... → reservations_db         │
   │                                                      │
   │ Шаг 4: Начисление баллов                             │
   │ ▼ POST http://loyalty-service:8085/api/v1/loyalty    │
   │   { userId, points: 200 }                            │
   │   ← 200 OK                                           │
   │                                                      │
   │ Шаг 5: Публикация события статистики                 │
   │ ▼ AMQP publish to rabbitmq:5672                      │
   │   exchange: booking_statistics_exchange              │
   │   routing-key: booking.created                       │
   │   payload: {bookingUid, hotelUid, userId, amount}    │
   │                                                      │
   │ Шаг 6: Возврат клиенту                               │
   │ ▼ 201 Created: {bookingUid, status, дата}            │
   └─────────────────────────────────────────────────────┘
        │
        │ Параллельно — асинхронно:
        ▼
   [ RabbitMQ ─ booking_statistics_queue ]
        │
        ▼
   [ report-service подписан → сохраняет статистику в report_db ]


Итог в Postman: 201 Created.
```

**Это распределённая транзакция!** В реальном продакшне обычно реализуется через **Saga pattern**: если payment упал — отменить бронь и т.д. У нас в учебном проекте логика, скорее всего, упрощена.

