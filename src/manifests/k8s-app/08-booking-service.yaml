## 💡 Возможные вопросы на защите

**В1: Почему у booking-service так много env-переменных по сравнению с hotel-service?**
> Потому что booking-service — это **узел-интегратор**. Он один взаимодействует со ВСЕМИ соседями:
> - **Read** из hotel-service (узнать про отель).
> - **Write** в payment-service (провести оплату).
> - **Write** в loyalty-service (начислить баллы).
> - **Publish** в RabbitMQ (событие статистики).
> - **Read/Write** в свою PostgreSQL.
> 
> hotel-service же — простой "поставщик данных", читает из своей БД и отдаёт. Поэтому ему нужны только POSTGRES_*.

**В2: Что произойдёт, если payment-service временно недоступен?**
> Зависит от реализации booking-service. Варианты:
> 
> 1. **Без обработки**: HTTP-вызов упадёт с `ConnectException` → исключение → клиент получит 500. Плохо.
> 2. **Retry**: Spring Retry повторит запрос N раз с backoff. Если payment всё ещё лежит — ошибка.
> 3. **Circuit breaker** (Resilience4j): после N ошибок "размыкает" цепь, дальше быстро отдаёт ошибку без вызова. Защищает от каскадного падения.
> 4. **Saga / Outbox pattern**: бронь создаётся в pending-статусе, payment вызывается асинхронно. При успехе — confirm, при провале — rollback.
> 
> Правильный production подход — комбинация 3 и 4.

**В3: Что такое Saga pattern и почему он важен?**
> В распределённой системе **нет глобальных транзакций**. Если в монолите можно было `BEGIN TRANSACTION ... COMMIT/ROLLBACK`, то здесь:
> - booking-service сохранил бронь.
> - payment-service провёл оплату.
> - loyalty-service упал — не начислил баллы.
> - КАК откатить первые два? Старая транзакция уже закоммичена!
> 
> Saga решает это через **компенсирующие действия**:
> - Каждый шаг имеет "обратное действие": Cancel Booking, Refund Payment, Revoke Points.
> - При неудаче выполняются компенсации в обратном порядке.
> - Реализуется через **оркестратор** (booking управляет всем) или **хореографию** (события в RabbitMQ).
> 
> Это паттерн eventual consistency.

**В4: Почему статистика через RabbitMQ, а не HTTP-вызов в report-service?**
> Это разные паттерны для разных целей:
> 
> **HTTP (синхронный)**: для случаев, когда **результат критичен и нужен немедленно**:
> - Оплата прошла? Да/нет.
> - Отель свободен? Да/нет.
> 
> **RabbitMQ (асинхронный)**: для случаев, когда **критичен сам факт события, но не результат немедленно**:
> - Статистика бронирований — её можно собирать с задержкой.
> - Email-уведомления — клиенту неважно, отправлено через 100мс или 5 сек.
> - Аудит-лог.
> 
> Плюсы async:
> - report-service может падать/перезапускаться — события не теряются.
> - booking-service быстрее отвечает клиенту (не ждёт repor t-service).
> - Можно горизонтально масштабировать обработчики.

**В5: Что произойдёт, если booking-service упадёт после INSERT в БД, но до publish в RabbitMQ?**
> Это классическая проблема **dual-write**. Симптом: бронь есть в БД, но статистика её "не видит" — записи в report_db не будет.
> 
> Решения:
> 
> 1. **Transactional Outbox pattern**:
>    - В той же транзакции INSERT booking + INSERT в таблицу `outbox`.
>    - Отдельный поток читает outbox и publish-ит в RabbitMQ.
>    - Если упадём — после рестарта outbox обработается заново.
> 
> 2. **CDC (Change Data Capture)**:
>    - Debezium читает WAL PostgreSQL и автоматически публикует в Kafka/RabbitMQ.
>    - Никакой dual-write вообще не нужен.
> 
> 3. **При старте проверять и публиковать unprocessed**:
>    - В таблице добавить флаг `published: bool`.
>    - При старте — найти `published=false` и опубликовать.

**В6: Почему RABBIT_MQ_QUEUE_NAME лежит в ConfigMap, а POSTGRES_DB — нет?**
> Это **инконсистентность** в моём проекте. Логичнее было бы:
> - Если БД у каждого сервиса своя → POSTGRES_DB в Deployment'е (как сейчас).
> - Если очередь у каждого тоже своя → RABBIT_MQ_QUEUE_NAME в Deployment'е.
> 
> Но я положил queue в ConfigMap, потому что:
> - **Очередь и exchange общие** для booking (producer) и report (consumer) — обоим нужно одно имя. Удобно держать в общем месте.
> - Если каждый сервис продьюсит в свою очередь — лучше в Deployment.
> 
> Это вопрос дизайна, не ошибка.

**В7: Что произойдёт, если все три соседних сервиса (hotel/payment/loyalty) недоступны одновременно?**
> Без обработки ошибок — booking-service застрянет в попытках вызвать их с timeout по 30-60 секунд. Все потоки пула HTTP-клиента заняты → новые запросы клиентов отвергаются → лавина.
> 
> Это **каскадный отказ** (cascading failure). Защита:
> 
> 1. **Короткие таймауты** (1-3 сек) на HTTP-вызовы.
> 2. **Circuit breaker** — после N ошибок сразу возвращать failure, не делая вызов.
> 3. **Bulkheading** — раздельные пулы потоков для разных downstream-сервисов.
> 4. **Graceful degradation** — отдать клиенту "сейчас бронирование недоступно, попробуйте позже".

**В8: Что если две Postman-сессии одновременно бронируют один номер в одном отеле?**
> Это **race condition**. Возможные сценарии:
> 
> 1. Оба `SELECT room WHERE status='free'` → видят свободный.
> 2. Оба `INSERT booking` → две брони на одну ночь!
> 
> Защита:
> 
> 1. **Pessimistic lock** в БД: `SELECT ... FOR UPDATE` — блокирует строку до commit.
> 2. **Optimistic lock**: версионное поле, сравнение при UPDATE.
> 3. **Unique constraint** в БД: `UNIQUE(hotel_id, room, date)` — второй INSERT упадёт.
> 4. **Distributed lock** (Redis): захват замка перед операцией.
> 
> В нашем учебном проекте, скорее всего, нет защиты — это нормальный технический долг для лабораторной.

**В9: Можно ли разнести booking-service по нескольким репликам, если он публикует в RabbitMQ?**
> Да, без проблем! RabbitMQ — multi-publisher safe:
> - Каждый под открывает свой connection к RabbitMQ.
> - Publish — атомарная операция, конфликтов между публикаторами нет.
> - Очередь поглощает сообщения от любого количества producer'ов.
> 
> Проблема может быть только в **подписке**: если report-service слушает очередь в нескольких репликах — сообщения распределятся между ними (competing consumers), что обычно желаемо. Если не желаемо — нужно настраивать exclusive consumer.

**В10: Что произойдёт при `kubectl rollout restart deploy/booking-service`?**
> Зависит от стратегии (по умолчанию RollingUpdate):
> 
> 1. k8s создаёт новый под booking-service-v2.
> 2. Ждёт его Readiness (по readinessProbe; у нас не настроен → как только container started).
> 3. Service добавляет v2 в endpoints, убирает v1.
> 4. Граcefully shutdown v1 (SIGTERM → 30 сек на завершение → SIGKILL).
> 5. Результат: zero-downtime restart.
> 
> ⚠️ Без readiness probe Service может начать слать трафик ДО того, как Spring Boot прогрузится → 502 в течение 10-20 секунд. Стоит добавить readiness probe в Spring Actuator `/actuator/health`.

**В11: Какие resource limits я бы поставил в продакшне для booking-service?**
> Примерно так:
> ```yaml
> resources:
>   requests:
>     cpu: "100m"      # гарантированные 0.1 CPU
>     memory: "256Mi"  # гарантированная RAM
>   limits:
>     cpu: "500m"      # максимум 0.5 CPU
>     memory: "512Mi"  # максимум RAM, иначе OOMKill
> ```
> 
> Spring Boot стартует медленно и кушает память, поэтому memory limit нельзя жёстко урезать. CPU можно — Spring переживёт throttling.
> 
> requests влияют на scheduling, limits — на cgroup ограничения.

