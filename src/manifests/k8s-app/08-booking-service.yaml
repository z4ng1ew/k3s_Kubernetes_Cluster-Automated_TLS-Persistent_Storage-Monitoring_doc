```
                   [ gateway-service ]
                          │
                          │ POST /api/v1/bookings
                          ▼
              ┌────────────────────────┐
              │   booking-service      │
              │     :8083              │
              └─────┬────┬────┬───┬────┘
                    │    │    │   │
        ┌───────────┘    │    │   └────────────┐
        │            ┌───┘    └────┐           │
        ▼            ▼             ▼           ▼
  [ PostgreSQL ] [ hotel ]   [ payment ]  [ loyalty ]
  reservations    :8082        :8084        :8085
  _db
        │
        │ (тут же)
        ▼
  [ RabbitMQ :5672 ]
   exchange: booking_statistics_exchange
        │
        ▼ subscribed
  [ report-service ]
