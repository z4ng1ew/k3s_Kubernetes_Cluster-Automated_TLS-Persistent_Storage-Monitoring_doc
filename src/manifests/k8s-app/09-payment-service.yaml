# 📝 Построчный разбор Deployment + Service для payment-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment payment-service
# Микросервис обработки платежей.
# Простой stateless-сервис: создаёт запись о платеже, хранит
# историю транзакций в своей БД (payments_db).
# В реальном продакшне сюда же бы интегрировались внешние
# платёжные шлюзы (Stripe, Сбер, ЮKassa) — но в учебном
# проекте это симуляция: "платёж всегда успешен".
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: payment-service              # Имя Deployment'а.
  labels: { app: payment-service }   # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ В продакшне для payment-service:
                                     # - 2+ реплики (финансовый сервис критичен),
                                     # - идемпотентность по transaction_id (защита от
                                     #   двойного списания при retry),
                                     # - бекапы БД чаще, чем у других (каждый час).
  selector:
    matchLabels: { app: payment-service }
                                     # Селектор: какие поды Deployment контролирует.
  template:                          # Шаблон создаваемых подов.
    metadata:
      labels: { app: payment-service }
                                     # Метка пода — совпадает с селектором.
    spec:
      containers:
        - name: payment-service      # Имя контейнера в поде.
          image: src-payment-service:latest
                                     # Локальный образ Spring Boot приложения из DO10.
          imagePullPolicy: Never     # Только локальный образ из containerd k3s.
                                     # Должен быть импортирован заранее:
                                     #   k3s ctr images import payment-service.tar
          ports:
            - containerPort: 8084    # Порт Spring Boot.
                                     # Согласован с ConfigMap (PAYMENT_SERVICE_PORT: "8084").
                                     # Booking-service ходит сюда по адресу
                                     # http://payment-service:8084
          env:                       # Минимальный набор переменных!
                                     # payment-service — самый "одинокий" сервис в системе:
                                     # к нему обращаются (booking), но он сам ни с кем не
                                     # связан, кроме своей БД. Не публикует события в
                                     # RabbitMQ, не вызывает другие сервисы.

            # ─────────────────────────────────────────────
            # Подключение к PostgreSQL (единственная зависимость)
            # ─────────────────────────────────────────────
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST # → "postgres" (имя Service'а БД)
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432"
            - name: POSTGRES_DB
              value: payments_db     # ⚠️ Plain value — у каждого сервиса своя БД.
                                     # payments_db — отдельная БД для финансовых операций.
                                     # Это правильная изоляция: данные о платежах не должны
                                     # смешиваться с бронями/отелями.
                                     # БД создаётся init-скриптом в образе src-postgres.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Логин postgres из Secret.
                                     # ⚠️ В продакшне для финансового сервиса нужно:
                                     # отдельный юзер payment_user, только с правами на
                                     # payments_db, никакого superuser.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для payment-service
# Внутренний сервис, изолирован от внешнего мира.
# К нему обращается ТОЛЬКО booking-service.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: payment-service              # КЛЮЧЕВОЕ! По имени резолвится через CoreDNS.
                                     # В ConfigMap: PAYMENT_SERVICE_HOST: payment-service
                                     # booking-service делает:
                                     #   POST http://payment-service:8084/api/v1/payments
                                     #   { amount, paymentInfo, bookingUid }
  labels: { app: payment-service }   # Метка на Service'е.
spec:
  selector: { app: payment-service } # Трафик в поды с этим лейблом.
  ports:
    - port: 8084                     # Входящий порт Service'а.
      targetPort: 8084               # Порт пода (= containerPort).
  type: ClusterIP                    # Только из кластера.
                                     # ⚠️ Внешний доступ КАТЕГОРИЧЕСКИ запрещён!
                                     # Платёжный сервис — это уязвимое место:
                                     # - Хранит данные банковских карт (в реальном проекте).
                                     # - Обрабатывает деньги.
                                     # - PCI DSS требует строжайшей изоляции.
                                     # ClusterIP + отсутствие Ingress = ни байта снаружи.
```

