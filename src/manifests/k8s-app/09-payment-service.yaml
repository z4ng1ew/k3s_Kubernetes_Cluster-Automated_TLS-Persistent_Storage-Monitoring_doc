## 🆚 Сравнение payment-service с booking-service

```
┌─────────────────────────────────────────────────────────────┐
│                    КОЛИЧЕСТВО ENV                            │
├──────────────────────────────┬──────────────────────────────┤
│ booking-service: 18 env      │ payment-service: 5 env       │
│ - PostgreSQL (5)             │ - PostgreSQL (5)             │
│ - RabbitMQ (6)               │                              │
│ - HOTEL host/port (2)        │                              │
│ - PAYMENT host/port (2)      │                              │
│ - LOYALTY host/port (2)      │                              │
└──────────────────────────────┴──────────────────────────────┘
```

**Почему такая разница?**

- **booking-service** — это **оркестратор**: дирижирует процессом бронирования, опрашивая 3-4 сервиса и публикуя события.
- **payment-service** — это **листовой сервис**: принимает запрос, делает свою работу, отвечает. Никого не дёргает.

Это типичная **звёздная топология** микросервисов: один сервис в центре связан со многими, а periphery-сервисы изолированы.

---

## 🗣 Монолог для защиты (~300 символов)

> payment-service — изолированный микросервис обработки платежей. Deployment с одной репликой на порту 8084. Минимальный набор env: только подключение к собственной БД payments_db через ConfigMap (host/port) и Secret (логин/пароль). Не связан ни с RabbitMQ, ни с другими сервисами — к нему обращается только booking-service. Service ClusterIP полностью изолирует его от внешнего мира.

*(длина ~400 символов, могу сократить до 300)*

