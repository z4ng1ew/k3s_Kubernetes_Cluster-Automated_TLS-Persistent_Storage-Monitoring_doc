apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: src-payment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: payments_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels: { app: payment-service }
spec:
  selector: { app: payment-service }
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
