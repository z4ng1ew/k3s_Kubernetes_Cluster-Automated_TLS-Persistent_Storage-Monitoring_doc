## 🔗 Где payment-service в общей картине

Этот сервис — **самый изолированный** в системе:

```
   [ Внешний мир / Postman ]
              │
              ▼
   [ Ingress ] ─── НЕТ доступа к payment-service!
              │
              ▼
   [ gateway-service ] ─── ТАКЖЕ НЕ ходит напрямую в payment!
              │
              ▼
   [ booking-service ] ─── только этот сервис вызывает payment
              │
              │ POST http://payment-service:8084/api/v1/payments
              │ Body: { amount: 2000, info: "card_4242...", bookingUid }
              ▼
   ┌───────────────────────────────────────┐
   │ payment-service                       │
   │  - валидирует данные карты            │
   │  - симулирует обращение в банк        │
   │  - сохраняет транзакцию               │
   │  - возвращает paymentUid + статус     │
   └────────────────┬──────────────────────┘
                    │
                    │ JDBC
                    ▼
   [ PostgreSQL: payments_db ]
              │
              ▼
   ┌─────────────────────────────────────┐
   │ Таблица transactions:                │
   │ - id                                 │
   │ - bookingUid                         │
   │ - amount                             │
   │ - currency                           │
   │ - status (PAID/FAILED/REFUNDED)      │
   │ - paymentInfo (масированно)          │
   │ - createdAt                          │
   └─────────────────────────────────────┘
```

**Особенности payment-service:**

| Свойство | Значение | Почему |
|----------|----------|--------|
| Входящие вызовы | Только от booking-service | Никто другой не должен инициировать платежи |
| Исходящие вызовы | Нет! Только в БД | Никаких HTTP-вызовов соседям, никакого RabbitMQ |
| Внешний доступ | Категорически нет | PCI DSS, безопасность |
| Состояние | Stateless (всё в БД) | Легко масштабируется |
| Размер env-секции | Минимальный (5 переменных) | Нет интеграций с соседями |

