## 🆚 Сравнение всех "листовых" сервисов

```
┌─────────────────────────────────────────────────────────────────┐
│       hotel-service    payment-service    loyalty-service        │
├─────────────────────────────────────────────────────────────────┤
│ Порт:        8082             8084               8085            │
│ БД:          hotels_db        payments_db        balances_db     │
│ Env:         5 переменных     5 переменных       5 переменных    │
│ RabbitMQ:    нет              нет                нет             │
│ Внешние:     нет              нет                нет             │
│ HTTP клиенты:                                                    │
│   booking ──►   ✅               ✅                  ✅            │
│   gateway ──►   ✅               ❌                  ✅            │
│              (для /hotels)    (только через      (для /loyalty)  │
│                                 booking)                         │
└─────────────────────────────────────────────────────────────────┘
```

**Закономерность:** все три сервиса — структурные близнецы. Меняются только три параметра:
1. Имя ресурсов (hotel/payment/loyalty).
2. Порт (8082/8084/8085).
3. БД (hotels_db/payments_db/balances_db).

Это **типовой шаблон** для CRUD-микросервиса в k8s. Если в проекте появится новый сервис (например, `notification-service`) — он, скорее всего, будет описан таким же шаблоном.

