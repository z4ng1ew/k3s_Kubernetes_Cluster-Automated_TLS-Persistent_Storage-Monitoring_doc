apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
  labels: { app: loyalty-service }
spec:
  selector: { app: loyalty-service }
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP





# 📝 Построчный разбор Deployment + Service для loyalty-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment loyalty-service
# Микросервис программы лояльности.
# Хранит баланс бонусных баллов пользователей.
# Структурно — близнец payment-service: тоже изолированный
# листовой сервис с одной БД и без интеграций с соседями.
#
# Поток использования:
#   - GET /loyalty       → читает баланс из balances_db
#   - POST /loyalty      → начисляет/списывает баллы
# В Postman: тест "Get User's Loyalty Balance" проходит
# через gateway → loyalty-service.
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: loyalty-service              # Имя Deployment'а.
  labels: { app: loyalty-service }   # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ В продакшне для loyalty-service:
                                     # - 2+ реплики (часто запрашивается клиентами),
                                     # - read-heavy (баланс читают чаще, чем меняют),
                                     # - идемпотентность операций начисления.
  selector:
    matchLabels: { app: loyalty-service }
                                     # Селектор подов.
  template:                          # Шаблон создаваемых подов.
    metadata:
      labels: { app: loyalty-service }
                                     # Метка пода — совпадает с селектором.
    spec:
      containers:
        - name: loyalty-service      # Имя контейнера в поде.
          image: src-loyalty-service:latest
                                     # Локальный образ Spring Boot из DO10.
          imagePullPolicy: Never     # Только локальный образ из containerd k3s.
                                     # Образ заранее импортирован:
                                     #   k3s ctr images import loyalty-service.tar
          ports:
            - containerPort: 8085    # Порт Spring Boot.
                                     # Согласован с ConfigMap (LOYALTY_SERVICE_PORT: "8085").
                                     # booking-service ходит сюда:
                                     #   http://loyalty-service:8085/api/v1/loyalty
          env:                       # Минимальный набор переменных (как у payment-service).

            # ─────────────────────────────────────────────
            # Подключение к PostgreSQL — единственная зависимость
            # ─────────────────────────────────────────────
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST # → "postgres"
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
                                     # → "5432"
            - name: POSTGRES_DB
              value: balances_db     # ⚠️ Своя БД для балансов лояльности!
                                     # Название может смутить: "balances_db" вместо
                                     # ожидаемого "loyalty_db". Это историческое название
                                     # из проекта DO10. Главное — оно совпадает с init-
                                     # скриптом образа src-postgres.
                                     # Внутри БД таблицы вроде:
                                     #   user_balances (user_id, points, status)
                                     #   loyalty_history (id, user_id, delta, reason)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
                                     # Логин из Secret (postgres superuser для лабы).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
                                     # Пароль из Secret.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для loyalty-service
# Внутренний сервис. Доступен только через gateway/booking.
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: loyalty-service              # КЛЮЧЕВОЕ! По имени резолвится через CoreDNS.
                                     # В ConfigMap: LOYALTY_SERVICE_HOST: loyalty-service
                                     # Два потребителя:
                                     # 1. booking-service — после успешной брони
                                     #    POST http://loyalty-service:8085/api/v1/loyalty
                                     #    { userId, points: +200 }
                                     # 2. gateway-service — для запроса баланса
                                     #    GET http://loyalty-service:8085/api/v1/loyalty
                                     #    Headers: X-User-Id: ...
  labels: { app: loyalty-service }   # Метка на Service.
spec:
  selector: { app: loyalty-service } # Трафик идёт в поды с этим лейблом.
  ports:
    - port: 8085                     # Порт Service'а — входящий.
      targetPort: 8085               # Порт пода — куда форвардить.
  type: ClusterIP                    # Доступен только из кластера.
                                     # Снаружи к нему НЕТ прямого пути — только через gateway.
```

