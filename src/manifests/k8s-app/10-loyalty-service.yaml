## 🔗 Как loyalty-service вписывается в систему

```
   [ Postman: Get User's Loyalty Balance ]
              │
              │ GET https://gateway.10.174.8.95.nip.io/api/v1/gateway/loyalty
              │ Authorization: Bearer eyJhbGc...
              ▼
   [ Ingress → gateway-service:8087 ]
              │ 1. Валидирует JWT
              │ 2. Извлекает userId из токена
              │ 3. Маршрутизирует на loyalty
              ▼
   [ GET http://loyalty-service:8085/api/v1/loyalty ]
              │ Header: X-User-Id: 123
              ▼
   ┌────────────────────────────────────────┐
   │ Pod loyalty-service                     │
   │                                         │
   │ SELECT * FROM user_balances             │
   │   WHERE user_id = 123                   │
   │                                         │
   │ Возвращает: { points: 500, status: ... } │
   └────────────────┬───────────────────────┘
                    │
                    ▼
   [ JDBC: jdbc:postgresql://postgres:5432/balances_db ]
                    │
                    ▼
   [ Service postgres → Pod postgres → /var/lib/postgres-pv ]
                    │
                    ▼
   [ Возврат: { userId: 123, points: 500 } ]


Параллельный поток — начисление баллов при бронировании:

   [ booking-service после успешной брони ]
              │
              │ POST http://loyalty-service:8085/api/v1/loyalty
              │ { userId: 123, delta: +200, reason: "booking_completed" }
              ▼
   [ loyalty-service ]
              │
              │ INSERT INTO loyalty_history (user_id, delta, reason) ...
              │ UPDATE user_balances SET points = points + 200
              │     WHERE user_id = 123
              ▼
   [ Возврат: { newBalance: 700 } ]
```

