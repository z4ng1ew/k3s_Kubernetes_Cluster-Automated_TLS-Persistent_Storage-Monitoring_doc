## 🧮 Архитектурный паттерн: "Звезда вокруг booking-service"

```
                  ┌─────────────────┐
                  │ gateway-service  │
                  │     :8087        │
                  └────────┬─────────┘
                           │
            ┌──────────────┼──────────────┐
            ▼              ▼              ▼
       [ hotel ]    [ booking ]    [ loyalty ]
       :8082        :8083 ★        :8085
                       │
            ┌──────────┴──────────┬─────────────┐
            ▼                     ▼             ▼
       [ hotel ]            [ payment ]    [ loyalty ]
                            :8084
                       
                       │
                       ▼ event
                  [ RabbitMQ ]
                       │
                       ▼
                  [ report ]
                  :8086

★ — booking-service ходит в hotel/payment/loyalty + RabbitMQ
```

**Кто куда ходит:**

| Сервис | Кого вызывает |
|--------|---------------|
| gateway | session (валидация JWT), hotel, booking, loyalty |
| session | ничего (только БД) |
| hotel | ничего (только БД) |
| booking | hotel, payment, loyalty + RabbitMQ |
| payment | ничего (только БД) |
| loyalty | ничего (только БД) |
| report | ничего (только подписка на RabbitMQ + БД) |

**Booking-service — единственный оркестратор**. Все остальные — либо листовые (payment/loyalty/hotel), либо точки входа (gateway/session), либо обработчики событий (report).

