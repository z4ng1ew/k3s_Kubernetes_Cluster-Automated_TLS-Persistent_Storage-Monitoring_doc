## 🗣 Монолог для защиты (~300 символов)

> loyalty-service хранит баланс бонусных баллов пользователей. Deployment с одной репликой на порту 8085. Структурно — близнец payment-service: только подключение к собственной БД balances_db через ConfigMap (host/port) и Secret (логин/пароль). Без RabbitMQ и без вызовов соседей. К нему обращаются booking-service (начисление баллов) и gateway-service (запрос баланса). Service ClusterIP, наружу скрыт.

*(длина ~420 символов, могу сократить до 300)*

