| RabbitMQ | ❌ | ❌ | ✅ (publisher) | ❌ | ❌ | ✅ (consumer) | **❌** |
| Вызывает соседей | ❌ | ❌ | hotel, payment, loyalty | ❌ | ❌ | ❌ | **session, hotel, booking, loyalty, report** |
| Доступен снаружи | ✅ (через Ingress) | ❌ | ❌ | ❌ | ❌ | ❌ | **✅ (через Ingress)** |
| Env-переменных | 5 | 5 | 18 | 5 | 5 | 10 | **10** |
| Stateful? | ❌ | ❌ | ❌ | ❌ | ❌ | ❌ | **❌ полностью** |

gateway-service **уникален** тем, что:
- **Не имеет БД вообще** — он не хранит данные, только проксирует.
- **Самое много исходящих вызовов** — ходит почти ко всем.
- **Точка входа для всех бизнес-операций** — критично для доступности.

