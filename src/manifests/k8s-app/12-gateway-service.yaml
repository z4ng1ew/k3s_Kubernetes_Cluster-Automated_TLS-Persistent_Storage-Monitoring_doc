## 🏛 Архитектурная роль gateway-service

```
                    [ ИНТЕРНЕТ / Postman / Браузер ]
                                  │
                                  ▼
                       ╔═══════════════════════╗
                       ║  Ingress-Nginx        ║
                       ║  (только HTTPS наружу) ║
                       ╚════════════╤══════════╝
                                    │
                ┌───────────────────┴──────────────────┐
                ▼                                      ▼
       [ session-service ]                  [ gateway-service ]
        (login endpoint)                     (всё остальное)
              :8081                               :8087
                                                  │
                                                  │ маршрутизация
                                                  │ + валидация JWT
                                                  │
              ┌────────────┬────────────┬─────────┴─────────┬─────────────┐
              ▼            ▼            ▼                   ▼             ▼
        [ session ] [ hotel ]    [ booking ]         [ loyalty ]    [ report ]
        (validate)   :8082        :8083                :8085         :8086
                                     │
                                     │ только booking имеет доступ
                                     ▼
                              [ payment ]
                               :8084
                                     
                              [ RabbitMQ ]
                                     │
                                     ▼
                              [ report ]
                                     │
                                     ▼
                              [ statistics_db ]
```

**Принципы:**

1. **Gateway = единая точка входа** для бизнес-API (всё, что после логина).
2. **Session = отдельная точка входа** только для логина (получения токена).
3. **Payment скрыт** даже от gateway — к нему ходит ТОЛЬКО booking.
4. **Все внутренние сервисы** ClusterIP, не выставлены наружу.

