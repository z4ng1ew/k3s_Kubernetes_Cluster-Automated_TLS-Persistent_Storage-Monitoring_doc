# 📝 Построчный разбор Deployment + Service для gateway-service

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment gateway-service
# Микросервис — единая точка входа в систему (API Gateway).
# Это "лицо" приложения для внешнего мира.
#
# Ключевые функции:
#  1. Принимает HTTP-запросы извне через Ingress.
#  2. Аутентифицирует пользователей (валидирует JWT-токены).
#  3. Маршрутизирует запросы на нужный внутренний сервис.
#  4. Может агрегировать данные от нескольких сервисов.
#  5. Применяет cross-cutting: rate limit, логирование, CORS.
#
# В Postman: ВСЕ запросы (кроме Login User) идут через него:
#  GET  /api/v1/gateway/hotels         → hotel-service
#  GET  /api/v1/gateway/hotels/{uid}   → hotel-service
#  POST /api/v1/gateway/booking        → booking-service
#  GET  /api/v1/gateway/loyalty        → loyalty-service
# ============================================================
apiVersion: apps/v1                  # API-группа apps, версия v1.
kind: Deployment                     # Тип ресурса: управляемый набор подов.
metadata:
  name: gateway-service              # Имя Deployment'а.
  labels: { app: gateway-service }   # Метка на Deployment (inline YAML).
spec:
  replicas: 1                        # Одна реплика для лабы.
                                     # ⚠️ В продакшне gateway-service — самое
                                     # критичное звено! Минимум 3 реплики:
                                     # - Все клиенты бьются именно сюда.
                                     # - Падение = полная недоступность API.
                                     # - Нагрузка часто пиковая (DDoS-сценарии).
                                     # + HPA по CPU/RPS, anti-affinity между нодами.
  selector:
    matchLabels: { app: gateway-service }
                                     # Селектор: какие поды Deployment контролирует.
  template:                          # Шаблон создаваемых подов.
    metadata:
      labels: { app: gateway-service }
                                     # Метка пода — совпадает с селектором.
    spec:
      containers:
        - name: gateway-service      # Имя контейнера в поде.
          image: src-gateway-service:latest
                                     # Локальный образ Spring Boot из DO10.
                                     # Содержит:
                                     # - Spring Cloud Gateway / Spring MVC.
                                     # - REST-клиенты (WebClient/RestTemplate) для downstream.
                                     # - JWT валидатор (или вызов session-service).
          imagePullPolicy: Never     # Только локальный образ из containerd k3s.
                                     # Образ заранее импортирован:
                                     #   k3s ctr images import gateway-service.tar
          ports:
            - containerPort: 8087    # Порт Spring Boot.
                                     # Согласован с Postman (GATEWAY_PORT: "8087").
                                     # Согласован с ConfigMap (SESSION_SERVICE_PORT и т.д.).
                                     # ⚠️ Замечу: у gateway нет ключа GATEWAY_SERVICE_PORT
                                     # в ConfigMap — он самостоятельно знает свой порт,
                                     # это значение нужно лишь Ingress'у при routing.
          env:                       # 10 env-переменных — все адреса соседних сервисов.
                                     # ⚠️ Нет POSTGRES_* и RABBIT_MQ_* — gateway не имеет
                                     # собственной БД и не использует RabbitMQ!
                                     # Он stateless-прокси: получил запрос, проверил токен,
                                     # переслал дальше, вернул ответ.

            # ─────────────────────────────────────────────
            # БЛОК env-1: Адрес session-service
            # Для валидации Bearer-токенов из заголовка Authorization.
            # Когда приходит запрос, gateway проверяет токен:
            #   GET http://session-service:8081/api/v1/auth/validate
            # ─────────────────────────────────────────────
            - name: SESSION_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SESSION_SERVICE_HOST  # → "session-service"
            - name: SESSION_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: SESSION_SERVICE_PORT }
                                     # → "8081"

            # ─────────────────────────────────────────────
            # БЛОК env-2: Адрес hotel-service
            # Маршрут: /api/v1/gateway/hotels → /api/v1/hotels
            # ─────────────────────────────────────────────
            - name: HOTEL_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_HOST }
                                     # → "hotel-service"
            - name: HOTEL_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_PORT }
                                     # → "8082"

            # ─────────────────────────────────────────────
            # БЛОК env-3: Адрес booking-service
            # Маршрут: /api/v1/gateway/booking → /api/v1/bookings
            # ─────────────────────────────────────────────
            - name: BOOKING_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: BOOKING_SERVICE_HOST }
                                     # → "booking-service"
            - name: BOOKING_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: BOOKING_SERVICE_PORT }
                                     # → "8083"

            # ─────────────────────────────────────────────
            # БЛОК env-4: Адрес loyalty-service
            # Маршрут: /api/v1/gateway/loyalty → /api/v1/loyalty
            # ─────────────────────────────────────────────
            - name: LOYALTY_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_HOST }
                                     # → "loyalty-service"
            - name: LOYALTY_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_PORT }
                                     # → "8085"

            # ─────────────────────────────────────────────
            # БЛОК env-5: Адрес report-service
            # Маршрут: /api/v1/gateway/reports → /api/v1/reports
            # ⚠️ В Postman-тестах не используется,
            # но может быть админский эндпоинт для отчётов.
            # ─────────────────────────────────────────────
            - name: REPORT_SERVICE_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: REPORT_SERVICE_HOST }
                                     # → "report-service"
            - name: REPORT_SERVICE_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: REPORT_SERVICE_PORT }
                                     # → "8086"

            # ⚠️ Замечу: НЕТ env-переменных для payment-service!
            # Это правильно: к payment ходит ТОЛЬКО booking-service,
            # gateway не должен проводить платежи напрямую.
            # Защита от прямого вызова /api/v1/payments снаружи.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: Service для gateway-service
# Порт 8087. ClusterIP — да, ClusterIP, потому что
# наружу выводится через Ingress (а не через NodePort).
# ============================================================
apiVersion: v1                       # Core API.
kind: Service                        # Балансировщик + DNS-имя.
metadata:
  name: gateway-service              # КЛЮЧЕВОЕ! По имени резолвится через CoreDNS.
                                     # ⚠️ Этот Service — backend для Ingress!
                                     # В Ingress (см. отдельный манифест):
                                     #   backend:
                                     #     service:
                                     #       name: gateway-service
                                     #       port:
                                     #         number: 8087
  labels: { app: gateway-service }   # Метка на Service'е.
spec:
  selector: { app: gateway-service } # Трафик в поды с этим лейблом.
  ports:
    - port: 8087                     # Порт Service'а — входящий.
                                     # Совпадает с Postman GATEWAY_PORT=8087.
      targetPort: 8087               # Порт пода (= containerPort).
  type: ClusterIP                    # Только из кластера!
                                     # ⚠️ Тут типичная путаница студентов:
                                     # "Если gateway — точка входа, не должен ли он быть
                                     # NodePort/LoadBalancer?"
                                     # ОТВЕТ: Нет! Внешний доступ через Ingress.
                                     # Ingress (Nginx-под) сам внутри кластера,
                                     # и он проксирует трафик на ClusterIP gateway.
                                     # Снаружи виден только Ingress-Controller на
                                     # портах 80/443. gateway — внутренний сервис.
```

