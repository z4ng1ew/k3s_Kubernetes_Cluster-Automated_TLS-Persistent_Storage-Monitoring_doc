## 🗣 Монолог для защиты (~300 символов)

> gateway-service — единая точка входа в систему (паттерн API Gateway). Deployment с одной репликой на порту 8087. Не имеет собственной БД и не подключён к RabbitMQ — это чисто маршрутизатор. В env-секции 10 переменных: адреса 5 внутренних сервисов (session, hotel, booking, loyalty, report). Service ClusterIP; снаружи доступен через Ingress по адресу gateway.10.174.8.95.nip.io. Все Postman-тесты, кроме Login User, идут через него.

