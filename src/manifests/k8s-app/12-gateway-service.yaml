## 💡 Возможные вопросы на защите

**В1: Что такое API Gateway и зачем он нужен?**
> **API Gateway** — это архитектурный паттерн: единая точка входа, через которую внешние клиенты обращаются к множеству внутренних микросервисов. Основные функции:
> 
> 1. **Routing**: маршрутизация запросов на нужный backend-сервис.
> 2. **Authentication / Authorization**: валидация токенов в одном месте.
> 3. **Aggregation**: можно собрать данные с нескольких сервисов в один ответ.
> 4. **Cross-cutting concerns**: rate limit, CORS, логирование, мониторинг, кеширование.
> 5. **Versioning**: можно держать /api/v1 и /api/v2 одновременно.
> 6. **Protocol translation**: REST для клиентов, gRPC для внутренних.
> 7. **Stable contract**: внутренняя архитектура может меняться, клиент не пострадает.

**В2: В чём отличие gateway-service от Ingress-Nginx?**
> Оба — "входные точки", но на разных уровнях:
> 
> **Ingress-Nginx**:
> - Работает на уровне L7 (HTTP-маршрутизация).
> - Знает только про path/host → service.
> - **Не знает про бизнес-логику**: что такое JWT, кто авторизован, нужно ли агрегировать данные.
> - Это инфраструктурный компонент.
> 
> **gateway-service**:
> - Spring Boot приложение с бизнес-логикой.
> - Понимает JWT, роли, RBAC.
> - Может агрегировать данные (запросить hotel + loyalty и собрать в один ответ).
> - Может трансформировать запросы.
> 
> Эти два уровня дополняют друг друга: Ingress пускает трафик в кластер, gateway "понимает" его на уровне приложения.

**В3: Почему gateway сам не делает TLS termination?**
> Технически он мог бы — поднять HTTPS-listener в Spring Boot, дать сертификат. Но это **антипаттерн**:
> 
> 1. **Управление сертификатами** должно быть централизованным: cert-manager обновляет → Ingress подхватывает. У всех сервисов это было бы дублирование.
> 
> 2. **Производительность**: Nginx написан на C, оптимизирован для TLS. Spring Boot будет тратить CPU на расшифровку.
> 
> 3. **Гранулярность**: Ingress может терминировать TLS для разных хостов с разными сертификатами в одном месте.
> 
> 4. **Обновление без рестарта**: Nginx умеет reload без потери соединений. У Spring Boot изменение TLS-конфига требует рестарта.
> 
> Стандарт индустрии: **TLS termination на edge** (на уровне Ingress/Load Balancer), внутри кластера — обычный HTTP.

**В4: Почему gateway не имеет POSTGRES env? У него нет БД?**
> Верно, у gateway-service **нет собственной БД** — это намеренный архитектурный выбор:
> 
> 1. **Stateless**: gateway не хранит никаких данных. Он только перенаправляет.
> 2. **Масштабируемость**: stateless = можно поднять 10 реплик без проблем синхронизации.
> 3. **Простота**: нет миграций, нет проблем с consistency.
> 
> Если gateway вдруг понадобится что-то хранить (например, rate-limit counters) — обычно используют **Redis** или **in-memory кеш** (Caffeine), не PostgreSQL.

**В5: Как gateway валидирует JWT-токены?**
> Возможные подходы:
> 
> **A. Самостоятельно (stateless validation)**:
> ```java
> @Component
> public class JwtValidator {
>   public Claims validate(String token) {
>     return Jwts.parserBuilder()
>       .setSigningKey(publicKey)
>       .build()
>       .parseClaimsJws(token)
>       .getBody();
>   }
> }
> ```
> Плюсы: быстро (никаких HTTP-вызовов), масштабируется.
> Минусы: не может отозвать токен до его истечения.
> 
> **B. Через session-service (introspection)**:
> ```java
> @Component
> public class JwtValidator {
>   public ValidationResult validate(String token) {
>     return sessionClient.validateToken(token);
>     // GET http://session-service:8081/api/v1/auth/validate
>   }
> }
> ```
> Плюсы: можно отзывать токены, центральная логика.
> Минусы: дополнительный HTTP-вызов на каждый запрос.
> 
> **C. Гибрид**: валидация JWT локально + чтение черного списка из Redis.
> 
> В нашем проекте, судя по env-переменной SESSION_SERVICE_HOST, используется вариант B.

**В6: Что произойдёт, если gateway-service упадёт?**
> **Полная недоступность бизнес-API!** Все запросы клиентов будут возвращать 502/503/504.
> 
> Это **single point of failure**. Защита:
> 
> 1. **Несколько реплик**: 3-5 подов за Service'ом. Один упал — другие живые.
> 2. **Pod Disruption Budget**: гарантия, что во время maintenance не убьют все реплики разом.
> 3. **Pod Anti-Affinity**: разнести реплики по разным нодам — нода умерла, реплики на других живы.
> 4. **HPA**: автомасштабирование при росте RPS.
> 5. **Liveness/Readiness probes**: автоматический рестарт зависших подов.
> 
> Login User не пострадает — он через session-service (тоже хорошо иметь несколько реплик).

**В7: Почему в env-переменных нет PAYMENT_SERVICE_HOST? Это ошибка?**
> Нет, это **архитектурное решение**! Принцип **least privilege**:
> 
> - Платежи — критическая операция, должна инициироваться только из контролируемого места.
> - Если gateway мог бы вызывать payment напрямую — это была бы дыра: компрометация gateway → возможность списания денег.
> - **booking-service** — единственный, кто инициирует платёж: он понимает контекст (есть бронь? сумма правильная?).
> 
> Постман-тест "Book Hotel" идёт так:
> ```
> Postman → gateway → booking-service → payment-service
> ```
> Никогда не:
> ```
> Postman → gateway → payment-service   ❌ запрещено!
> ```

**В8: Что произойдёт, если изменить ConfigMap (например, поменять имя hotel-service)?**
> Сразу — ничего. gateway-service читает env при старте, один раз. Изменение ConfigMap не повлияет на запущенные поды.
> 
> Чтобы применить изменение:
> ```bash
> kubectl rollout restart deploy/gateway-service
> ```
> Это создаст новый под с обновлённой конфигурацией.
> 
> **Лучшая практика**: автоматический рестарт при изменении ConfigMap. Решения:
> 1. **Stakater/Reloader** — оператор, который слушает изменения ConfigMap/Secret и рестартует Deployment.
> 2. **Helm chart с checksum** — checksum ConfigMap в аннотациях Deployment → меняется → rollout.
> 3. **Spring Cloud Config Server** — приложение слушает изменения само.

**В9: Чем отличается роль gateway в Postman-тестах от роли session?**
> Хороший вопрос на нюанс:
> 
> **session-service** — выдаёт токены:
> ```
> Test 1: Login User
> GET https://session.10.174.8.95.nip.io/api/v1/auth/authorize
> Authorization: Basic VXNlcjpxd2VydHk=   ← Basic Auth (логин:пароль)
> → 200 OK
> ← Authorization: Bearer eyJhbGc...      ← возвращает Bearer-токен
> ```
> 
> **gateway-service** — обрабатывает все остальные запросы с токеном:
> ```
> Test 2-5:
> GET https://gateway.10.174.8.95.nip.io/api/v1/gateway/hotels
> Authorization: Bearer eyJhbGc...        ← использует токен от session
> ```
> 
> Это два разных endpoint'а:
> - session = аутентификация (кто ты?)
> - gateway = авторизация + бизнес-логика (что ты хочешь?)

**В10: Какие resource limits подойдут для gateway-service?**
> Это критичный сервис, ему нужно больше ресурсов:
> ```yaml
> resources:
>   requests:
>     cpu: "200m"      # гарантированные 0.2 CPU
>     memory: "512Mi"
>   limits:
>     cpu: "1000m"     # до 1 CPU при пиках
>     memory: "1Gi"
> ```
> 
> Spring Cloud Gateway — асинхронный, на Netty. Может обрабатывать тысячи RPS на одной реплике. Главное — не упереться в memory из-за GC.

**В11: Можно ли запустить gateway-service на 5 репликах? Нужны ли какие-то изменения?**
> Да, можно! gateway полностью stateless, поэтому масштабирование тривиальное:
> ```bash
> kubectl scale deploy/gateway-service --replicas=5
> ```
> 
> Подводные камни:
> 1. **Connection pool до downstream-сервисов**: 5 реплик × 50 коннектов = 250 коннектов к каждому из 5 сервисов = 1250 коннектов всего. Может упереться в `max_connections` PostgreSQL (но gateway не ходит в БД, ОК).
> 2. **Балансировка**: Service автоматически round-robin между подами.
> 3. **Sticky sessions** не нужны: каждый запрос независим.
> 4. **Rate-limit counters**: если используются — должны быть в Redis (общий), не в памяти.

**В12: Какие cross-cutting concerns gateway должен решать?**
> Типичный список:
> 
> 1. **Authentication / Authorization**: проверка JWT.
> 2. **Rate Limiting**: защита от перегрузки (например, 100 RPS на IP).
> 3. **CORS**: разрешённые origins, headers.
> 4. **Request/Response logging**: для аудита и debug.
> 5. **Metrics**: счётчики запросов, latency по эндпоинтам (Prometheus).
> 6. **Tracing**: distributed tracing (Jaeger, Zipkin) — добавление trace-id.
> 7. **Request validation**: проверка body, headers до отправки в backend.
> 8. **Response transformation**: маскирование чувствительных полей.
> 9. **Caching**: кеширование GET-запросов (например, /hotels на 5 минут).
> 10. **Circuit breaker**: защита от каскадных отказов.
> 11. **Retry logic**: повтор запросов к flaky-сервисам.
> 12. **Compression**: gzip ответов.

**В13: Что если кто-то попробует обратиться напрямую к hotel-service в обход gateway?**
> Снаружи кластера — **невозможно**, hotel-service ClusterIP, не имеет Ingress.
> 
> Изнутри кластера (из другого пода) — **возможно**:
> ```bash
> kubectl run debug --rm -it --image=curlimages/curl -- sh
> curl http://hotel-service:8082/api/v1/hotels
> # → 200 OK с данными отелей (без аутентификации!)
> ```
> 
> Это **дыра безопасности внутри кластера**. Защита:
> 1. **NetworkPolicy**: hotel-service принимает трафик только от gateway:
> ```yaml
> spec:
>   podSelector:
>     matchLabels: { app: hotel-service }
>   ingress:
>     - from:
>         - podSelector:
>             matchLabels: { app: gateway-service }
> ```
> 2. **Service Mesh** (Istio/Linkerd) с mTLS + Authorization Policy.
> 3. **JWT валидация в каждом сервисе** (defence in depth).

