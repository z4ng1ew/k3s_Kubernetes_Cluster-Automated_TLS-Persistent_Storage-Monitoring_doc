apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels: { app: gateway-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway-service }
  template:
    metadata:
      labels: { app: gateway-service }
    spec:
      containers:
        - name: gateway-service
          image: src-gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8087
          env:
            - name: SESSION_SERVICE_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: SESSION_SERVICE_HOST } }
            - name: SESSION_SERVICE_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: SESSION_SERVICE_PORT } }
            - name: HOTEL_SERVICE_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_HOST } }
            - name: HOTEL_SERVICE_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: HOTEL_SERVICE_PORT } }
            - name: BOOKING_SERVICE_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: BOOKING_SERVICE_HOST } }
            - name: BOOKING_SERVICE_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: BOOKING_SERVICE_PORT } }
            - name: LOYALTY_SERVICE_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_HOST } }
            - name: LOYALTY_SERVICE_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: LOYALTY_SERVICE_PORT } }
            - name: REPORT_SERVICE_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: REPORT_SERVICE_HOST } }
            - name: REPORT_SERVICE_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: REPORT_SERVICE_PORT } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels: { app: gateway-service }
spec:
  selector: { app: gateway-service }
  ports:
    - port: 8087
      targetPort: 8087
  type: ClusterIP
