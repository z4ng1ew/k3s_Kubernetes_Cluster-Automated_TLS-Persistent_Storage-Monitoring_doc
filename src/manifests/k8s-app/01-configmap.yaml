## 🗣 Монолог для защиты (~300 символов)

> ConfigMap app-config выносит всю несекретную конфигурацию микросервисов в один объект: адреса PostgreSQL, RabbitMQ и шести Spring Boot сервисов. Сервисы видят друг друга по DNS-именам Service'ов: postgres, rabbitmq, hotel-service и т.д. При смене окружения я меняю только ConfigMap, не пересобирая образы.

*(длина ~320 символов, могу подрезать до ровно 300)*

---

## 💡 Возможные вопросы на защите

**В1: Почему именно ConfigMap, а не Secret? Где грань?**
> ConfigMap — для **несекретных** данных: адреса, порты, имена очередей, флаги. Secret — для **чувствительных**: пароли БД, API-ключи, JWT-секреты. Технически Secret тоже хранит ключ-значение, но в base64 и с RBAC-ограничениями. Логин postgres = ConfigMap, пароль postgres = Secret. У меня в проекте они разделены: app-config (адреса) и app-secrets (пароли).

**В2: Почему порты в кавычках, а хосты — нет?**
> Все значения в `data` ConfigMap должны быть **строками**. Хосты типа `postgres` YAML парсит как строку автоматически. А число `5432` без кавычек YAML интерпретирует как `int`, и k8s валидация выдаст ошибку: "expected string". Кавычки явно говорят YAML-парсеру: "это строка". Альтернатива — использовать `binaryData` (но это уже для бинарников).

**В3: Что произойдёт, если изменить ConfigMap, пока приложение запущено?**
> Зависит от способа подключения:
> 1. **env-переменные** (наш случай) — k8s НЕ перезапускает поды при изменении ConfigMap, переменные читаются один раз при старте. Нужно ручное `kubectl rollout restart deploy/<name>`.
> 2. **Через volume mount** (конфиг как файл) — k8s обновляет содержимое файла в поде через ~60 секунд автоматически. Но приложение должно само следить за изменением файла.
> 
> В моём случае все Spring Boot сервисы читают env-переменные → требуется restart после изменения.

**В4: Зачем нужны DNS-имена сервисов? Почему не использовать IP?**
> IP-адреса подов и Service'ов могут меняться (под перезапустился — новый IP). А DNS-имя Service'а **стабильно**, оно живёт пока существует сам Service. Kubernetes имеет встроенный CoreDNS, который автоматически резолвит:
> - `postgres` → ClusterIP Service'а postgres
> - `postgres.default` → то же самое
> - `postgres.default.svc.cluster.local` → полное FQDN
> 
> Это **service discovery** на уровне платформы, бесплатно.

**В5: Почему gateway-service нет в этом ConfigMap?**
> Сервисы общаются друг с другом **внутри** кластера — им не нужен gateway. Gateway — это **внешняя** точка входа, через него приходят клиенты (Postman, браузер). Внутри кластера booking-service напрямую идёт в hotel-service, минуя gateway. Если добавить GATEWAY_HOST сюда — это просто не используется. Но никто не запрещает добавить для единообразия.

**В6: Что такое exchange и queue в RabbitMQ — зачем разделять?**
> Это принцип publish-subscribe:
> - **Exchange** (точка обмена) — место, куда producer (booking-service) кладёт сообщение. Он НЕ знает, кто и сколько подписчиков.
> - **Queue** (очередь) — буфер, откуда consumer (report-service) читает сообщения.
> - **Binding** — правило: "сообщения из этого exchange кладутся в эту queue".
> 
> Разделение позволяет:
> - Одним exchange кормить несколько queue (fan-out).
> - Маршрутизировать по ключу (topic, routing key).
> - Менять подписчиков без изменения producer'а.

**В7: Можно ли иметь два ConfigMap с одинаковыми ключами?**
> Можно, но при `envFrom` k8s объединит их в одну переменную окружения. Если значения разные — k8s применит **последний** из envFrom-списка. Лучше так не делать — путаница. Для разделения логично использовать разные имена ключей или префиксы (`AUTH_DB_HOST`, `MAIN_DB_HOST`).

**В8: А если поменять `POSTGRES_HOST` на `postgres-primary` — что сломается?**
> Сервисы перестанут находить базу: они будут резолвить `postgres-primary`, но Service такого имени нет → DNS NXDOMAIN → connection refused. Чтобы это работало, надо одновременно переименовать Service в `postgres-primary`. ConfigMap — это лишь "указатель", сам по себе он ничего не создаёт.

**В9: Видны ли значения ConfigMap всем подам в кластере?**
> Только тем, кто:
> 1. Живёт в том же namespace, что и ConfigMap.
> 2. Имеет RBAC-разрешение на чтение (по умолчанию у `default` ServiceAccount разрешено).
> 3. Явно ссылается на ConfigMap через `envFrom`/`env`/`volumes`.
> 
> Сам ConfigMap не "проталкивается" во все поды автоматически — нужно явное подключение в Deployment'е.

