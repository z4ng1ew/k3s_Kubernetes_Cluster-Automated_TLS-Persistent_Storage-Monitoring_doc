# 📝 Построчный разбор ConfigMap для микросервисов

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# ConfigMap = "словарь конфигурации", доступный подам кластера.
# Хранит НЕ-секретные настройки (адреса, порты, имена очередей).
# Главная идея: настройки отдельно от кода. При смене окружения
# (dev/stage/prod) меняем ConfigMap, а образы остаются те же.
# Для секретных данных (пароли, токены) — отдельный объект Secret.
# ============================================================
apiVersion: v1                       # Базовая API-группа (core), версия v1.
                                     # ConfigMap — один из самых старых типов в k8s,
                                     # живёт в core API с самого начала.
kind: ConfigMap                      # Тип ресурса: набор ключ-значение для конфигурации.
metadata:
  name: app-config                   # Имя ConfigMap. По нему ссылаются Deployment'ы.
                                     # kubectl get configmap app-config
                                     # kubectl describe configmap app-config
                                     # ⚠️ namespace не указан → попадёт в "default".
                                     # Если приложение в другом namespace —
                                     # ConfigMap должен быть в том же namespace
                                     # (или придётся копировать/синхронизировать).
data:                                # Сами ключ-значение пары.
                                     # ВСЕ значения должны быть СТРОКАМИ.
                                     # Числа и булевы значения обязательно в кавычках!
                                     # Иначе YAML парсер превратит их в int/bool и k8s
                                     # выдаст ошибку валидации.

  # ----- PostgreSQL -----
  POSTGRES_HOST: postgres            # DNS-имя Service'а PostgreSQL внутри кластера.
                                     # "postgres" резолвится в Service postgres того же namespace.
                                     # Полное имя: postgres.default.svc.cluster.local
  POSTGRES_PORT: "5432"              # Порт PostgreSQL. В кавычках — это СТРОКА.
                                     # Если написать 5432 без кавычек, YAML распарсит как int
                                     # → k8s выдаст ошибку: "expected string, got integer".

  # ----- RabbitMQ (брокер сообщений) -----
  RABBIT_MQ_HOST: rabbitmq           # DNS-имя Service'а RabbitMQ.
                                     # Сервисы общаются через брокер для асинхронных событий.
  RABBIT_MQ_PORT: "5672"             # Стандартный порт AMQP (Advanced Message Queuing Protocol).
                                     # Это "родной" протокол RabbitMQ.
                                     # Отдельно есть 15672 — для web UI Management.
  RABBIT_MQ_QUEUE_NAME: booking_statistics_queue
                                     # Имя очереди, куда booking-service кладёт события
                                     # о новых бронированиях, а report-service их читает.
  RABBIT_MQ_EXCHANGE: booking_statistics_exchange
                                     # Имя exchange (точки обмена).
                                     # В RabbitMQ producer пишет в exchange, exchange по правилам
                                     # routing маршрутизирует в очереди.
                                     # Concept: producer → exchange → queue(s) → consumer

  # ----- Адреса микросервисов внутри кластера -----
  # Каждый сервис = пара HOST + PORT.
  # HOST = имя k8s Service'а (kube-dns его резолвит автоматически).
  # PORT = порт, на котором Service слушает (порт Spring Boot приложения).

  SESSION_SERVICE_HOST: session-service   # Авторизация/Аутентификация пользователей.
  SESSION_SERVICE_PORT: "8081"            # Согласовано с Postman: USERS_PORT=8081.

  HOTEL_SERVICE_HOST: hotel-service       # Управление отелями, поиск, выдача данных.
  HOTEL_SERVICE_PORT: "8082"

  BOOKING_SERVICE_HOST: booking-service   # Бронирование номеров. Ядро бизнес-логики.
  BOOKING_SERVICE_PORT: "8083"            # Шлёт события в RabbitMQ при создании брони.

  PAYMENT_SERVICE_HOST: payment-service   # Оплата броней.
  PAYMENT_SERVICE_PORT: "8084"

  LOYALTY_SERVICE_HOST: loyalty-service   # Программа лояльности (баланс баллов).
  LOYALTY_SERVICE_PORT: "8085"

  REPORT_SERVICE_HOST: report-service     # Сбор статистики, читает из RabbitMQ.
  REPORT_SERVICE_PORT: "8086"             # Подписчик на booking_statistics_queue.
                                          # GATEWAY (8087) намеренно НЕ упомянут здесь —
                                          # это входная точка, его адрес не нужен другим сервисам.
```

