## 🔗 Как ConfigMap "доезжает" до приложения

ConfigMap сам по себе ничего не делает — это просто словарь. Чтобы его данные попали в приложение, Deployment микросервиса должен на него сослаться. Есть два способа:

### Способ 1: каждое значение → отдельная env-переменная

```yaml
# В Deployment'е любого сервиса:
env:
  - name: POSTGRES_HOST
    valueFrom:
      configMapKeyRef:
        name: app-config             # ← имя нашего ConfigMap
        key: POSTGRES_HOST           # ← конкретный ключ
  - name: POSTGRES_PORT
    valueFrom:
      configMapKeyRef:
        name: app-config
        key: POSTGRES_PORT
  # ... и т.д. для каждой переменной
```

### Способ 2: импорт ВСЕХ значений одним блоком (короче и удобнее)

```yaml
# В Deployment'е любого сервиса:
envFrom:
  - configMapRef:
      name: app-config               # ← все ключи станут env-переменными автоматически
```

Затем Spring Boot читает их через `@Value("${POSTGRES_HOST}")` или через `application.yml`:
```yaml
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/booking_db
```

