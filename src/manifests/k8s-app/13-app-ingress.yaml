## 🆚 Сравнение: один Ingress vs два Ingress'а

Альтернативный дизайн — два отдельных Ingress-ресурса:

```yaml
# Вариант B: два Ingress'а
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts: [session.10.174.8.95.nip.io]
      secretName: wildcard-nipio-tls
  rules:
    - host: session.10.174.8.95.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: session-service, port: { number: 8081 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
# ... аналогично для gateway
```

| Аспект | Один Ingress (наш) | Два Ingress'а |
|--------|---------------------|----------------|
| Количество ресурсов | 1 | 2 |
| Управление | Все правила в одном месте | Распределено |
| Команда смотрит логи | Простая фильтрация | Сложнее |
| Удаление одного хоста | Редактируем YAML | Удаляем целый Ingress |
| GitOps-friendly | Меньше файлов | Больше изолированности |

Оба подхода рабочие. Для нашей лабы один Ingress компактнее и читабельнее.

