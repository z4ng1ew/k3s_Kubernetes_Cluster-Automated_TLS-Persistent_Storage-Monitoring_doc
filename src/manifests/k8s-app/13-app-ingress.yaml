## 🗣 Монолог для защиты (~300 символов)

> Этот Ingress — финальная сборка проекта: связывает внешний мир с двумя точками входа приложения. Аннотация cert-manager.io/cluster-issuer запускает автовыпуск TLS-сертификата, ingressClassName: nginx направляет в Nginx-контроллер. Секция tls содержит два хоста (session и gateway), оба покрываются wildcard-сертификатом из Secret wildcard-nipio-tls. Два правила маршрутизируют трафик на разные Service'ы по host-заголовку.

*(длина ~440 символов, могу сократить до 300)*

