## 💡 Возможные вопросы на защите

**В1: Почему два хоста на одном Ingress, а не один хост с разными путями?**
> Это **архитектурное решение под требование задания**. В пункте 5 ТЗ написано: «сгенерировать **wildcard**-сертификат». Wildcard-сертификат (`*.domain`) имеет смысл только если есть несколько поддоменов:
> 
> - **С двумя хостами**: `session.*` и `gateway.*` оба покрываются `*.10.174.8.95.nip.io` — wildcard оправдан.
> - **С одним хостом**: `app.10.174.8.95.nip.io` — wildcard избыточен, можно было выпустить обычный single-domain сертификат.
> 
> Плюс это **архитектурно правильнее**: session и gateway — разные точки входа с разной ответственностью. Логически их разделить через DNS — стандартная практика.

**В2: Что произойдёт, если Secret `wildcard-nipio-tls` не существует?**
> ingress-nginx запустит Ingress, но **без TLS**:
> 1. Логи nginx-controller'а покажут: `Secret default/wildcard-nipio-tls does not exist`.
> 2. HTTPS-запросы будут получать **fake-сертификат** ingress-nginx (cn=ingress.local).
> 3. Браузер покажет "NET::ERR_CERT_AUTHORITY_INVALID".
> 4. HTTP (порт 80) продолжит работать без шифрования.
> 
> Поскольку у нас есть аннотация `cert-manager.io/cluster-issuer`, cert-manager увидит Ingress без Secret и **автоматически создаст** Certificate-ресурс, который выпустит TLS-пару и положит в Secret. Через ~30 секунд HTTPS заработает корректно.

**В3: Зачем аннотация `cert-manager.io/cluster-issuer`, если Certificate уже создан отдельно?**
> Это **дублирующая защита** (defense in depth):
> 
> 1. **Сейчас**: Secret уже создан явным Certificate-ресурсом (wildcard-cert.yaml).
> 2. **Если бы Certificate забыли**: аннотация запустила бы автогенерацию.
> 
> Если оба подхода работают одновременно — никакого конфликта:
> - cert-manager увидит, что Secret уже существует.
> - Сверит cn/dnsNames с тем, что нужно по Ingress.
> - Если совпадает — ничего не делает.
> - Если отличается — попробует обновить.
> 
> Лишним этот approach не назову — больше как страховка.

**В4: Что произойдёт, если убрать `ingressClassName: nginx`?**
> Зависит от того, есть ли в кластере **default IngressClass**:
> 
> 1. **Если есть default IngressClass** (с `is-default-class: "true"`): Ingress обработает контроллер по умолчанию. У нас, скорее всего, это nginx → всё заработает.
> 
> 2. **Если default нет**: Ingress останется без обработчика, никакой контроллер его не подхватит. В `kubectl describe ingress` будет warning: "no IngressClass found".
> 
> Лучшая практика — **всегда указывать ingressClassName явно**. Это:
> - Явная зависимость, видно из манифеста.
> - Защита от смены default'а.
> - Работа в кластере с несколькими контроллерами (nginx + traefik).

**В5: Где терминируется TLS — на Ingress или на gateway?**
> На **Ingress-Nginx**! Это паттерн **TLS termination at the edge**:
> 
> 1. Клиент → HTTPS → Ingress (расшифровывает) → HTTP → внутренние сервисы.
> 2. Внутри кластера трафик идёт **по обычному HTTP**.
> 
> Плюсы:
> - **Производительность**: один раз расшифровать на входе, дальше быстро.
> - **Управление сертификатами централизованно**: cert-manager обновляет → Ingress подхватывает. Сервисы ничего не знают про TLS.
> - **Простота приложения**: gateway, session, hotel и т.д. — обычный HTTP, никакой возни с keystore.
> 
> Минусы:
> - **Внутри кластера трафик в открытом виде**. Если в кластере есть злоумышленник — может перехватить.
> - **Решение**: Service Mesh (Istio, Linkerd) для mTLS между всеми сервисами.

**В6: Что произойдёт, если оба правила имеют одинаковый path "/"?**
> Конфликта нет! Правила в Ingress различаются по **host**:
> - Host `session.*` → правило №1 → session-service.
> - Host `gateway.*` → правило №2 → gateway-service.
> 
> Один path `/` встречается в обоих, но в разных host-блоках. ingress-nginx сначала фильтрует по host (HTTP-заголовок Host), потом по path.
> 
> Конфликт был бы, если бы в одном host-блоке были два правила с одинаковым path — ingress-nginx применит **последнее** (или первое, зависит от реализации). Лучше так не делать.

**В7: Что если http-запрос придёт без указания host (например, прямо на IP)?**
> ingress-nginx применит **default-backend** (404 page). Не найдёт соответствующего правила и вернёт стандартную ошибку:
> ```
> HTTP/1.1 404 Not Found
> Server: nginx
> 
> 404 Not Found
> ```
> 
> Можно настроить **catch-all rule** (правило без host) — оно сработает, если ни один host-rule не подошёл:
> ```yaml
> rules:
>   - http:        # ← без host:
>       paths:
>         - path: /
>           pathType: Prefix
>           backend:
>             service: { name: default-app, port: { number: 80 } }
> ```
> 
> Это полезно для дефолтных страниц или редиректов на основной домен.

**В8: Безопасно ли публиковать session-service отдельным хостом?**
> Это вопрос архитектуры:
> 
> **За (наш вариант)**:
> - Чёткое разделение: один эндпоинт для логина, другой для бизнес-API.
> - Можно применять разные политики: rate limiting на login строже, чтобы избежать brute-force.
> - Можно ограничить доступ к login по IP (например, только корпоративная сеть).
> 
> **Против (gateway-only)**:
> - Меньше attack surface: только один внешний хост.
> - Все запросы проходят через gateway, упрощённый мониторинг.
> - Но: чтобы получить токен, всё равно нужен механизм без аутентификации.
> 
> На практике часто делают **прокси через gateway**: `gateway/api/v1/auth/login` → gateway проксирует на session. Тогда session-service внутренний, как все остальные. Но в нашем учебном проекте session = отдельный entry point для демонстрации wildcard-сертификата.

**В9: Что если у двух хостов будут разные сертификаты?**
> Тогда секция tls будет содержать **два блока**:
> ```yaml
> tls:
>   - hosts: [session.10.174.8.95.nip.io]
>     secretName: session-tls
>   - hosts: [gateway.10.174.8.95.nip.io]
>     secretName: gateway-tls
> ```
> 
> ingress-nginx использует **SNI** (Server Name Indication) — клиент в TLS-handshake передаёт имя хоста, и nginx выбирает соответствующий сертификат.
> 
> В нашем случае один wildcard покрывает оба → один Secret и одна tls-запись. Это проще.

**В10: Как Ingress-Nginx выбирает Backend?**
> Алгоритм такой:
> 
> 1. **Host matching**: ищет правило с подходящим `host:` в Ingress'ах в том же namespace, что и Service.
> 2. **Path matching**: внутри найденного host-блока ищет правило с подходящим path (по pathType).
> 3. **Service lookup**: находит Service по имени в backend.service.name.
> 4. **Endpoint resolution**: получает список endpoint'ов (адресов подов) этого Service.
> 5. **Load balancing**: выбирает один endpoint (по умолчанию round-robin).
> 6. **Proxy**: отправляет запрос на endpoint:targetPort.
> 
> Если на шаге 3 Service не найден — 503 Service Unavailable.
> Если на шаге 4 список endpoint'ов пуст (под не Ready) — 503.

**В11: Что произойдёт при удалении этого Ingress?**
> 1. ingress-nginx перестаёт обрабатывать правила для session.* и gateway.*.
> 2. Запросы извне на эти хосты → 404 Not Found.
> 3. Внутренние Service'ы и Pod'ы продолжают работать, но недоступны снаружи.
> 4. Из других подов в кластере по-прежнему можно ходить: `curl http://gateway-service:8087`.
> 5. Secret wildcard-nipio-tls **остаётся** (не привязан к Ingress напрямую).
> 6. Certificate-ресурс тоже остаётся, продолжит обновляться.

**В12: Можно ли добавить редирект с HTTP на HTTPS?**
> Да, через аннотацию ingress-nginx:
> ```yaml
> annotations:
>   nginx.ingress.kubernetes.io/ssl-redirect: "true"          # default true
>   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"    # даже без tls в spec
> ```
> 
> По умолчанию `ssl-redirect: "true"` для Ingress'ов с tls-секцией. Это значит: запрос на http://session.10.174.8.95.nip.io автоматически вернёт 308 Redirect на https://...
> 
> У нас в Ingress есть tls-секция → редирект уже работает по умолчанию.

**В13: Как добавить rate limiting?**
> Через аннотации ingress-nginx:
> ```yaml
> annotations:
>   nginx.ingress.kubernetes.io/limit-rps: "10"        # 10 requests per second per IP
>   nginx.ingress.kubernetes.io/limit-rpm: "60"        # 60 per minute
>   nginx.ingress.kubernetes.io/limit-connections: "5" # max 5 concurrent
> ```
> 
> Это применяется на уровне ingress-nginx, до того как запрос дойдёт до Spring Boot. Защита от DDoS, brute-force на login и т.д.

**В14: Как мониторить Ingress?**
> ingress-nginx экспортирует Prometheus-метрики из коробки:
> - `nginx_ingress_controller_requests` — счётчик запросов с лейблами (host, status, method).
> - `nginx_ingress_controller_response_duration_seconds` — latency.
> - `nginx_ingress_controller_request_size_bytes` — размер запросов.
> 
> Можно настроить Grafana-дашборд: трафик по хостам, error rate, p95-latency. Это особенно важно для production-наблюдения.

