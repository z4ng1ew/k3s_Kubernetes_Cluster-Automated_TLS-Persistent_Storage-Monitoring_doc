# 📝 Построчный разбор Ingress для двух хостов приложения

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# Ingress = правило маршрутизации HTTPS-трафика снаружи в кластер.
# Этот манифест — "финальная сборка" всего проекта: связывает
# внешний мир, TLS-сертификаты, ingress-nginx-контроллер и
# два внутренних Service'а (session и gateway).
#
# Архитектурное решение: два хоста на одном wildcard-сертификате.
#   session.10.174.8.95.nip.io  → session-service:8081
#   gateway.10.174.8.95.nip.io  → gateway-service:8087
# Это раскрывает смысл wildcard-сертификата *.10.174.8.95.nip.io
# из задания (пункт 5: "сгенерировать wildcard-сертификат").
# ============================================================
apiVersion: networking.k8s.io/v1     # API-группа networking, версия v1 (стабильная с k8s 1.19+).
                                     # Раньше Ingress жил в extensions/v1beta1 — устарело.
kind: Ingress                        # Тип ресурса: правило входящего HTTP/HTTPS трафика.
                                     # ВАЖНО: Ingress — это лишь "конфиг".
                                     # Реальную работу делает ingress-controller (nginx-под).
metadata:
  name: app-ingress                  # Имя ресурса в k8s.
                                     # kubectl get ingress app-ingress
                                     # Под этим именем будет видно в ingress-nginx логах.
  namespace: default                 # Namespace, где живёт Ingress.
                                     # ⚠️ КРИТИЧНО: Ingress видит Service'ы ТОЛЬКО в своём
                                     # namespace! Все наши сервисы (session, gateway,
                                     # hotel, booking, ...) тоже в default — ОК.
                                     # Если бы они были в другом ns — пришлось бы создавать
                                     # либо два Ingress'а (по одному в каждом ns), либо
                                     # ExternalName Service в default, ссылающийся на тот ns.
  annotations:                       # Аннотации = "пометки" для контроллеров.
                                     # Не влияют на сам k8s, но cert-manager и nginx их читают.
    cert-manager.io/cluster-issuer: my-ca-issuer
                                     # МАГИЯ cert-manager:
                                     # "Увидел эту аннотацию → автоматически выпусти TLS-
                                     # сертификат для хостов из секции tls через my-ca-issuer".
                                     #
                                     # Что произойдёт автоматически:
                                     # 1. cert-manager создаст ресурс Certificate
                                     #    с dnsNames = [session.*, gateway.*]
                                     # 2. Сгенерирует приватный ключ.
                                     # 3. Подпишет через my-ca-issuer (наш собственный CA).
                                     # 4. Положит в Secret wildcard-nipio-tls.
                                     # 5. Сам ingress-nginx подхватит Secret и применит.
                                     #
                                     # ⚠️ В нашем случае Secret УЖЕ создан явным
                                     # Certificate-ресурсом (wildcard-cert.yaml).
                                     # Эта аннотация — дублирующая защита: если бы
                                     # Certificate был забыт, cert-manager создал бы его сам.
spec:
  ingressClassName: nginx            # КАКОЙ ingress-controller должен обработать.
                                     # У нас установлен ingress-nginx, его IngressClass = "nginx".
                                     # Альтернатива (устаревшая):
                                     #   annotations:
                                     #     kubernetes.io/ingress.class: nginx
                                     # Преимущество ingressClassName: это полноценное поле
                                     # spec, можно валидировать на API-уровне.
  tls:                               # Секция TLS = "какие хосты обслуживать по HTTPS".
                                     # Если бы убрать всю секцию tls — Ingress работал бы
                                     # только по HTTP (80 порт), без сертификатов.
    - hosts:                         # Список доменов, для которых нужен сертификат.
        - session.10.174.8.95.nip.io # Хост №1. Сертификат должен покрывать этот домен.
                                     # nip.io автоматически резолвит этот поддомен в IP
                                     # 10.174.8.95 (наш master-узел).
        - gateway.10.174.8.95.nip.io # Хост №2. Тоже должен быть в сертификате.
                                     # ⚠️ Оба хоста покрываются одним wildcard-сертификатом
                                     # *.10.174.8.95.nip.io — это и есть смысл wildcard!
      secretName: wildcard-nipio-tls # Имя Secret'а с TLS-парой (cert + key).
                                     # Создан Certificate-ресурсом wildcard-nipio
                                     # в namespace default.
                                     # ingress-nginx прочитает этот Secret и установит
                                     # сертификат для обоих хостов.
                                     # ⚠️ Secret и Ingress ДОЛЖНЫ быть в одном namespace!
                                     # У нас оба в default — OK.
  rules:                             # Правила маршрутизации: какой запрос куда слать.
                                     # Здесь — два независимых правила для двух хостов.

    # ─────────────────────────────────────────────
    # ПРАВИЛО №1: session.10.174.8.95.nip.io
    # Обрабатывает только тест "Login User" из Postman.
    # Цель: получить Bearer-токен через Basic Auth.
    # ─────────────────────────────────────────────
    - host: session.10.174.8.95.nip.io
                                     # Правило срабатывает ТОЛЬКО если в HTTP-заголовке
                                     # Host: session.10.174.8.95.nip.io.
                                     # Это позволяет на ОДНОМ IP крутить много разных
                                     # приложений (virtual hosts, как в Nginx).
      http:
        paths:                       # Список путей в URL и куда их слать.
          - path: /                  # Корневой префикс — ловит все пути этого хоста.
                                     # /api/v1/auth/authorize → попадёт сюда (начинается с /).
            pathType: Prefix         # Тип сопоставления:
                                     # Prefix — совпадение по началу пути.
                                     # "/" совпадает с любым путём (/, /api, /api/v1/auth/...).
                                     # Альтернативы:
                                     #   Exact — точное совпадение (только "/").
                                     #   ImplementationSpecific — на усмотрение контроллера.
            backend:                 # Куда направить трафик (когда host и path совпали).
              service:
                name: session-service# Имя Service'а в этом namespace.
                                     # Это Service из манифеста 05-session-service.yaml.
                port:
                  number: 8081       # Порт Service'а (НЕ пода!).
                                     # Service сам перенаправит на targetPort: 8081 → под.
                                     # Согласовано с containerPort и Postman:
                                     #   USERS_PORT: "8081" (в Postman переменных).

    # ─────────────────────────────────────────────
    # ПРАВИЛО №2: gateway.10.174.8.95.nip.io
    # Обрабатывает все остальные тесты (Get Hotels, Book Hotel и т.д.).
    # Это основная точка входа в систему.
    # ─────────────────────────────────────────────
    - host: gateway.10.174.8.95.nip.io
                                     # Срабатывает на Host: gateway.10.174.8.95.nip.io.
                                     # Ingress-nginx по этому заголовку разделяет
                                     # трафик между двумя правилами.
      http:
        paths:
          - path: /                  # Все пути этого хоста идут в gateway.
                                     # /api/v1/gateway/hotels         → gateway-service
                                     # /api/v1/gateway/hotels/{uid}   → gateway-service
                                     # /api/v1/gateway/booking        → gateway-service
                                     # /api/v1/gateway/loyalty        → gateway-service
                                     # Внутри gateway-service сам решает, в какой
                                     # downstream-сервис (hotel/booking/loyalty/report)
                                     # переслать запрос.
            pathType: Prefix         # Префикс — пускаем всё, что начинается с /.
            backend:
              service:
                name: gateway-service# Имя Service'а — gateway из 11-gateway-service.yaml.
                port:
                  number: 8087       # Порт gateway-service.
                                     # Согласовано с Postman: GATEWAY_PORT: "8087".
                                     # И с containerPort в Deployment'е gateway.
```

