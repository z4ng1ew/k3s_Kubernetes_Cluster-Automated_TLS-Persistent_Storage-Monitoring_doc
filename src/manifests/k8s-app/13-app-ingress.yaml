apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: my-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - session.10.174.8.95.nip.io
        - gateway.10.174.8.95.nip.io
      secretName: wildcard-nipio-tls   
  rules:
    - host: session.10.174.8.95.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session-service
                port:
                  number: 8081
    - host: gateway.10.174.8.95.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8087
