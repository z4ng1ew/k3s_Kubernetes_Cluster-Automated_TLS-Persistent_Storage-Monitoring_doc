apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    type: local
    app: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce          
  persistentVolumeReclaimPolicy: Retain 
  hostPath:
    path: /var/lib/postgres-pv
    type: DirectoryOrCreate  
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-master   
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi





# 📝 Построчный разбор PV + PVC для PostgreSQL

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: PersistentVolume (PV) — "кусок диска" в кластере
# Это РЕСУРС, который существует независимо от подов.
# Поды могут запрашивать его через PVC (см. ниже).
# Без PV данные пода исчезнут при перезапуске — для БД это
# недопустимо, поэтому PostgreSQL ВСЕГДА требует Persistent Volume.
# ============================================================
apiVersion: v1                       # Базовая API-группа (core), версия v1.
                                     # PV — фундаментальный ресурс k8s, всегда в core API.
kind: PersistentVolume               # Тип ресурса: "постоянный том".
                                     # ⚠️ PV — это КЛАСТЕРНЫЙ ресурс (не namespace-зависимый).
                                     # Виден из любого namespace.
metadata:
  name: postgres-pv                  # Имя PV. Уникально на уровне всего кластера.
                                     # PVC будет искать PV не по имени, а по labels + параметрам.
  labels:                            # Метки для группировки и поиска.
    type: local                      # Тип хранилища: локальный (на диске ноды).
                                     # Условная метка для нас — k8s её не интерпретирует.
    app: postgres                    # К какому приложению относится — для удобства.
spec:
  storageClassName: manual           # КЛЮЧЕВОЕ поле. StorageClass = "класс хранилища".
                                     # "manual" — особое значение: означает "ручное управление",
                                     # без автоматического провижионинга (нет provisioner'а).
                                     # PVC должен указать ТОТ ЖЕ storageClassName, чтобы найти PV.
                                     # Альтернативы: "standard", "fast-ssd", "" (без класса).
  capacity:
    storage: 5Gi                     # Размер этого PV. 5 гигабайт.
                                     # PVC может запросить ≤ 5Gi — тогда найдёт этот PV.
                                     # Если PVC попросит больше — PV ему не подойдёт.
                                     # ⚠️ Это просто декларация, фактически диск НЕ выделяется
                                     # сразу — это лишь "обещание".
  accessModes:                       # Режимы доступа: КАК поды могут монтировать том.
    - ReadWriteOnce                  # RWO = "чтение-запись с ОДНОЙ ноды".
                                     # Один или несколько подов на ОДНОЙ ноде могут писать.
                                     # Другие режимы:
                                     #   ReadOnlyMany (ROX) — много нод читают
                                     #   ReadWriteMany (RWX) — много нод читают и пишут
                                     #   ReadWriteOncePod  — один под на весь кластер (k8s 1.22+)
                                     # Для PostgreSQL RWO — стандарт (одна БД = один writer).
  persistentVolumeReclaimPolicy: Retain
                                     # Что делать с данными после удаления PVC.
                                     # Retain — СОХРАНИТЬ том и данные, не трогать.
                                     #   PV переходит в статус "Released" (но не "Available"!),
                                     #   данные на диске остаются. Админ должен очистить вручную.
                                     # Альтернативы:
                                     #   Delete — удалить и PV, и физический том (опасно для БД!)
                                     #   Recycle — устаревший, удалён в k8s 1.15
                                     # ⚠️ Для базы данных ВСЕГДА Retain — защита от случайного
                                     # удаления данных.
  hostPath:                          # Тип хранилища: hostPath = "путь на ноде".
                                     # Том маппится напрямую в директорию на хост-машине.
                                     # ⚠️ Это ПРОСТЕЙШИЙ вариант, подходит для:
                                     #   - learning / lab
                                     #   - single-node кластеров
                                     #   - DaemonSet'ов (логи, метрики)
                                     # Минусы:
                                     #   - Привязка к конкретной ноде (см. nodeAffinity ниже)
                                     #   - Никакой репликации, бэкапов, миграции
                                     # В продакшне используют: NFS, CSI-драйверы (Longhorn,
                                     # Rook-Ceph, AWS EBS, GCP PD), local-path-provisioner.
    path: /var/lib/postgres-pv       # Путь на ноде, где будут лежать файлы PostgreSQL.
                                     # При первом запуске PostgreSQL создаст здесь свою структуру:
                                     #   /var/lib/postgres-pv/data/base/
                                     #   /var/lib/postgres-pv/data/pg_wal/
                                     #   и т.д.
    type: DirectoryOrCreate          # Что делать, если директории нет.
                                     # DirectoryOrCreate — создать с правами 0755, owner root.
                                     # Другие значения:
                                     #   Directory      — требовать, чтобы директория уже была
                                     #   FileOrCreate   — создать пустой файл
                                     #   File           — требовать существующий файл
                                     #   ""             — без проверок (default)
  nodeAffinity:                      # ВАЖНО для hostPath! "На какой ноде должен быть этот PV?"
                                     # Без nodeAffinity под мог бы запуститься на любой ноде,
                                     # но hostPath лежит только на ОДНОЙ конкретной — это бы
                                     # привело к пустой папке и потере данных.
    required:                        # required = "обязательно", не soft preference.
      nodeSelectorTerms:              # Список условий (OR между ними).
        - matchExpressions:           # Внутри одного term — AND.
            - key: kubernetes.io/hostname
                                      # Стандартный label на каждой ноде = её hostname.
                                      # k8s проставляет автоматически.
              operator: In            # Операторы: In, NotIn, Exists, DoesNotExist, Gt, Lt.
              values:
                - k3s-master          # Имя master-ноды k3s.
                                      # ⚠️ Если ноду переименовать или удалить — PV "повиснет"!
                                      # Сменить можно через kubectl edit pv.

---                                   # YAML-разделитель.

# ============================================================
# БЛОК 2: PersistentVolumeClaim (PVC) — "запрос на том"
# Это "заявка" пода: "мне нужен такой-то том".
# k8s ищет подходящий PV и "связывает" PVC с ним (Bound).
# Поды монтируют PVC, а не PV напрямую — это уровень абстракции.
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim          # Тип ресурса: "запрос на постоянный том".
                                     # ⚠️ PVC — это NAMESPACED ресурс! Живёт в namespace.
                                     # Под и PVC должны быть в одном namespace.
metadata:
  name: postgres-pvc                 # Имя PVC. На него ссылается Deployment PostgreSQL:
                                     #   volumes:
                                     #     - name: data
                                     #       persistentVolumeClaim:
                                     #         claimName: postgres-pvc
                                     # ⚠️ namespace не указан → в "default" попадёт.
                                     # PostgreSQL pod должен быть тоже в default.
spec:
  storageClassName: manual           # ДОЛЖНО совпадать с PV! Иначе k8s не сматчит.
                                     # Это первый критерий поиска подходящего PV.
  accessModes:
    - ReadWriteOnce                  # ДОЛЖНО быть совместимо с PV.
                                     # PV даёт RWO — PVC просит RWO ✅.
                                     # Если бы PVC попросил RWX — PV ему не подошёл бы.
  resources:
    requests:
      storage: 5Gi                   # Минимальный размер тома, который нужен.
                                     # k8s найдёт PV с capacity ≥ 5Gi.
                                     # У нас PV ровно 5Gi → совпадение.
                                     # ⚠️ Это запрос, не лимит. Реально диск может быть больше.
```

---

## 🔗 Как PV и PVC "находят" друг друга (механика связывания)

Процесс называется **binding** — k8s автоматически связывает PVC с подходящим PV:

```
        [ kubectl apply -f postgres-pv.yaml ]
                        │
                        ▼
              [ PV postgres-pv создан ]
                Status: Available  ← готов к использованию
                                        │
                                        │ ждёт claim'а
                                        ▼
        [ kubectl apply -f postgres-pvc.yaml ]
                        │
                        ▼
              [ PVC postgres-pvc создан ]
                Status: Pending  ← пока ищется PV
                        │
                        ▼
              ┌──────────────────────────┐
              │ k8s PV Controller        │
              │                          │
              │ Ищет PV по критериям:    │
              │  1. storageClassName     │  ← "manual" == "manual" ✅
              │  2. accessModes          │  ← RWO ⊆ {RWO} ✅
              │  3. capacity ≥ request   │  ← 5Gi ≥ 5Gi ✅
              │  4. nodeAffinity / зоны  │  ← (учитывается при scheduling пода)
              └────────────┬─────────────┘
                           │ нашёл!
                           ▼
                  [ BINDING ]
                  PV.spec.claimRef = postgres-pvc
                  PVC.spec.volumeName = postgres-pv
                           │
                           ▼
            ┌────────────────────────────┐
            │ PV  Status: Bound          │
            │ PVC Status: Bound          │  ← теперь pod может монтировать
            └────────────────────────────┘
                           │
                           ▼
        [ Pod в Deployment ссылается на PVC ]
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: postgres-pvc
                           │
                           ▼
        [ Scheduler смотрит nodeAffinity PV ]
                Под обязан запуститься на k3s-master
                           │
                           ▼
        [ Pod запускается на k3s-master ]
        [ kubelet монтирует /var/lib/postgres-pv в контейнер ]
                /var/lib/postgresql/data → /var/lib/postgres-pv
                           │
                           ▼
            [ PostgreSQL пишет данные в постоянное хранилище ]
            [ При перезапуске пода данные сохраняются на ноде ]
```

---

## 🔄 Что происходит при удалении

Поведение зависит от `persistentVolumeReclaimPolicy`:

```
[ kubectl delete pvc postgres-pvc ]
              │
              ▼
       PV ReclaimPolicy ?
              │
   ┌──────────┴──────────┐
   │                     │
   ▼                     ▼
 Retain                Delete
   │                     │
   ▼                     ▼
 PV в статусе          PV удаляется
 "Released"            И физический том
 Данные на диске       тоже удаляется
 СОХРАНЯЮТСЯ           Данные ПОТЕРЯНЫ
   │                     │
   ▼                     ▼
 Чтобы переиспользовать  Это нормально
 PV — админ должен       для облачных
 вручную очистить         storage (EBS),
 claimRef:               но смертельно
 kubectl edit pv         для БД
```

У нас `Retain` — данные не пропадут даже если PVC случайно удалят. Это правильный выбор для базы данных.

