## 💡 Возможные вопросы на защите

**В1: Зачем нужны PV и PVC, если можно использовать `emptyDir`?**
> `emptyDir` — это **временное** хранилище, привязанное к жизненному циклу **пода**. Перезапустил под → данные исчезли. Для БД это катастрофа: упал PostgreSQL → потеряли всю базу.
> PV/PVC — это **постоянное** хранилище, переживающее перезапуск пода. Это требование задания (пункт 7): «Создать PV для базы данных PostgreSQL».

**В2: В чём смысл двух сущностей — PV и PVC? Не проще ли одной?**
> Это **разделение ответственности**:
> - **PV** — это "ресурс инфраструктуры", создаёт админ кластера. Знает детали: где диск, какой провайдер, какие лимиты.
> - **PVC** — это "запрос приложения", создаёт разработчик. Не знает деталей инфраструктуры, просто говорит: "мне нужно 5 ГБ с RWO".
> 
> Это аналог "claim check" в гостинице: клиент сдаёт пальто (PVC) и получает номерок, не зная где конкретно лежит вещь (PV). Аналогично в k8s: разработчик пишет PVC, не зная конкретного PV.

**В3: Что такое `storageClassName: manual` и зачем оно?**
> StorageClass = "тип хранилища" + правила автоматической выдачи. Например, в облаке есть классы `gp2` (обычный SSD), `io1` (быстрый SSD). При запросе PVC с таким классом — k8s **автоматически** создаст PV.
> "manual" — это специальное значение, означающее: "никакого автопровижионинга, я создал PV сам". Это позволяет нам контролировать всё руками. В k3s по умолчанию есть `local-path` — он бы автоматически создал PV, но мы намеренно сделали ручной, чтобы продемонстрировать работу PV в задании.

**В4: Что такое `hostPath` и почему это плохо в продакшне?**
> `hostPath` маппит директорию хост-ноды в под. Плюсы: просто, быстро, не требует доп. инфраструктуры. Минусы:
> - **Привязка к конкретной ноде** — если под переедет на другую ноду, данных там не будет.
> - **Без репликации** — нода сломалась → данные потеряны.
> - **Без бэкапов** — это просто файлы.
> - **Security** — даёт доступ к файловой системе хоста.
> 
> В продакшне используют: NFS, CSI-драйверы (Longhorn, Rook-Ceph, AWS EBS), local-path-provisioner с топологией.

**В5: Что произойдёт без `nodeAffinity`?**
> Под мог бы запланироваться на любой ноде, но `hostPath /var/lib/postgres-pv` существует только на k3s-master (мы её там создавали). Если под запустится на worker — он попадёт в **пустую папку** или папку с чужими данными → PostgreSQL либо инициализирует пустую БД (потеря данных!), либо откажется запускаться.
> `nodeAffinity` **жёстко привязывает** под к ноде, где реально лежит том.

**В6: Что такое `accessModes` и в чём разница между RWO/ROX/RWX?**
> - **ReadWriteOnce (RWO)** — том можно монтировать как RW с **одной ноды**. Несколько подов на этой ноде могут использовать одновременно.
> - **ReadOnlyMany (ROX)** — много нод могут читать одновременно.
> - **ReadWriteMany (RWX)** — много нод могут писать одновременно (требует NFS/CephFS).
> - **ReadWriteOncePod** — только один под во всём кластере (k8s 1.22+).
> 
> Для PostgreSQL **RWO** — стандарт. Реляционная БД не может иметь несколько writer'ов на одних файлах (порча данных).

**В7: Что такое `Retain` и почему именно он?**
> `persistentVolumeReclaimPolicy: Retain` означает: при удалении PVC — **не удалять** PV и данные. PV переходит в статус "Released", данные остаются на диске. Это **защита от человеческой ошибки**: случайный `kubectl delete pvc` не уничтожит производственную базу.
> Альтернативы:
> - **Delete** — удалить и PV, и физический том. Норма для облачных storage (EBS, GCP PD), смертельно для БД.
> - **Recycle** — устаревший, удалён в k8s 1.15.

**В8: Что произойдёт, если PVC попросит 10Gi, а PV у меня 5Gi?**
> PVC **не сможет связаться** с этим PV. Останется в статусе `Pending`. k8s продолжит искать подходящий PV (или будет ждать, если есть StorageClass с провижионером). Под, ссылающийся на этот PVC, тоже не запустится: статус `Pending` с сообщением "waiting for PVC to bind".

**В9: Можно ли расширить размер PVC после создания?**
> Можно, **если StorageClass поддерживает** `allowVolumeExpansion: true`. У нас storageClass `manual` — никакого provisioner'а нет, расширение делается вручную:
> 1. Увеличить физический том (или создать новый PV побольше).
> 2. `kubectl edit pvc postgres-pvc` → поменять `resources.requests.storage`.
> 3. PostgreSQL под при следующем рестарте увидит новый размер.

**В10: Что произойдёт, если удалить PV, пока его использует под?**
> k8s **не позволит**. PV в статусе `Bound` имеет финализатор `kubernetes.io/pv-protection` — `kubectl delete pv` зависнет в `Terminating`, пока не удалят PVC и под. Это **защита от случайного удаления** действующего хранилища.

**В11: Где физически лежат файлы PostgreSQL после всего этого?**
> На master-ноде в `/var/lib/postgres-pv/`. Внутри будут стандартные файлы PostgreSQL:
> ```
> /var/lib/postgres-pv/
>   ├── base/              ← сами таблицы (по OID БД)
>   ├── pg_wal/            ← WAL-логи
>   ├── pg_xact/           ← статусы транзакций
>   ├── postgresql.conf    ← конфиг
>   ├── pg_hba.conf        ← правила доступа
>   └── PG_VERSION         ← версия БД
> ```
> Можно зайти на ноду и посмотреть: `multipass exec k3s-master -- sudo ls -la /var/lib/postgres-pv`.

Если по какой-то строке хочется глубже — спрашивай 🚀