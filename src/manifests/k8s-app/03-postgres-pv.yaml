## 🗣 Монолог для защиты (~300 символов)

> Для хранения данных PostgreSQL я создал PersistentVolume на 5 ГБ типа hostPath с привязкой к master-ноде через nodeAffinity. Политика Retain защищает от потери данных при удалении PVC. PersistentVolumeClaim с тем же storageClassName=manual и размером запрашивает этот том — k8s автоматически связывает их. Deployment PostgreSQL монтирует PVC как volume.

*(длина ~360 символов, могу сократить до 300)*

