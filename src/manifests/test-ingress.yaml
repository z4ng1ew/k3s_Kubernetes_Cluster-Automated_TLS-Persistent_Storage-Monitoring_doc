## 💡 Возможные вопросы на защите

**В1: Что такое nip.io и зачем он нужен?**
> nip.io — публичный DNS-сервис, который автоматически резолвит любой IP, "зашитый" в имя поддомена. `hello.10.174.8.95.nip.io` → `10.174.8.95`. Это бесплатное решение, чтобы получить доменное имя для локального кластера без регистрации настоящего домена. Очень удобно для разработки и тестов.

**В2: Чем `ingressClassName` отличается от старой аннотации `kubernetes.io/ingress.class`?**
> Это эволюция: с k8s 1.18+ ingressClass стал полноценным ресурсом, а `ingressClassName` — стандартным полем в spec Ingress. Старая аннотация всё ещё работает для совместимости, но deprecated. Преимущество нового подхода — есть отдельный ресурс IngressClass, где можно настраивать параметры контроллера.

**В3: Что делает cert-manager при появлении Ingress с этой аннотацией?**
> Контроллер cert-manager отслеживает Ingress'ы. Увидев аннотацию `cert-manager.io/cluster-issuer`, он автоматически:
> 1. Создаёт ресурс `Certificate` с теми же hosts, что в секции `tls`.
> 2. Генерирует приватный ключ.
> 3. Отправляет CSR (запрос на подпись) указанному Issuer'у (у нас — `my-ca-issuer`).
> 4. Сохраняет полученный сертификат + ключ в Secret с именем из `secretName`.
> 5. Следит за сроком и перевыпускает за `renewBefore` до истечения.

**В4: Где терминируется TLS — в Ingress или в приложении?**
> В **Ingress-контроллере** (nginx). Это удобно: само приложение работает по простому HTTP, не зная о шифровании. Контроллер расшифровывает входящий HTTPS и пересылает на Service уже как обычный HTTP. Этот паттерн называется "TLS termination at the edge".

**В5: Что если убрать `host: hello.10.174.8.95.nip.io`?**
> Тогда правило сработает для любого Host-заголовка (catch-all). Это удобно для дефолтных правил, но в нашем случае мы хотим именно конкретный хост, чтобы:
> 1. Сертификат был выпущен на этот домен.
> 2. На одном IP мог жить несколько разных приложений с разными хостами.

**В6: В чём разница между `pathType: Prefix` и `pathType: Exact`?**
> - **Prefix** — совпадение по началу пути. `path: /api` совпадёт с `/api`, `/api/foo`, `/api/v1/users`.
> - **Exact** — точное совпадение. `path: /api` совпадёт **только** с `/api`, а `/api/foo` — уже нет.
> 
> Prefix используется в 95% случаев, потому что обычно мы хотим "всё под этим путём".

**В7: Что если на одном Ingress несколько правил?**
> Совершенно нормально. Ingress поддерживает:
> - Несколько `rules` (разные хосты или пути → разные сервисы).
> - Несколько `tls` (разные хосты → разные сертификаты).
> 
> Это позволяет в одном Ingress описать всю маршрутизацию приложения.

**В8: Что произойдёт, если Service `hello-nginx` не существует?**
> Ingress-контроллер не сможет проксировать трафик и вернёт `503 Service Unavailable`. Сам Ingress-ресурс при этом успешно создастся (k8s не валидирует связи), но в `kubectl describe ingress` будут warning-сообщения.

