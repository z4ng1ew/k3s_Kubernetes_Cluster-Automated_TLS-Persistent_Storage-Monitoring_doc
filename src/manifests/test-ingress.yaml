## 🗣 Монолог для защиты (~300 символов)

> Этот Ingress открывает доступ к hello-nginx по HTTPS снаружи кластера. Аннотация cert-manager.io/cluster-issuer запускает автоматический выпуск TLS-сертификата через мой собственный CA, ingressClassName: nginx направляет правило в Nginx-контроллер, а правило с host и path маршрутизирует трафик на Service hello-nginx по 80 порту.

*(длина ~330 символов, при необходимости подрежу до ровно 300)*

