apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: my-ca-issuer
spec:
  ingressClassName: nginx              
  tls:
  - hosts:
    - hello.10.174.8.95.nip.io
    secretName: wildcard-nipio-tls     
  rules:
  - host: hello.10.174.8.95.nip.io     
    http:
      paths:
      - path: /
        pathType: Prefix                
        backend:
          service:
            name: hello-nginx           
            port:
              number: 80












# 📝 Построчный разбор Ingress для hello-nginx

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# Ingress = "правило маршрутизации HTTP/HTTPS снаружи в кластер"
# Это НЕ серверная программа сама по себе! Это лишь "конфиг",
# который читает реальный контроллер (у нас — ingress-nginx).
# Контроллер на основе этих правил настраивает Nginx внутри пода.
# ============================================================
apiVersion: networking.k8s.io/v1     # API-группа networking, версия v1 (стабильная с k8s 1.19+).
                                     # Раньше Ingress жил в extensions/v1beta1 — это устарело.
kind: Ingress                        # Тип ресурса: правило входа для HTTP/HTTPS трафика.
metadata:
  name: hello-ingress                # Имя ресурса в k8s.
                                     # kubectl get ingress hello-ingress
  namespace: default                 # Namespace, где живёт Ingress.
                                     # ВАЖНО: Ingress видит Service'ы только в своём namespace!
                                     # У нас hello-nginx тоже в default — всё ОК.
  annotations:                       # Аннотации = "пометки" для контроллеров и других тулов.
                                     # Не влияют на сам k8s, но cert-manager и ingress-nginx
                                     # их читают и используют.
    cert-manager.io/cluster-issuer: my-ca-issuer
                                     # Магия cert-manager:
                                     # "Увидел эту аннотацию → автоматически выпусти TLS-сертификат
                                     #  для хостов из секции tls, через указанный ClusterIssuer".
                                     # my-ca-issuer — наш собственный CA (из предыдущего манифеста).
                                     # cert-manager сам:
                                     #   1) создаст ресурс Certificate,
                                     #   2) сгенерирует приватный ключ,
                                     #   3) подпишет его через my-ca-issuer,
                                     #   4) положит в Secret с именем wildcard-nipio-tls (см. ниже).
spec:
  ingressClassName: nginx            # Указываем, КАКОЙ Ingress-контроллер должен обработать
                                     # это правило. В кластере может быть несколько контроллеров
                                     # (например, nginx + traefik одновременно).
                                     # У нас стоит ingress-nginx, его IngressClass = "nginx".
                                     # Это явная замена устаревшей аннотации:
                                     #   kubernetes.io/ingress.class: nginx
  tls:                               # Секция TLS = "какие хосты обслуживать по HTTPS".
                                     # Если её убрать — Ingress будет работать только по HTTP.
  - hosts:                           # Список доменов, для которых нужен сертификат.
    - hello.10.174.8.95.nip.io       # Используем nip.io — "магический" DNS:
                                     # hello.10.174.8.95.nip.io резолвится в 10.174.8.95.
                                     # Это IP нашего master-узла k3s, не нужна регистрация домена.
                                     # На этот хост cert-manager выпустит сертификат.
    secretName: wildcard-nipio-tls   # В этот Secret будет положен сертификат + ключ:
                                     #   tls.crt + tls.key
                                     # ingress-nginx подхватит его и будет терминировать TLS,
                                     # то есть расшифровывать HTTPS-трафик на входе в кластер.
                                     # Если Secret'а нет — cert-manager его создаст автоматически
                                     # (благодаря аннотации сверху).
  rules:                             # Сами правила маршрутизации: "куда какой трафик слать".
  - host: hello.10.174.8.95.nip.io   # Правило срабатывает только если в HTTP-заголовке
                                     # Host: hello.10.174.8.95.nip.io.
                                     # Это позволяет на ОДНОМ IP крутить много разных сайтов
                                     # (виртуальные хосты, как в Nginx).
    http:
      paths:                         # Список путей в URL и куда их слать.
      - path: /                      # Префикс пути. "/" = "всё что угодно".
        pathType: Prefix             # Тип сопоставления:
                                     #   Prefix — совпадение по началу пути (/ → / , /foo, /a/b)
                                     #   Exact — точное совпадение (только "/")
                                     #   ImplementationSpecific — на усмотрение контроллера
                                     # Prefix — самый практичный вариант для большинства случаев.
        backend:                     # Куда направить трафик (когда host и path совпали).
          service:
            name: hello-nginx        # Имя Service'а в этом же namespace.
                                     # Это тот самый Service из предыдущего манифеста.
            port:
              number: 80             # Порт Service'а (не пода!). Service сам перенаправит
                                     # на targetPort: 80, а оттуда — в один из 2 подов.
```

---

## 🔗 Полная схема прохождения запроса

```
                 [ Браузер / Postman / curl ]
                            │
                            │ HTTPS-запрос:
                            │ GET https://hello.10.174.8.95.nip.io/
                            ▼
                  [ DNS: nip.io ]
                            │ резолвит → 10.174.8.95
                            ▼
              [ master-узел k3s, порт 443 ]
                            │
                            ▼
       ┌────────────────────────────────────┐
       │  Ingress-Controller (nginx)        │  ← под из namespace ingress-nginx
       │                                    │
       │  1. Терминирует TLS                │  ← использует cert из wildcard-nipio-tls
       │     (расшифровывает HTTPS → HTTP)  │
       │                                    │
       │  2. Смотрит Host: hello....nip.io  │
       │     → находит наше правило         │
       │                                    │
       │  3. Смотрит path: /                │
       │     → бэкенд = service hello-nginx │
       └────────────────┬───────────────────┘
                        │ HTTP, порт 80
                        ▼
              ┌─────────────────────┐
              │ Service hello-nginx │
              │ (ClusterIP)         │
              └──────────┬──────────┘
                         │ балансирует
              ┌──────────┴──────────┐
              ▼                     ▼
          [ Pod-1 ]             [ Pod-2 ]
          nginxdemos            nginxdemos
                         │
                         │ ответ идёт обратно по той же цепочке
                         ▼
              [ Браузер показывает ответ ]
```

**Параллельно работает cert-manager:**

```
   [ Ingress c аннотацией cert-manager.io/cluster-issuer ]
                          │
                          │ cert-manager "видит" аннотацию
                          ▼
              [ Создаёт ресурс Certificate ]
                          │
                          │ просит my-ca-issuer подписать
                          ▼
                  [ my-ca-issuer ]
                          │ использует Root CA
                          ▼
              [ Готовый сертификат + ключ ]
                          │
                          ▼
        [ Secret: wildcard-nipio-tls ] ← ingress-nginx подхватывает
```

