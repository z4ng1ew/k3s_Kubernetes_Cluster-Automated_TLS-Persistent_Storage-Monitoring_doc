apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: my-ca-issuer
spec:
  ingressClassName: nginx              
  tls:
  - hosts:
    - hello.10.174.8.95.nip.io
    secretName: wildcard-nipio-tls     
  rules:
  - host: hello.10.174.8.95.nip.io     
    http:
      paths:
      - path: /
        pathType: Prefix                
        backend:
          service:
            name: hello-nginx           
            port:
              number: 80