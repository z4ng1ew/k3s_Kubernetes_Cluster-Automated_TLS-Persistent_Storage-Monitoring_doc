# 📝 Построчный разбор манифеста cert-manager

## 🔍 Полный комментарий по каждой строке

```yaml
# ===========================================
# БЛОК 1: Bootstrap-Issuer (самоподписывающий)
# Нужен ТОЛЬКО для того, чтобы выпустить наш будущий Root CA.
# Это "курица, которая снесёт яйцо" — одноразовая вспомогательная сущность.
# ===========================================
apiVersion: cert-manager.io/v1        # API-группа cert-manager, версия v1 (стабильная)
kind: ClusterIssuer                   # ClusterIssuer = "выдаватель сертификатов" уровня ВСЕГО КЛАСТЕРА
                                      # (в отличие от Issuer, который живёт только в одном namespace)
metadata:
  name: selfsigned-bootstrap          # Имя ресурса — на него будем ссылаться ниже
spec:
  selfSigned: {}                      # Тип эмитента: самоподписанный.
                                      # Это значит: "подписывай сам себя, никаких внешних центров".
                                      # Пустые {} = настроек не требуется.

---                                   # YAML-разделитель: дальше идёт следующий ресурс

# ===========================================
# БЛОК 2: Сам Root CA — корневой сертификат
# Это наш собственный "удостоверяющий центр". Из него вырастут все
# конечные сертификаты приложения (wildcard на *.myproject.local и т.д.).
# ===========================================
apiVersion: cert-manager.io/v1
kind: Certificate                     # Ресурс типа Certificate = запрос на выпуск сертификата
metadata:
  name: my-root-ca                    # Имя ресурса в Kubernetes
  namespace: cert-manager             # Кладём в namespace cert-manager — там живёт сам контроллер,
                                      # удобно держать "служебные" сертификаты рядом с ним
spec:
  isCA: true                          # КЛЮЧЕВОЙ флаг! true = это CA-сертификат (может подписывать другие).
                                      # Без него получится обычный "листовой" сертификат, которым ничего не подпишешь.
  commonName: my-root-ca              # CN (Common Name) — человекочитаемое имя CA.
                                      # Будет видно в браузере как "Issued by: my-root-ca"
  secretName: my-root-ca-secret       # В этот k8s Secret cert-manager положит выпущенные:
                                      # - tls.crt (сам сертификат)
                                      # - tls.key (приватный ключ — ВАЖНЫЙ! им подписываются дочерние)
                                      # - ca.crt  (копия сертификата CA)
  duration: 87600h                    # Срок действия: 87600 часов = 10 лет.
                                      # Для root CA норм — он редко перевыпускается.
  renewBefore: 720h                   # За сколько до истечения cert-manager начнёт обновление.
                                      # 720h = 30 дней. Запас по перевыпуску.
  privateKey:
    algorithm: ECDSA                  # Алгоритм ключа: ECDSA (эллиптические кривые).
                                      # Современный, быстрый, короче чем RSA при том же уровне защиты.
                                      # Альтернатива: RSA (тогда size: 2048 или 4096).
    size: 256                         # Размер ключа: 256 бит для ECDSA = кривая P-256.
                                      # Это эквивалент ~3072-битного RSA по стойкости.
  issuerRef:                          # Ссылка на ТОТ САМЫЙ bootstrap-issuer из блока 1.
    name: selfsigned-bootstrap        # Имя из блока 1 — он подпишет наш Root CA.
    kind: ClusterIssuer               # Уточняем тип, потому что бывает и Issuer, и ClusterIssuer.

---

# ===========================================
# БЛОК 3: Настоящий рабочий Issuer (CA-Issuer)
# Это уже "наш" удостоверяющий центр, который будет выпускать
# конечные сертификаты для приложений (session.*, gateway.* и т.д.).
# Использует ключ Root CA, выпущенный в блоке 2.
# ===========================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer                   # Снова ClusterIssuer — доступен из любого namespace
metadata:
  name: my-ca-issuer                  # Имя — будем указывать его в annotation у Ingress / Certificate
spec:
  ca:                                 # Тип эмитента: CA (центр сертификации).
                                      # Подписывает дочерние сертификаты приватным ключом из секрета.
    secretName: my-root-ca-secret     # Имя того Secret'а, куда блок 2 положил ключ + сертификат.
                                      # ВАЖНО: этот секрет должен лежать в том же namespace, что и cert-manager.
```

---

## 🔗 Как это всё работает в связке (мысленная схема)

```
           [selfsigned-bootstrap]      ← (1) выдаёт сам себя
                    │
                    │ подписывает
                    ▼
           [Certificate: my-root-ca]   ← (2) корневой CA
                    │
                    │ хранится в Secret: my-root-ca-secret
                    ▼
           [my-ca-issuer]              ← (3) теперь умеет подписывать
                    │
                    │ выдаёт wildcard-сертификаты
                    ▼
        *.session.local, *.gateway.local, и т.д.
```

**Логика:**
1. Создаём «волшебный» issuer, который умеет подписывать что угодно (включая сам себя).
2. С его помощью выпускаем наш собственный Root CA (это «директор завода сертификатов»).
3. Создаём ещё один issuer, который **использует наш Root CA** для подписи всех дальнейших сертификатов приложения.

После этого Ingress сможет ссылаться на `my-ca-issuer` и получать TLS-сертификаты для своих доменов.

---

## 🗣 Монолог для защиты проекта (~300 символов)

> Для генерации wildcard-сертификата я развернул собственный CA через cert-manager: сначала самоподписанный bootstrap-issuer выпускает корневой Root CA (ECDSA P-256, 10 лет), затем CA-issuer подписывает им конечные сертификаты для всех поддоменов приложения. Это полный аналог Let's Encrypt, но локально и без зависимости от интернета.

(символов: ~340, можно при желании сократить — скажи, и подрежу под точные 300)

