## 💡 Маленькая подсказка для защиты

Если спросят: **«А зачем два ClusterIssuer? Почему нельзя одним обойтись?»**

Ответ:
> Первый (`selfsigned-bootstrap`) умеет только подписывать «что-то одно сам собой» — он временный, нужен только для рождения Root CA. Второй (`my-ca-issuer`) — это уже полноценный центр сертификации на базе Root CA, он будет подписывать **много** дочерних сертификатов с правильной цепочкой доверия. Эта двухступенчатая схема — стандартная PKI-практика.

