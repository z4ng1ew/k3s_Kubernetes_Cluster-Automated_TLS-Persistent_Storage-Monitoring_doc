
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-root-ca
  namespace: cert-manager
spec:
  isCA: true                    
  commonName: my-root-ca        
  secretName: my-root-ca-secret 
  duration: 87600h             
  renewBefore: 720h             
  privateKey:
    algorithm: ECDSA            
    size: 256                   
  issuerRef:
    name: selfsigned-bootstrap 
    kind: ClusterIssuer

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: my-ca-issuer
spec:
  ca:
    secretName: my-root-ca-secret  