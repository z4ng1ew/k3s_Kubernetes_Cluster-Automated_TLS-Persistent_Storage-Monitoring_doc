## 🔗 Полный цикл выпуска сертификата

```
       [ kubectl apply -f wildcard-cert.yaml ]
                       │
                       ▼
          [ Создан Certificate wildcard-nipio ]
                       │
                       │ cert-manager controller замечает
                       ▼
          ┌────────────────────────────┐
          │ cert-manager controller    │
          │ 1. Генерирует RSA-2048 ключ│
          │ 2. Создаёт CSR             │
          │    (запрос на подпись)     │
          │    с SAN:                  │
          │     - 10.174.8.95.nip.io   │
          │     - *.10.174.8.95.nip.io │
          └─────────────┬──────────────┘
                        │ запрос на подпись
                        ▼
          ┌─────────────────────────────┐
          │ ClusterIssuer: my-ca-issuer │
          │ (наш собственный CA)        │
          │                             │
          │ Достаёт приватный ключ из   │
          │ Secret: my-root-ca-secret   │
          │ Подписывает CSR этим ключом │
          └─────────────┬───────────────┘
                        │ подписанный сертификат
                        ▼
          ┌─────────────────────────────┐
          │ Secret: wildcard-nipio-tls  │   ← создан в default namespace
          │  - tls.crt (сертификат)     │
          │  - tls.key (приватный ключ) │
          │  - ca.crt  (Root CA)        │
          └─────────────┬───────────────┘
                        │
                        ▼
          [ Любой Ingress в default          ]
          [ может сослаться на этот Secret   ]
          [ в spec.tls[].secretName          ]
                        │
                        ▼
          [ HTTPS работает для:              ]
          [   *.10.174.8.95.nip.io           ]
          [   10.174.8.95.nip.io             ]
```

**Периодическое обновление (за 30 дней до истечения):**
```
[ За 720h до истечения cert-manager: ]
      │
      ▼
[ Генерирует новый ключ → CSR → подпись → обновляет Secret ]
      │
      ▼
[ Ingress-Nginx автоматически перечитывает Secret и подхватывает новый cert ]
```

