## 💡 Возможные вопросы на защите

**В1: Что такое wildcard-сертификат и зачем он нужен?**
> Wildcard — это сертификат с маской `*.domain`, покрывающий все поддомены первого уровня одного домена. Вместо выпуска отдельного сертификата на `session.domain`, `gateway.domain`, `app.domain` и т.д. — мы получаем один универсальный. Это упрощает управление, особенно когда сервисов много. Именно это требование пункта 5 в задании DO11.

**В2: Почему wildcard покрывает только один уровень поддоменов?**
> Это ограничение RFC 6125 и X.509. Звёздочка работает строго как **одна метка** в DNS-имени:
> - `*.example.com` ✅ покрывает `a.example.com`, но ❌ НЕ `a.b.example.com`.
> Для глубоких поддоменов нужен либо отдельный wildcard `*.b.example.com`, либо отдельные сертификаты на каждый.

**В3: Чем `dnsNames` отличается от `commonName`?**
> Раньше использовали `commonName` (CN) — это одно "главное" имя. Современные браузеры (Chrome с 2017 года) **игнорируют CN** и смотрят только в `Subject Alternative Names` (SAN) — список доменов в `dnsNames`. Поэтому в современных сертификатах CN либо вообще не указывают, либо дублируют первое имя из SAN. У нас правильно — используем только `dnsNames`.

**В4: Почему алгоритм RSA, а не ECDSA?**
> RSA-2048 — универсальная классика, понимают **все** клиенты, включая старые. ECDSA быстрее и компактнее, но некоторые старые клиенты (Java < 8, старые мобильные ОС) могут с ним не работать. Для лабораторной задачи и совместимости с Postman/curl/браузерами выбран RSA. В реальном проекте сейчас всё чаще используют ECDSA.

**В5: Что произойдёт за 30 дней до истечения сертификата?**
> Поле `renewBefore: 720h` указывает cert-manager автоматически перевыпустить сертификат. Контроллер:
> 1. Сгенерирует новый приватный ключ.
> 2. Создаст новый CSR.
> 3. Подпишет его у `my-ca-issuer`.
> 4. **Перезапишет** существующий Secret новыми данными.
> 
> Ingress-Nginx автоматически подхватит обновлённый Secret без перезапуска. Это полностью автоматизированный процесс.

**В6: Где конкретно создаётся Secret и почему важен namespace?**
> Secret создаётся в том же namespace, что и Certificate — у нас это `default`. Это означает: только Ingress-ресурсы в `default` могут на него ссылаться. Kubernetes Secret'ы привязаны к namespace, между namespace'ами они не "шарятся" автоматически. Если нужен тот же сертификат в другом namespace — придётся либо копировать Secret, либо использовать инструмент типа `reflector` для автоматической синхронизации.

**В7: Можно ли использовать этот Certificate без Ingress?**
> Да! Secret с TLS-парой можно использовать в любом приложении:
> - монтировать в под через `volumes.secret` и подключать в Nginx/Apache внутри пода;
> - использовать в gRPC-сервисах;
> - в любом TCP-сервере, который поддерживает TLS.
> 
> Ingress — самый частый, но не единственный потребитель.

**В8: Зачем в `metadata` указан `namespace: default`, если CA находится в `cert-manager`?**
> Это разделение по ролям:
> - **Issuer/CA** живёт в системном namespace `cert-manager` — он общий ресурс для всего кластера (ClusterIssuer вообще не привязан к namespace).
> - **Certificate** и его **Secret** живут в namespace приложения (`default`) — там, где они нужны.
> 
> ClusterIssuer как раз создан, чтобы любой namespace мог им пользоваться.

**В9: Что в Secret лежит и в каком формате?**
> Стандартный k8s Secret типа `kubernetes.io/tls` содержит:
> - `tls.crt` — сертификат в формате PEM (с цепочкой)
> - `tls.key` — приватный ключ в формате PEM
> - `ca.crt` — корневой CA (PEM)
> 
> Содержимое в Secret хранится в base64. Посмотреть можно так:
> ```bash
> kubectl get secret wildcard-nipio-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -text -noout
> ```

Если по какой-то строке нужно глубже — спрашивай 🚀