apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-nipio
  namespace: default
spec:
  secretName: wildcard-nipio-tls   
  duration: 8760h                 
  renewBefore: 720h               
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - "10.174.8.95.nip.io"         
    - "*.10.174.8.95.nip.io"       
  issuerRef:
    name: my-ca-issuer             
    kind: ClusterIssuer












# 📝 Построчный разбор Wildcard-сертификата для домена nip.io

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# Certificate = запрос на выпуск TLS-сертификата.
# Это НЕ сам сертификат, а "заявка": cert-manager увидит её,
# обратится к указанному Issuer'у, получит подпись и положит
# результат в Secret. Дальше любой Ingress может использовать
# этот Secret для HTTPS.
# ============================================================
apiVersion: cert-manager.io/v1       # API-группа cert-manager, версия v1 (стабильная).
                                     # Здесь живут: Certificate, Issuer, ClusterIssuer,
                                     # CertificateRequest, Order, Challenge.
kind: Certificate                    # Тип ресурса: "запрос на TLS-сертификат".
metadata:
  name: wildcard-nipio               # Имя ресурса в k8s. kubectl get certificate wildcard-nipio.
                                     # Это имя используется только для удобства управления.
  namespace: default                 # Namespace, где создаётся Certificate И ГДЕ БУДЕТ Secret.
                                     # ВАЖНО: Secret будет лежать в этом же namespace.
                                     # Ingress, который захочет использовать этот сертификат,
                                     # тоже должен быть в default!
spec:
  secretName: wildcard-nipio-tls     # Имя k8s Secret'а, куда cert-manager положит результат:
                                     #   tls.crt  — сам сертификат (открытая часть)
                                     #   tls.key  — приватный ключ
                                     #   ca.crt   — цепочка доверия (наш Root CA)
                                     # Именно это имя указывают в Ingress.spec.tls[].secretName.
  duration: 8760h                    # Срок действия сертификата.
                                     # 8760 часов = 365 дней = 1 год.
                                     # Для конечных (листовых) сертификатов 1 год — стандарт.
                                     # Root CA обычно живёт 10 лет, листовые — 90 дней - 1 год.
  renewBefore: 720h                  # За сколько до истечения cert-manager начнёт обновление.
                                     # 720 часов = 30 дней.
                                     # Если до конца сертификата осталось < 30 дней —
                                     # cert-manager автоматически выпустит новый.
                                     # Это полностью автоматический процесс, без участия человека.
  privateKey:
    algorithm: RSA                   # Алгоритм генерации приватного ключа.
                                     # RSA — классика, поддерживается ВЕЗДЕ (даже старыми
                                     # клиентами/браузерами).
                                     # Альтернатива: ECDSA (быстрее, меньший размер, но
                                     # старые клиенты могут не понимать).
    size: 2048                       # Размер ключа в битах.
                                     # 2048 — текущий стандарт безопасности для RSA.
                                     # 4096 — параноидальный уровень, но медленнее.
                                     # 1024 — устарел, использовать НЕЛЬЗЯ.
  dnsNames:                          # Список доменных имён, на которые выпускается сертификат.
                                     # Это поле Subject Alternative Names (SAN) в сертификате.
    - "10.174.8.95.nip.io"           # Корневой домен — наш IP через nip.io.
                                     # Чтобы можно было обращаться без поддомена.
    - "*.10.174.8.95.nip.io"         # WILDCARD! Звёздочка покрывает ЛЮБОЙ поддомен первого уровня:
                                     #   hello.10.174.8.95.nip.io  ✅
                                     #   app.10.174.8.95.nip.io    ✅
                                     #   session.10.174.8.95.nip.io ✅
                                     # НО: foo.bar.10.174.8.95.nip.io — НЕ покроет!
                                     # (звёздочка работает только на ОДИН уровень)
                                     # Именно это требует задание DO11: "wildcard-сертификат".
  issuerRef:                         # Ссылка на эмитента — КТО подпишет сертификат.
    name: my-ca-issuer               # Наш собственный CA, созданный в первом манифесте.
                                     # Он использует Root CA и подписывает дочерние сертификаты.
    kind: ClusterIssuer              # Тип эмитента: ClusterIssuer (доступен из любого namespace).
                                     # Альтернатива: Issuer (только в текущем namespace).
                                     # ClusterIssuer удобнее, если сертификаты нужны во многих ns.
```

