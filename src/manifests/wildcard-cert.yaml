## 🗣 Монолог для защиты (~300 символов)

> Этот ресурс Certificate просит cert-manager выпустить wildcard TLS-сертификат на год для домена nip.io. Поле dnsNames с маской *.10.174.8.95.nip.io покрывает все поддомены первого уровня, а issuerRef ссылается на мой собственный CA. Результат сохраняется в Secret wildcard-nipio-tls, который будут использовать все Ingress-ресурсы.

*(длина ~330 символов, при необходимости подрежу до ровно 300)*

