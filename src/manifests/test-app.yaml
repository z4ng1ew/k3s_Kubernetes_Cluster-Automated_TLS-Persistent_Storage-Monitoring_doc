apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: default
spec:
  replicas: 2                       
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello:plain-text  
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: default
spec:
  selector:
    app: hello-nginx
  ports:
  - port: 80
    targetPort: 80












  # 📝 Построчный разбор: Deployment + Service для hello-nginx

## 🔍 Полный комментарий по каждой строке

```yaml
# ============================================================
# БЛОК 1: Deployment — контроллер, который держит N копий пода
# Это "менеджер": создаёт поды, следит за их числом,
# перезапускает упавшие, обновляет версии без простоя.
# ============================================================
apiVersion: apps/v1                  # API-группа "apps", версия v1 (стабильная).
                                     # В ней живут Deployment, StatefulSet, DaemonSet, ReplicaSet.
kind: Deployment                     # Тип ресурса: Deployment = "управляемый набор реплик пода".
metadata:
  name: hello-nginx                  # Имя Deployment'а. По нему обращаемся:
                                     # kubectl get deploy hello-nginx
  namespace: default                 # Namespace = "логический раздел" кластера.
                                     # default — общая песочница, используем для простоты.
spec:                                # spec = "желаемое состояние" (то, к чему k8s стремится).
  replicas: 2                        # Сколько одинаковых копий пода держать постоянно.
                                     # 2 = отказоустойчивость: один упал — второй работает.
                                     # Заодно демонстрирует балансировку нагрузки.
  selector:                          # Селектор: "по каким меткам Deployment находит свои поды".
    matchLabels:
      app: hello-nginx               # Ищет поды с меткой app=hello-nginx (см. template ниже).
                                     # ВАЖНО: должно совпадать с labels в template!
  template:                          # ШАБЛОН пода — описание, КАКИЕ поды создавать.
    metadata:
      labels:
        app: hello-nginx             # Метки, которые получит каждый новый под.
                                     # Совпадают с selector выше — иначе Deployment
                                     # не "усыновит" свои же поды.
    spec:                            # spec пода: что у него внутри.
      containers:                    # Список контейнеров в поде (обычно один).
      - name: hello                  # Имя контейнера внутри пода (для логов и kubectl exec).
        image: nginxdemos/hello:plain-text   # Docker-образ.
                                     # nginxdemos/hello — официальный демо-образ от Nginx,
                                     # отдаёт страничку с инфой: имя пода, его IP, заголовки.
                                     # Тег :plain-text = текстовый вывод (есть ещё :html).
                                     # Идеально для проверки балансировки — видно, какой
                                     # под ответил.
        ports:
        - containerPort: 80          # Порт, который слушает приложение ВНУТРИ контейнера.
                                     # Это информационное поле (документирует), фактическую
                                     # маршрутизацию делает Service ниже.

---                                  # YAML-разделитель, дальше второй ресурс.

# ============================================================
# БЛОК 2: Service — стабильный "адрес" для подов
# Поды смертны: умирают, перезапускаются, меняют IP.
# Service даёт постоянное имя и виртуальный IP внутри кластера,
# а также балансирует трафик между всеми подходящими подами.
# ============================================================
apiVersion: v1                       # Базовая API-группа (core), версия v1.
                                     # Тут живут Service, Pod, ConfigMap, Secret, PVC и т.д.
kind: Service                        # Тип ресурса: Service = "балансировщик и точка входа".
metadata:
  name: hello-nginx                  # Имя сервиса. Под этим именем доступен в DNS кластера:
                                     #   hello-nginx.default.svc.cluster.local
                                     # (или просто "hello-nginx" из того же namespace).
  namespace: default                 # Тот же namespace, где живут поды.
spec:
  selector:                          # ВАЖНО! Селектор подов: "в какие поды слать трафик".
    app: hello-nginx                 # Тот же лейбл, что и у подов из Deployment.
                                     # Service сам найдёт все 2 пода и будет round-robin
                                     # балансировать между ними.
  ports:                             # Маппинг портов: "снаружи Service → внутрь пода".
  - port: 80                         # port = на каком порту сам Service принимает трафик.
                                     # Этот порт виден другим сервисам в кластере.
    targetPort: 80                   # targetPort = на какой порт пода переслать запрос.
                                     # Совпадает с containerPort из Deployment.
                                     # Может отличаться (например, port:80 → targetPort:8080).
                                     # ТИП Service не указан → по умолчанию ClusterIP
                                     # (доступен только внутри кластера, наружу — через Ingress).
```

---

## 🔗 Как это всё работает в связке

```
        [ Ingress / любой другой клиент в кластере ]
                          │
                          │ обращается к "hello-nginx:80"
                          ▼
                ┌────────────────────────┐
                │  Service               │
                │  hello-nginx:80        │  ← стабильный ClusterIP + DNS
                │  (тип: ClusterIP)      │
                └─────────┬──────────────┘
                          │ балансировка по селектору app=hello-nginx
                ┌─────────┴─────────┐
                ▼                   ▼
            [ Pod-1 ]           [ Pod-2 ]      ← созданы Deployment'ом
            app=hello-nginx     app=hello-nginx
            nginxdemos:80       nginxdemos:80
                ▲
                │ контролирует и пересоздаёт
                │
        ┌───────────────────┐
        │  Deployment       │
        │  replicas: 2      │
        └───────────────────┘
```

**Логика:**
1. **Deployment** говорит k8s: «всегда держи 2 пода с этим образом, помеченных `app: hello-nginx`».
2. **Service** говорит: «всё, что приходит на меня по порту 80 — раскидай на поды с этой меткой».
3. Связующее звено — **метка `app: hello-nginx`**: она встречается в селекторе Deployment, в шаблоне пода и в селекторе Service.

