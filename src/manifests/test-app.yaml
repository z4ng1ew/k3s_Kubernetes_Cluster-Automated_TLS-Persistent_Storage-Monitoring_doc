## 💡 Возможные вопросы на защите

**В1: Какой тип Service по умолчанию и почему вы его не указали?**
> По умолчанию `ClusterIP` — сервис доступен только внутри кластера. Снаружи к нему попадёт трафик через Ingress, поэтому светить наружу его не нужно. Так безопаснее.

**В2: Зачем 2 реплики, а не 1?**
> Демонстрация ключевых фич k8s: отказоустойчивости и балансировки. Если убить один под (`kubectl delete pod`), Deployment мгновенно поднимет замену, а Service автоматически уберёт упавший под из балансировки. На демо-странице nginxdemos видно, какой именно под ответил — наглядно показывает round-robin.

**В3: Что будет, если `app: hello-nginx` не совпадёт в одном из трёх мест?**
> Связка сломается:
> - Если в `selector` Deployment'а — Deployment не "усыновит" свои поды и будет бесконечно создавать новые.
> - Если в `labels` пода — Service не найдёт подов и трафик уйдёт в никуда.
> - Если в `selector` Service'а — то же самое: пустой endpoint, ошибка 503.

**В4: Чем `containerPort` отличается от `targetPort`?**
> `containerPort` в Deployment — это **документирующее** поле, показывает, какой порт слушает приложение внутри контейнера. `targetPort` в Service — **реальный** порт, куда форвардится трафик. По смыслу должны совпадать, но Kubernetes не проверяет это автоматически.

**В5: Почему метка `app: hello-nginx` повторяется трижды?**
> Это три разные роли:
> 1. `selector` Deployment'а — «какие поды считать своими».
> 2. `template.metadata.labels` — «какие метки ставить на создаваемые поды».
> 3. `selector` Service'а — «в какие поды слать трафик».
> Все ссылаются на одну и ту же группу через общую метку — это базовый паттерн связи в k8s.

**В6: Что произойдёт при `kubectl scale deploy hello-nginx --replicas=5`?**
> Deployment поднимет ещё 3 пода (всего 5), Service автоматически добавит их в балансировку. Никаких ручных действий — это и есть декларативный подход k8s.

