apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: default
spec:
  replicas: 2                       
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello:plain-text  
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: default
spec:
  selector:
    app: hello-nginx
  ports:
  - port: 80
    targetPort: 80