## 🗣 Монолог для защиты (~300 символов)

> Чтобы протестировать связку Ingress-Nginx и cert-manager, я развернул минимальное приложение nginxdemos/hello. Deployment поддерживает 2 реплики для отказоустойчивости и проверки балансировки, а Service типа ClusterIP даёт им постоянное DNS-имя hello-nginx внутри кластера. Связь между ними — через метку app: hello-nginx.

*(длина ~340 символов, при желании подрежу под ровно 300)*

